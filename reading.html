<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#faf4eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>考研英语历年巅峰难度阅读研习系统 (2021-2025)</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root {
  --bg-main: #f4ede4;
  --bg-card: #fdfbf7;
  --bg-header: #faf4eb;
  --bg-pane: #fdfbf7;
  --text-main: #2d261e;
  --text-muted: #796c5e;
  --text-light: #a89a8a;
  --border-color: #e8ded2;
  --accent-color: #b45309;
  --accent-hover: #92400e;
  --accent-light: #fef3c7;
  --accent-border: #fde68a;
  --success-color: #15803d;
  --success-light: #f0fdf4;
  --success-border: #bbf7d0;
  --danger-color: #b91c1c;
  --danger-light: #fef2f2;
  --danger-border: #fecaca;
  --splitter-bg: #d7cbbd;
  --splitter-active: #b45309;
  --shadow-sm: 0 1px 2px 0 rgb(45 38 30 / 0.06);
  --shadow-md: 0 4px 6px -1px rgb(45 38 30 / 0.08), 0 2px 4px -2px rgb(45 38 30 / 0.06);
  --shadow-lg: 0 10px 15px -3px rgb(45 38 30 / 0.1), 0 4px 6px -4px rgb(45 38 30 / 0.08);
  --font-family-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-family-serif: "Georgia", "Cambria", "Times New Roman", Times, "Noto Serif SC", serif;
  --font-size-base: 16.5px;
  --line-height-base: 1.85;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

body {
  font-family: var(--font-family-sans);
  background-color: var(--bg-main);
  color: var(--text-main);
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: text;
}

/* Header */
header {
  background: var(--bg-header);
  border-bottom: 1px solid var(--border-color);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
  z-index: 20;
  transition: margin-top .26s cubic-bezier(.4, 0, .2, 1);
  will-change: margin-top;
}

.logo-group { display: flex; align-items: center; gap: 10px; }
.logo-home {
  color: var(--text-muted); text-decoration: none; font-size: 12.5px; font-weight: 600;
  padding: 4px 8px; border: 1px solid var(--border-color); border-radius: 6px;
  white-space: nowrap; transition: all .15s;
}
.logo-home:hover { color: var(--accent-color); border-color: var(--accent-color); background: var(--accent-light); }
.logo-badge {
  background: linear-gradient(135deg, #b45309, #d97706);
  color: #fff; font-weight: 800; font-size: 13px; padding: 4px 9px;
  border-radius: 6px; letter-spacing: 0.5px; white-space: nowrap;
}
.net-pill {
  font-size: 11px; color: var(--accent-color); background: var(--accent-light);
  border: 1px solid var(--accent-border); padding: 2px 7px; border-radius: 99px; font-weight: 600;
  white-space: nowrap;
}

.nav-controls {
  display: flex; align-items: center; gap: 10px; position: relative;
}

.icon-wrap { position: relative; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 38px; height: 34px; padding: 0;
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: 8px; cursor: pointer; font-size: 16px; line-height: 1;
  color: var(--text-main); transition: all .15s;
}
.icon-btn:hover, .icon-btn.active { border-color: var(--accent-color); background: var(--accent-light); }

.btn-nav {
  background: var(--bg-card); border: 1px solid var(--border-color);
  color: var(--text-main); padding: 5px 16px; border-radius: 6px;
  font-size: 13px; cursor: pointer; font-weight: 600; transition: all .15s;
}
.btn-nav:hover { border-color: var(--accent-color); color: var(--accent-color); }
.btn-nav.primary { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
.btn-nav.primary:hover { background: var(--accent-hover); color: #fff; }

.btn-tool {
  background: transparent; border: 1px solid var(--border-color);
  border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 600;
  color: var(--text-muted); cursor: pointer; transition: all .15s;
}
.btn-tool:hover { color: var(--accent-color); border-color: var(--accent-color); }
.btn-tool.active { background: var(--accent-light); color: var(--accent-color); border-color: var(--accent-border); }
.btn-tool.primary { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
.btn-tool.primary:hover { background: var(--accent-hover); color: #fff; }
.btn-tool:disabled { opacity: .5; cursor: not-allowed; }

/* Popovers */
.popover {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 60;
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14);
  padding: 12px 14px;
}
.pop-title { font-size: 12px; font-weight: 700; color: var(--text-muted); letter-spacing: .1em; margin-bottom: 10px; }

.timer-popover { min-width: 205px; }
.timer-pop-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
#timer-display { font-family: monospace; font-size: 15px; font-weight: 800; color: var(--text-main); }
.timer-pop-row { display: flex; gap: 8px; }
.timer-start-btn { font-family: monospace; }

.settings-popover { min-width: 210px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 7px 0; }
.set-label { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
.font-group { display: flex; gap: 6px; }

.directory-panel {
  width: 390px; max-width: calc(100vw - 24px);
  display: flex; flex-direction: column; gap: 10px; padding: 12px;
}
.dir-head { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; }
.dir-close { border: none; background: none; cursor: pointer; font-size: 14px; color: var(--text-muted); }
.dir-close:hover { color: var(--danger-color); }
.filter-tab-group {
  display: flex; background: var(--bg-main); padding: 3px; border-radius: 8px; border: 1px solid var(--border-color);
}
.filter-tab {
  flex: 1 1 auto; text-align: center; border: none; background: transparent;
  padding: 5px 10px; font-size: 12.5px; font-weight: 600; border-radius: 6px;
  color: var(--text-muted); cursor: pointer; transition: all .15s;
}
.filter-tab.active { background: var(--bg-card); color: var(--accent-color); box-shadow: var(--shadow-sm); }
.directory-list { max-height: 62vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.dir-item {
  display: flex; flex-direction: column; gap: 3px; text-align: left;
  background: var(--bg-main); border: 1px solid var(--border-color);
  border-radius: 8px; padding: 9px 11px; cursor: pointer; transition: all .12s;
}
.dir-item:hover, .dir-item.active { border-color: var(--accent-color); background: var(--accent-light); }
.dir-item-title { font-size: 13.5px; font-weight: 700; color: var(--text-main); }
.dir-item-meta { font-size: 11.5px; color: var(--text-muted); }

/* Records & Sync Popover */
.records-popover { width: 350px; max-width: calc(100vw - 24px); z-index: 320; max-height: 82vh; overflow-y: auto; }
.rec-section-title { font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: .08em; margin: 12px 0 6px; }
.rec-section-title:first-of-type { margin-top: 0; }
.rec-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rec-stat { background: var(--accent-light); border: 1px solid var(--accent-border); border-radius: 8px; padding: 7px 9px; }
.rec-stat .k { font-size: 10.5px; color: var(--text-muted); }
.rec-stat .v { font-size: 16px; font-weight: 800; color: var(--text-main); font-variant-numeric: tabular-nums; }
.gist-row { display: flex; margin-top: 6px; }
.gist-row input[type="password"], .gist-row input[type="text"] {
  flex: 1; border: 1px solid var(--border-color); border-radius: 7px; padding: 6px 8px;
  font-size: 12px; font-family: inherit; background: #fffdf8; color: var(--text-main); min-width: 0;
}
.gist-row input:focus { outline: none; border-color: var(--accent-color); }
.sync-opt { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--text-muted); cursor: pointer; user-select: none; }
.rec-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.rec-status { font-size: 11px; color: var(--text-muted); margin-top: 7px; line-height: 1.6; word-break: break-word; }

/* Badges */
.badge-tag { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; }
.badge-eng1 { background: #ede9fe; color: #6d28d9; }
.badge-eng2 { background: #dbeafe; color: #1e40af; }
.badge-diff-5 { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
.badge-diff-4 { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }

/* Main Split Workspace */
.main-layout {
  flex: 1 1 auto; min-height: 0; display: flex; position: relative; overflow: hidden;
}
.left-pane {
  width: 50%; min-width: 250px; max-width: calc(100% - 250px);
  height: 100%; overflow-y: auto; background: var(--bg-pane);
  padding: 26px 36px; font-family: var(--font-family-serif);
  font-size: var(--font-size-base); line-height: var(--line-height-base);
  scroll-behavior: smooth;
}
.passage-header {
  margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color);
  font-family: var(--font-family-sans);
}
.passage-title-main { font-size: 21px; font-weight: 700; margin-bottom: 8px; color: var(--text-main); }
.passage-meta-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 2px; }
.passage-meta-sub { font-size: 12.5px; color: var(--text-muted); }

.para-block { margin-bottom: 24px; border-radius: 8px; padding: 4px 8px; }
.para-index {
  font-family: var(--font-family-sans); font-size: 11.5px; font-weight: 700;
  color: var(--text-light); user-select: none; display: inline-block; margin-right: 6px;
}
.para-text { text-align: justify; letter-spacing: -0.01em; }
.para-text::selection { background: #fed7aa; color: #7c2d12; }

/* Splitter */
.splitter {
  width: 10px; height: 100%; background: var(--splitter-bg); cursor: col-resize;
  position: relative; flex-shrink: 0; user-select: none; z-index: 15; transition: background-color .15s;
}
.splitter:hover, .splitter.dragging { background: var(--splitter-active); }
.splitter-handle {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 6px; height: 38px; background: #a89a8a; border-radius: 4px; transition: background-color .15s;
}
.splitter:hover .splitter-handle, .splitter.dragging .splitter-handle { background: #fff; }

/* Right Pane: Questions */
.right-pane {
  flex: 1; min-width: 250px; height: 100%; overflow-y: auto;
  background: var(--bg-main); padding: 24px 28px; scroll-behavior: smooth;
}
.q-card {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: 12px; padding: 20px; margin-bottom: 24px;
  box-shadow: var(--shadow-sm); transition: border-color .2s, box-shadow .2s;
}
.q-card:hover { border-color: #cbd5e1; box-shadow: var(--shadow-md); }
.q-card.current { border-color: var(--accent-color); }
.q-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.q-num-badge {
  background: var(--accent-light); color: var(--accent-color); font-weight: 800;
  font-size: 14px; padding: 4px 10px; border-radius: 8px; flex-shrink: 0;
}
.q-stem { font-size: 15px; font-weight: 600; color: var(--text-main); line-height: 1.5; flex: 1; }

.options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.option-item {
  border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px;
  background: var(--bg-card); cursor: pointer; display: flex; align-items: flex-start;
  gap: 10px; transition: all .15s; user-select: none;
}
.option-item:hover { border-color: var(--accent-color); background: var(--accent-light); }
.option-letter {
  width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--text-light);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 12px; color: var(--text-muted); flex-shrink: 0; transition: all .15s;
}
.option-text { font-size: 14.5px; line-height: 1.55; color: var(--text-main); flex: 1; }
.option-item.selected { border-color: var(--accent-color); background: var(--accent-light); }
.option-item.selected .option-letter { background: var(--accent-color); border-color: var(--accent-color); color: #fff; }
.option-item.correct { border-color: var(--success-color) !important; background: var(--success-light) !important; }
.option-item.correct .option-letter { background: var(--success-color) !important; border-color: var(--success-color) !important; color: #fff !important; }
.option-item.wrong { border-color: var(--danger-color) !important; background: var(--danger-light) !important; }
.option-item.wrong .option-letter { background: var(--danger-color) !important; border-color: var(--danger-color) !important; color: #fff !important; }

/* Analysis */
.analysis-box {
  margin-top: 14px; padding: 14px; background: var(--bg-main); border-radius: 8px;
  border-left: 4px solid var(--accent-color); font-size: 13px; line-height: 1.6; display: none;
}
.analysis-box.show { display: block; }
.analysis-header { font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.badge-ans { background: var(--success-color); color: #fff; padding: 2px 7px; border-radius: 4px; font-size: 12.5px; font-weight: 700; }
.badge-ans-disputed { background: #fde68a !important; color: #92400e !important; border: 1px solid #f0c36d; }
.dispute-banner {
  background: #fff7e6; border: 1px solid #f0c36d; border-left: 4px solid #e8a33d;
  border-radius: 6px; padding: 10px 12px; margin: 8px 0; font-size: 13px; line-height: 1.7; color: #7a5214;
}
.dispute-banner .dispute-title { font-weight: 700; color: #b26a00; margin-bottom: 4px; }
.dispute-banner .dispute-note { margin-top: 6px; font-size: 12px; color: #8a6a34; }
.opt-an-list { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; }
.opt-an-row {
  display: flex; gap: 8px; align-items: flex-start; line-height: 1.6; font-size: 0.92em;
  background: rgba(0,0,0,0.03); border-left: 3px solid #c9b48a; padding: 6px 10px; border-radius: 4px;
}
.opt-an-row.opt-an-right { background: rgba(76,175,80,0.12); border-left-color: #4caf50; }
.opt-an-letter { flex: 0 0 auto; font-weight: 700; color: #8a6d3b; min-width: 1.2em; }
.opt-an-row.opt-an-right .opt-an-letter { color: #2e7d32; }
.opt-an-text { flex: 1 1 auto; }

/* Per-question Notes */
.q-note { border-top: 1px dashed var(--border-color); margin-top: 12px; padding-top: 9px; }
.q-note-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; color: var(--text-muted); }
.q-note-time { font-family: monospace; font-size: 11.5px; white-space: nowrap; }
.q-note-input {
  width: 100%; margin-top: 6px; border: 1px solid var(--border-color); border-radius: 8px;
  padding: 7px 10px; font-family: inherit; font-size: 13px; line-height: 1.65;
  resize: vertical; min-height: 34px; background: #fffdf8; color: var(--text-main);
}
.q-note-input:focus { outline: none; border-color: var(--accent-color); }
.q-note.saved .q-note-label { color: var(--accent-color); font-weight: 700; }
.q-status-ok { color: var(--success-color); font-weight: 700; }
.q-status-bad { color: var(--danger-color); font-weight: 700; }

/* Word Popup */
#word-popup {
  position: fixed; background: var(--bg-card); border: 1px solid var(--border-color);
  box-shadow: var(--shadow-lg); border-radius: 8px; padding: 10px 14px; font-size: 13px;
  z-index: 1000; display: none; max-width: 280px; line-height: 1.5;
}
#word-popup .wp-title { font-weight: 800; color: var(--accent-color); font-size: 14px; margin-bottom: 4px; }
#word-popup .wp-trans { color: var(--text-main); }

/* Bottom Bar */
.bottom-bar {
  background: var(--bg-header); border-top: 1px solid var(--border-color);
  padding: 8px 24px; display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; flex-shrink: 0;
}
.bottom-actions { display: flex; align-items: center; gap: 8px; }

/* Responsive */
@media (max-width: 900px) {
  header { padding: 7px 10px; gap: 6px; }
  .logo-group { gap: 6px; min-width: 0; }
  .logo-home { font-size: 11px; padding: 3px 6px; }
  .logo-badge { font-size: 11.5px; padding: 3px 7px; }
  .nav-controls { gap: 6px; }
  .nav-controls .icon-btn { width: 32px; height: 30px; font-size: 15px; }

  .main-layout { flex-direction: column; }
  .left-pane {
    width: 100% !important; max-width: none !important; min-width: 0 !important;
    flex: 0 0 50%; height: auto !important; min-height: 80px;
    -webkit-overflow-scrolling: touch; padding: 14px 14px 16px !important;
  }
  .right-pane {
    width: 100% !important; min-width: 0 !important; flex: 1 1 auto;
    height: auto !important; min-height: 0; -webkit-overflow-scrolling: touch;
    padding: 12px 12px 16px !important;
  }
  .splitter {
    width: 100% !important; height: 14px !important; flex: 0 0 14px !important;
    cursor: row-resize !important; touch-action: none;
    border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);
  }
  .splitter-handle { width: 44px !important; height: 4px !important; border-radius: 3px !important; }
  .directory-panel { width: calc(100vw - 16px); max-width: calc(100vw - 16px); }
  .records-popover { position: fixed; left: 8px; right: 8px; top: 48px; width: auto; max-width: none; max-height: 76vh; }
  .bottom-bar { padding: 8px 12px; }
}

@media (max-width: 480px) {
  header { padding: 6px 8px; gap: 4px; }
  .logo-home { font-size: 10px; padding: 2px 5px; }
  .logo-badge { font-size: 11px; padding: 2px 6px; }
  .nav-controls { gap: 5px; }
  .nav-controls .icon-btn { width: 30px; height: 28px; font-size: 14px; }
  .left-pane { padding: 12px 10px !important; }
  .right-pane { padding: 12px 8px !important; }
  .para-text { font-size: 16px; line-height: 1.72; }
  .option-item { padding: 10px; }
  .opt-an-row { font-size: 0.9em; padding: 6px 8px; }
}
</style>
</head>
<body>

<header id="app-header">
  <div class="logo-group">
    <a class="logo-home" href="index.html" title="返回首页">← 首页</a>
    <span class="logo-badge">巅峰阅读</span>
    <span class="net-pill" data-net-badge hidden>📴 离线模式</span>
  </div>

  <div class="nav-controls">
    <div class="icon-wrap">
      <button id="btn-timer-toggle" class="icon-btn" title="考试计时器" aria-label="计时器">⏱</button>
      <div id="timer-popover" class="popover timer-popover" hidden>
        <div class="timer-pop-title">考试倒计时 <span id="timer-display">18:00</span></div>
        <div class="timer-pop-row">
          <button id="btn-timer-start" class="btn-tool timer-start-btn" title="开始/暂停">▶ 开始</button>
          <button id="btn-timer-reset" class="btn-tool" title="重置为18分钟">↺ 重置</button>
        </div>
      </div>
    </div>

    <button id="btn-directory" class="icon-btn" title="目录" aria-label="目录">📑</button>

    <div class="icon-wrap">
      <button id="btn-records" class="icon-btn" title="学习记录 / 笔记 / 多端同步" aria-label="学习记录">📝</button>
      <div id="records-popover" class="popover records-popover" hidden>
        <div class="pop-title">学习记录</div>
        <div class="rec-section-title">本篇</div>
        <div class="rec-stats">
          <div class="rec-stat"><div class="k">已答</div><div class="v" id="rec-p-answered">0 / 5</div></div>
          <div class="rec-stat"><div class="k">正确率</div><div class="v" id="rec-p-acc">--</div></div>
          <div class="rec-stat"><div class="k">正确 / 错误</div><div class="v" id="rec-p-cw">0 / 0</div></div>
          <div class="rec-stat"><div class="k">累计用时</div><div class="v" id="rec-p-time">0:00</div></div>
        </div>
        <div class="rec-section-title">全部 17 篇</div>
        <div class="rec-stats">
          <div class="rec-stat"><div class="k">已答</div><div class="v" id="rec-g-answered">0 / 85</div></div>
          <div class="rec-stat"><div class="k">正确率</div><div class="v" id="rec-g-acc">--</div></div>
          <div class="rec-stat"><div class="k">正确 / 错误</div><div class="v" id="rec-g-cw">0 / 0</div></div>
          <div class="rec-stat"><div class="k">累计用时</div><div class="v" id="rec-g-time">0:00</div></div>
        </div>
        <div class="rec-section-title">多端双向同步（GitHub Gist）</div>
        <div class="gist-row"><input id="gist-token" type="password" placeholder="GitHub Token（仅需 gist 权限）" autocomplete="off"></div>
        <div class="gist-row"><input id="gist-id" type="text" placeholder="Gist ID（留空则自动查找已有或新建）" autocomplete="off"></div>
        <label class="sync-opt"><input id="gist-auto" type="checkbox" checked> 开启自动双向同步（联网自动合并，防覆盖）</label>
        <div class="rec-actions">
          <button id="btn-gist-sync" class="btn-tool primary">🔄 立即同步</button>
          <button id="btn-gist-save" class="btn-tool">保存配置</button>
          <button id="btn-backup-export" class="btn-tool">导出备份</button>
          <button id="btn-backup-import" class="btn-tool">导入合并</button>
          <input id="backup-file" type="file" accept="application/json,.json" hidden>
        </div>
        <div id="gist-status" class="rec-status"></div>
      </div>
    </div>

    <div class="icon-wrap">
      <button id="btn-settings" class="icon-btn" title="设置：模式与字号" aria-label="设置">⚙</button>
      <div id="settings-popover" class="popover settings-popover" hidden>
        <div class="pop-title">设置</div>
        <div class="set-row">
          <span class="set-label">模式</span>
          <button id="btn-toggle-mode" class="btn-tool" title="切换做题模式/精读解析模式">📝 自测做题</button>
        </div>
        <div class="set-row">
          <span class="set-label">字号</span>
          <div class="font-group">
            <button id="btn-font-dec" class="btn-tool" title="缩小字号">A-</button>
            <button id="btn-font-inc" class="btn-tool" title="放大字号">A+</button>
          </div>
        </div>
      </div>
    </div>

    <div id="directory-panel" class="popover directory-panel" hidden>
      <div class="dir-head">
        <span>📑 选择篇章</span>
        <button id="btn-dir-close" class="dir-close" title="关闭">✕</button>
      </div>
      <div class="filter-tab-group">
        <button class="filter-tab active" data-filter="all">全部 (17篇)</button>
        <button class="filter-tab" data-filter="英语一">英语一 (8篇)</button>
        <button class="filter-tab" data-filter="英语二">英语二 (9篇)</button>
      </div>
      <div id="directory-list" class="directory-list"></div>
    </div>
  </div>
</header>

<div class="main-layout" id="workspace">
  <div class="left-pane" id="passage-pane">
    <div class="passage-header">
      <h2 id="passage-title" class="passage-title-main"></h2>
      <div class="passage-meta-line">
        <span id="badge-exam" class="badge-tag badge-eng1">英语一</span>
        <span id="badge-diff" class="badge-tag badge-diff-5">困难★★★★★</span>
        <span id="passage-meta-sub" class="passage-meta-sub"></span>
      </div>
    </div>
    <div id="paragraphs-container"></div>
  </div>

  <div class="splitter" id="splitter" title="拖拽调节分栏比例（双击复位 50%）">
    <div class="splitter-handle"></div>
  </div>

  <div class="right-pane" id="questions-pane">
    <div id="questions-container"></div>
  </div>
</div>

<div class="bottom-bar">
  <div class="bottom-actions">
    <button id="btn-check-all" class="btn-nav primary">核对</button>
    <button id="btn-reset-answers" class="btn-nav">清空</button>
  </div>
</div>

<div id="word-popup"></div>

<script src="data/reading-data.js"></script>
<script src="sync.js"></script>
<script src="pwa.js" defer></script>
<script>
(function () {
  'use strict';

  var READING_DATA = window.READING_DATA || [];
  var GLOSSARY = window.GLOSSARY || {};
  var Sync = window.KaoyanSync;
  var FONT_LS = 'kaoyan_reading_fontsize';

  function $(id) { return document.getElementById(id); }

  // Persistent state (single source of truth)
  var readingNotes = Sync.loadReadingNotes();
  var readingLog = Sync.loadReadingLog();

  // Ephemeral UI state
  var currentIndex = 0;
  var filteredData = READING_DATA.slice();
  var mode = 'practice'; // 'practice' | 'analysis'
  var currentFontSize = parseFloat(localStorage.getItem(FONT_LS)) || 16.5;
  var timerSeconds = 18 * 60;
  var timerInterval = null;
  var timerRunning = false;
  var passageSeenAt = 0;
  var qSeenAt = {};
  var qObs = null;

  // DOM refs
  var header = $('app-header');
  var passagePane = $('passage-pane');
  var workspace = $('workspace');
  var splitter = $('splitter');
  var directoryList = $('directory-list');
  var directoryPanel = $('directory-panel');
  var btnDirectory = $('btn-directory');
  var timerPopover = $('timer-popover');
  var btnTimerToggle = $('btn-timer-toggle');
  var timerDisplay = $('timer-display');
  var btnTimerStart = $('btn-timer-start');
  var recordsPopover = $('records-popover');
  var btnRecords = $('btn-records');
  var settingsPopover = $('settings-popover');
  var btnSettings = $('btn-settings');
  var btnToggleMode = $('btn-toggle-mode');
  var wordPopup = $('word-popup');

  passagePane.style.setProperty('--font-size-base', currentFontSize + 'px');

  /* ---------- Helpers ---------- */
  function currentItem() { return filteredData[currentIndex] || null; }

  function getActiveRecord(itemId, qNum) {
    var rec = (readingLog[itemId] || {})[qNum];
    return (rec && !rec.deleted && rec.answer) ? rec : null;
  }

  function fmtDur(ms) {
    var s = Math.round(Math.max(0, ms || 0) / 1000);
    if (s < 60) return s + ' 秒';
    var m = Math.floor(s / 60); s = s % 60;
    return m + ' 分 ' + (s < 10 ? '0' : '') + s + ' 秒';
  }

  function clock(ms) {
    var s = Math.round(Math.max(0, ms || 0) / 1000);
    var m = Math.floor(s / 60); s = s % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  /* ---------- Popovers (mutually exclusive) ---------- */
  var popovers = [
    { btn: btnTimerToggle, panel: timerPopover },
    { btn: btnDirectory, panel: directoryPanel },
    { btn: btnRecords, panel: recordsPopover },
    { btn: btnSettings, panel: settingsPopover }
  ];

  function closePopovers(exceptPanel) {
    popovers.forEach(function (p) {
      if (p.panel && p.panel !== exceptPanel) {
        p.panel.hidden = true;
        if (p.btn) p.btn.classList.remove('active');
      }
    });
  }

  function togglePopover(btn, panel, onOpen) {
    var willOpen = panel.hidden;
    closePopovers(panel);
    panel.hidden = !willOpen;
    btn.classList.toggle('active', willOpen);
    if (willOpen && onOpen) onOpen();
  }

  btnTimerToggle.addEventListener('click', function (e) {
    e.stopPropagation();
    togglePopover(btnTimerToggle, timerPopover);
  });
  btnDirectory.addEventListener('click', function (e) {
    e.stopPropagation();
    togglePopover(btnDirectory, directoryPanel, markActiveDirItem);
  });
  $('btn-dir-close').addEventListener('click', function () { closePopovers(); });
  btnRecords.addEventListener('click', function (e) {
    e.stopPropagation();
    togglePopover(btnRecords, recordsPopover, function () {
      renderRecords();
      syncUI.refresh();
    });
  });
  btnSettings.addEventListener('click', function (e) {
    e.stopPropagation();
    togglePopover(btnSettings, settingsPopover);
  });
  document.addEventListener('click', function (e) {
    var inside = popovers.some(function (p) {
      return (p.panel && p.panel.contains(e.target)) || (p.btn && p.btn.contains(e.target));
    });
    if (!inside) closePopovers();
  });

  /* ---------- Directory & Filtering ---------- */
  function populateDirectory(filter) {
    filteredData = READING_DATA.filter(function (item) {
      return filter === 'all' || item.exam === filter;
    });
    directoryList.innerHTML = '';
    filteredData.forEach(function (item, idx) {
      var row = document.createElement('button');
      row.className = 'dir-item';
      row.dataset.idx = idx;
      row.innerHTML = '<span class="dir-item-title">' + item.text_num + ' · ' + item.title +
        '</span><span class="dir-item-meta">' + item.exam + ' · ' + item.year + ' · ' + item.difficulty + '</span>';
      row.addEventListener('click', function () {
        closePopovers();
        currentIndex = idx;
        loadCurrentText();
      });
      directoryList.appendChild(row);
    });
    currentIndex = 0;
    loadCurrentText();
  }

  function markActiveDirItem() {
    directoryList.querySelectorAll('.dir-item').forEach(function (el) {
      el.classList.toggle('active', parseInt(el.dataset.idx, 10) === currentIndex);
    });
  }

  document.querySelectorAll('.filter-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.filter-tab').forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      populateDirectory(tab.dataset.filter);
    });
  });

  /* ---------- Stats & Records ---------- */
  function computePassage(item) {
    var answered = 0, correct = 0, time = 0;
    item.questions.forEach(function (q) {
      var r = getActiveRecord(item.id, q.q_num);
      if (r) { answered++; if (r.correct) correct++; time += r.timeMs || 0; }
    });
    return { answered: answered, correct: correct, time: time, total: item.questions.length, acc: answered ? Math.round(correct / answered * 100) : 0 };
  }

  function computeGlobal() {
    var answered = 0, correct = 0, time = 0, total = 0;
    READING_DATA.forEach(function (item) {
      total += item.questions.length;
      var s = computePassage(item);
      answered += s.answered; correct += s.correct; time += s.time;
    });
    return { answered: answered, correct: correct, time: time, total: total, acc: answered ? Math.round(correct / answered * 100) : 0 };
  }

  function renderRecords() {
    var item = currentItem();
    var ps = item ? computePassage(item) : { answered: 0, correct: 0, time: 0, total: 0, acc: 0 };
    var gs = computeGlobal();
    $('rec-p-answered').textContent = ps.answered + ' / ' + ps.total;
    $('rec-p-acc').textContent = ps.answered ? ps.acc + '%' : '--';
    $('rec-p-cw').textContent = ps.correct + ' / ' + (ps.answered - ps.correct);
    $('rec-p-time').textContent = clock(ps.time);
    $('rec-g-answered').textContent = gs.answered + ' / ' + gs.total;
    $('rec-g-acc').textContent = gs.answered ? gs.acc + '%' : '--';
    $('rec-g-cw').textContent = gs.correct + ' / ' + (gs.answered - gs.correct);
    $('rec-g-time').textContent = clock(gs.time);
  }

  function refreshQuestionMeta() {
    var item = currentItem();
    if (!item) return;
    item.questions.forEach(function (q) {
      var el = $('q-meta-' + q.q_num);
      if (!el) return;
      var r = getActiveRecord(item.id, q.q_num);
      var t = (r && r.timeMs) ? ('用时 ' + fmtDur(r.timeMs)) : '用时 --';
      var s = ' · 未作答';
      if (r) {
        if (mode === 'analysis') {
          s = r.correct ? ' · <span class="q-status-ok">✔ 正确</span>' : ' · <span class="q-status-bad">✘ 错误</span>';
        } else {
          s = ' · 已作答';
        }
      }
      el.innerHTML = t + s;
    });
  }

  /* ---------- Render Passage & Questions ---------- */
  function loadCurrentText() {
    var item = currentItem();
    if (!item) return;

    passageSeenAt = Date.now();
    qSeenAt = {};

    var badgeExam = $('badge-exam');
    badgeExam.textContent = item.exam;
    badgeExam.className = 'badge-tag ' + (item.exam === '英语一' ? 'badge-eng1' : 'badge-eng2');
    var badgeDiff = $('badge-diff');
    badgeDiff.textContent = item.difficulty;
    badgeDiff.className = 'badge-tag ' + (item.difficulty.includes('★★★★★') ? 'badge-diff-5' : 'badge-diff-4');

    $('passage-title').textContent = item.text_num + ': ' + item.title;
    $('passage-meta-sub').textContent = item.year + '年真题 · ' + item.exam + ' · 难度评级: ' + item.difficulty;
    markActiveDirItem();

    // Paragraphs
    var pBox = $('paragraphs-container');
    pBox.innerHTML = '';
    item.paragraphs.forEach(function (pText, pIdx) {
      var pDiv = document.createElement('div');
      pDiv.className = 'para-block';
      pDiv.id = 'para-' + (pIdx + 1);

      var pIndexSpan = document.createElement('span');
      pIndexSpan.className = 'para-index';
      pIndexSpan.textContent = '[Para ' + (pIdx + 1) + ']';

      var pContentSpan = document.createElement('span');
      pContentSpan.className = 'para-text';
      pContentSpan.textContent = pText;

      pDiv.appendChild(pIndexSpan);
      pDiv.appendChild(pContentSpan);
      pBox.appendChild(pDiv);
    });

    // Questions
    var qBox = $('questions-container');
    qBox.innerHTML = '';
    item.questions.forEach(function (q) {
      var card = document.createElement('div');
      card.className = 'q-card';
      card.id = 'q-card-' + q.q_num;
      card.dataset.q = q.q_num;

      var qHeader = document.createElement('div');
      qHeader.className = 'q-header';
      var badge = document.createElement('span');
      badge.className = 'q-num-badge';
      badge.textContent = '第 ' + q.q_num + ' 题';
      var stem = document.createElement('div');
      stem.className = 'q-stem';
      stem.textContent = q.stem;
      qHeader.appendChild(badge);
      qHeader.appendChild(stem);
      card.appendChild(qHeader);

      // Options
      var optList = document.createElement('div');
      optList.className = 'options-list';
      ['A', 'B', 'C', 'D'].forEach(function (letter) {
        if (!q.options || !q.options[letter]) return;
        var optItem = document.createElement('div');
        optItem.className = 'option-item';
        optItem.id = 'opt-' + item.id + '-' + q.q_num + '-' + letter;

        var letterBadge = document.createElement('span');
        letterBadge.className = 'option-letter';
        letterBadge.textContent = letter;
        var optText = document.createElement('span');
        optText.className = 'option-text';
        optText.textContent = q.options[letter];

        optItem.appendChild(letterBadge);
        optItem.appendChild(optText);
        optItem.addEventListener('click', function () {
          selectOption(item.id, q, letter);
        });
        optList.appendChild(optItem);
      });
      card.appendChild(optList);

      // Analysis
      var analysisBox = document.createElement('div');
      analysisBox.className = 'analysis-box';
      analysisBox.id = 'analysis-' + q.q_num;

      var hintHtml = '';
      if (q.hint || q.question_type) {
        var qtype = q.question_type || (q.hint ? q.hint.type : '');
        hintHtml = '<div><strong>【考查题型】</strong> ' + qtype + '</div>' +
          '<div style="margin-top:4px;"><strong>【解题要点】</strong> ' + (q.hint ? q.hint.focus : '') + '</div>';
      }
      if (q.option_analysis) {
        var optRows = '';
        ['A', 'B', 'C', 'D'].forEach(function (L) {
          var txt = q.option_analysis[L] || '';
          if (!txt) return;
          var cls = txt.indexOf('【正解】') === 0 ? 'opt-an-row opt-an-right' : 'opt-an-row';
          optRows += '<div class="' + cls + '"><span class="opt-an-letter">' + L + '</span>' +
            '<span class="opt-an-text">' + txt + '</span></div>';
        });
        hintHtml += '<div style="margin-top:10px;"><strong>【逐选项解析】</strong></div>' +
          '<div class="opt-an-list">' + optRows + '</div>';
      }

      var disputedHtml = '';
      if (q.disputed) {
        disputedHtml = '<div class="dispute-banner">' +
          '<div class="dispute-title">⚠️ 本题为争议题（答案不唯一）</div>' +
          '<div>主流答案：<strong>' + q.answerPrimary + '</strong> —— ' + (q.options[q.answerPrimary] || '') + '</div>' +
          '<div>争议答案：<strong>' + q.answerAlt + '</strong> —— ' + (q.options[q.answerAlt] || '') + '</div>' +
          '<div class="dispute-note">' + (q.disputeNote || '') + '</div></div>';
      }
      var ansLabel = q.disputed
        ? '<span class="badge-ans badge-ans-disputed">' + q.answerPrimary + ' (争议)</span>'
        : '<span class="badge-ans">' + q.answer + '</span>';
      analysisBox.innerHTML = '<div class="analysis-header"><span>官方标准答案:</span>' + ansLabel + '</div>' +
        disputedHtml + hintHtml;
      card.appendChild(analysisBox);

      // Per-question Note
      var nk = item.id + '::' + q.q_num;
      var noteWrap = document.createElement('div');
      noteWrap.className = 'q-note';
      noteWrap.id = 'q-note-wrap-' + q.q_num;
      var noteHead = document.createElement('div');
      noteHead.className = 'q-note-head';
      noteHead.innerHTML = '<span class="q-note-label">📝 本题笔记</span><span class="q-note-time" id="q-meta-' + q.q_num + '">用时 -- · 未作答</span>';
      var ta = document.createElement('textarea');
      ta.className = 'q-note-input';
      ta.id = 'q-note-' + q.q_num;
      ta.rows = 2;
      ta.placeholder = '记录本题错因、定位句、生词…（自动保存并同步）';
      var noteEntry = readingNotes[nk];
      ta.value = noteEntry ? (noteEntry.text || '') : '';
      if (ta.value.trim()) noteWrap.classList.add('saved');
      ta.addEventListener('input', function () {
        readingNotes[nk] = { text: ta.value, updatedAt: Date.now() };
        Sync.saveReadingNotes(readingNotes);
        Sync.markDirty();
        noteWrap.classList.toggle('saved', !!ta.value.trim());
      });
      noteWrap.appendChild(noteHead);
      noteWrap.appendChild(ta);
      card.appendChild(noteWrap);

      qBox.appendChild(card);
    });

    // Observe when each question enters view for per-question timing
    if (qObs) { qObs.disconnect(); qObs = null; }
    if ('IntersectionObserver' in window) {
      qObs = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) {
            var qn = parseInt(en.target.dataset.q, 10);
            if (qn && !qSeenAt[qn]) qSeenAt[qn] = Date.now();
            qObs.unobserve(en.target);
          }
        });
      }, { threshold: 0.35 });
      qBox.querySelectorAll('.q-card').forEach(function (c) { qObs.observe(c); });
    }

    updateAnswerUI();
    refreshQuestionMeta();
    renderRecords();
    resetTimer();
  }

  function selectOption(itemId, q, letter) {
    var now = Date.now();
    var prev = (readingLog[itemId] || {})[q.q_num];
    var prevValid = (prev && !prev.deleted) ? prev : null;
    var start = qSeenAt[q.q_num] || passageSeenAt || now;
    if (!readingLog[itemId]) readingLog[itemId] = {};
    readingLog[itemId][q.q_num] = {
      answer: letter,
      correct: letter === q.answer,
      timeMs: (prevValid && prevValid.timeMs) ? prevValid.timeMs : Math.max(0, now - start),
      answeredAt: new Date(now).toISOString(),
      updatedAt: now,
      attempts: ((prevValid && prevValid.attempts) || 0) + 1
    };
    Sync.saveReadingLog(readingLog);
    Sync.markDirty();
    updateAnswerUI();
    refreshQuestionMeta();
    renderRecords();
  }

  function updateAnswerUI() {
    var item = currentItem();
    if (!item) return;
    item.questions.forEach(function (q) {
      var rec = getActiveRecord(item.id, q.q_num);
      var chosen = rec ? rec.answer : '';
      ['A', 'B', 'C', 'D'].forEach(function (letter) {
        var optEl = $('opt-' + item.id + '-' + q.q_num + '-' + letter);
        if (!optEl) return;
        optEl.classList.remove('selected', 'correct', 'wrong');
        if (chosen === letter) optEl.classList.add('selected');
        if (mode === 'analysis') {
          if (letter === q.answer) optEl.classList.add('correct');
          else if (chosen === letter && chosen !== q.answer) optEl.classList.add('wrong');
        }
      });
      var analysis = $('analysis-' + q.q_num);
      if (analysis) analysis.classList.toggle('show', mode === 'analysis');
    });
  }

  function scrollToQuestion(qNum) {
    var el = $('q-card-' + qNum);
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.querySelectorAll('.q-card').forEach(function (c) { c.classList.remove('current'); });
    el.classList.add('current');
  }

  /* ---------- Mode, Font Size, Timer, Actions ---------- */
  function setMode(nextMode) {
    mode = nextMode;
    if (mode === 'analysis') {
      btnToggleMode.textContent = '📖 精读解析';
      btnToggleMode.classList.add('active');
    } else {
      btnToggleMode.textContent = '📝 自测做题';
      btnToggleMode.classList.remove('active');
    }
    updateAnswerUI();
    refreshQuestionMeta();
  }

  btnToggleMode.addEventListener('click', function () {
    setMode(mode === 'practice' ? 'analysis' : 'practice');
  });

  function changeFont(delta) {
    var next = Math.min(24, Math.max(13, currentFontSize + delta));
    if (next === currentFontSize) return;
    currentFontSize = next;
    passagePane.style.setProperty('--font-size-base', currentFontSize + 'px');
    try { localStorage.setItem(FONT_LS, String(currentFontSize)); } catch (e) {}
  }
  $('btn-font-inc').addEventListener('click', function () { changeFont(1.5); });
  $('btn-font-dec').addEventListener('click', function () { changeFont(-1.5); });

  function updateTimerUI() {
    var mins = Math.floor(timerSeconds / 60);
    var secs = timerSeconds % 60;
    timerDisplay.textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    timerDisplay.style.color = timerSeconds <= 120 ? '#b91c1c' : 'var(--text-main)';
  }

  function resetTimer() {
    clearInterval(timerInterval);
    timerRunning = false;
    timerSeconds = 18 * 60;
    btnTimerStart.textContent = '▶ 开始';
    updateTimerUI();
  }

  btnTimerStart.addEventListener('click', function () {
    if (timerRunning) {
      clearInterval(timerInterval);
      timerRunning = false;
      btnTimerStart.textContent = '▶ 继续';
    } else {
      timerRunning = true;
      btnTimerStart.textContent = '⏸ 暂停';
      timerInterval = setInterval(function () {
        if (timerSeconds > 0) {
          timerSeconds--;
          updateTimerUI();
        } else {
          clearInterval(timerInterval);
          timerRunning = false;
          btnTimerStart.textContent = '▶ 开始';
          alert('时间到！本篇做题倒计时结束。');
        }
      }, 1000);
    }
  });
  $('btn-timer-reset').addEventListener('click', resetTimer);

  $('btn-check-all').addEventListener('click', function () {
    setMode('analysis');
    renderRecords();
  });

  $('btn-reset-answers').addEventListener('click', function () {
    var item = currentItem();
    if (!item) return;
    if (!confirm('确认清空当前篇章的所有答题记录以重新练习吗？（笔记不会清空）')) return;
    var now = Date.now();
    if (!readingLog[item.id]) readingLog[item.id] = {};
    item.questions.forEach(function (q) {
      readingLog[item.id][q.q_num] = { deleted: true, updatedAt: now };
    });
    Sync.saveReadingLog(readingLog);
    Sync.markDirty();
    qSeenAt = {};
    passageSeenAt = now;
    updateAnswerUI();
    refreshQuestionMeta();
    renderRecords();
  });

  /* ---------- Draggable Splitter ---------- */
  var isDragging = false, dragStartPos = 0, dragStartSize = 0;
  function isMobileLayout() { return window.matchMedia('(max-width: 900px)').matches; }

  function beginDrag(x, y) {
    isDragging = true;
    splitter.classList.add('dragging');
    var rect = passagePane.getBoundingClientRect();
    dragStartPos = isMobileLayout() ? y : x;
    dragStartSize = isMobileLayout() ? rect.height : rect.width;
  }

  function moveDrag(x, y) {
    if (!isDragging) return;
    var wr = workspace.getBoundingClientRect();
    if (isMobileLayout()) {
      var newH = Math.max(80, Math.min(wr.height - 120, dragStartSize + (y - dragStartPos)));
      passagePane.style.flex = '0 0 ' + newH + 'px';
      passagePane.style.width = '100%';
    } else {
      var offsetX = x - wr.left;
      if (offsetX >= wr.width * 0.22 && offsetX <= wr.width * 0.78) {
        passagePane.style.flex = '0 0 auto';
        passagePane.style.width = ((offsetX / wr.width) * 100) + '%';
      }
    }
  }

  function endDrag() {
    if (!isDragging) return;
    isDragging = false;
    splitter.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }

  splitter.addEventListener('mousedown', function (e) {
    beginDrag(e.clientX, e.clientY);
    document.body.style.cursor = isMobileLayout() ? 'row-resize' : 'col-resize';
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', function (e) { moveDrag(e.clientX, e.clientY); });
  document.addEventListener('mouseup', endDrag);
  splitter.addEventListener('touchstart', function (e) {
    if (e.touches[0]) beginDrag(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (!isDragging || !e.touches[0]) return;
    moveDrag(e.touches[0].clientX, e.touches[0].clientY);
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', endDrag);

  splitter.addEventListener('dblclick', function () {
    if (isMobileLayout()) {
      passagePane.style.flex = '0 0 50%';
      passagePane.style.width = '100%';
    } else {
      passagePane.style.flex = '0 0 auto';
      passagePane.style.width = '50%';
    }
  });
  window.addEventListener('resize', function () {
    passagePane.style.flex = '';
    passagePane.style.width = '';
    passagePane.style.height = '';
  });

  /* ---------- Word Glossary Popup & Shortcuts ---------- */
  document.addEventListener('mouseup', function (e) {
    var sel = window.getSelection();
    var word = sel ? sel.toString().trim().toLowerCase().replace(/[^a-z]/g, '') : '';
    if (word && word.length > 2 && GLOSSARY[word] && sel.rangeCount) {
      var rect = sel.getRangeAt(0).getBoundingClientRect();
      wordPopup.innerHTML = '<div class="wp-title">🔍 ' + word + '</div><div class="wp-trans">' + GLOSSARY[word] + '</div>';
      wordPopup.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 292)) + 'px';
      wordPopup.style.top = Math.min(rect.bottom + 8, window.innerHeight - 80) + 'px';
      wordPopup.style.display = 'block';
    } else if (!wordPopup.contains(e.target)) {
      wordPopup.style.display = 'none';
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
    if (['1', '2', '3', '4', '5'].includes(e.key)) {
      var item = currentItem();
      var q = item && item.questions[parseInt(e.key, 10) - 1];
      if (q) scrollToQuestion(q.q_num);
    }
  });

  /* ---------- Header Auto-Collapse on Scroll ---------- */
  (function () {
    var lastMap = new WeakMap();
    function setHidden(v) {
      var cur = header.dataset.autoHidden === '1';
      if (cur === v) return;
      header.dataset.autoHidden = v ? '1' : '0';
      header.style.marginTop = v ? (-header.offsetHeight) + 'px' : '0px';
    }
    document.addEventListener('scroll', function (e) {
      var t = e.target;
      var sc = (t === document || t === window) ? (document.scrollingElement || document.documentElement) : t;
      if (!sc || typeof sc.scrollTop !== 'number') return;
      // 避免滚动目录/记录弹层时误把顶栏收起
      if (header.contains(sc)) return;
      var y = sc.scrollTop;
      var prev = lastMap.has(sc) ? lastMap.get(sc) : y;
      lastMap.set(sc, y);
      var dy = y - prev;
      if (Math.abs(dy) < 6) return;
      if (y <= 6) { setHidden(false); return; }
      if (dy > 0 && y > 40) setHidden(true);
      else if (dy < 0) setHidden(false);
    }, true);
    window.addEventListener('resize', function () {
      if (header.dataset.autoHidden === '1') header.style.marginTop = (-header.offsetHeight) + 'px';
    });
  })();

  /* ---------- Multi-Device Sync Binding ---------- */
  var syncUI = Sync.bindSyncUI({
    tokenInput: $('gist-token'),
    gistIdInput: $('gist-id'),
    autoSyncCheckbox: $('gist-auto'),
    btnSync: $('btn-gist-sync'),
    btnSave: $('btn-gist-save'),
    btnExport: $('btn-backup-export'),
    btnImport: $('btn-backup-import'),
    importFile: $('backup-file'),
    statusEl: $('gist-status'),
    errColor: 'var(--danger-color)'
  });

  window.addEventListener('kaoyan:data-synced', function (ev) {
    if (!ev.detail || !ev.detail.localChanged) return;
    readingNotes = Sync.loadReadingNotes();
    readingLog = Sync.loadReadingLog();
    updateAnswerUI();
    refreshQuestionMeta();
    renderRecords();
    var item = currentItem();
    if (item) {
      item.questions.forEach(function (q) {
        var ta = $('q-note-' + q.q_num);
        var wrap = $('q-note-wrap-' + q.q_num);
        if (!ta || document.activeElement === ta) return;
        var entry = readingNotes[item.id + '::' + q.q_num];
        ta.value = entry ? (entry.text || '') : '';
        if (wrap) wrap.classList.toggle('saved', !!ta.value.trim());
      });
    }
  });

  populateDirectory('all');
})();
</script>
</body>
