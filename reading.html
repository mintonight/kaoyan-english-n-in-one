to analyze their rationale. And people made car-buying decisions that were both objectively better and more personally satisfying when asked to focus on their feelings rather than on details, but only if the decision was complex- when they had a lot of information to process.", "Intuition's special powers are unleashed only in certain circumstances. In one study, participants completed a battery of eight tasks, including four that tapped reflective thinking ( discerning rules, comprehending vocabulary) and four that tapped intuition and creativity (generating new products or figures of speech). Then they rated the degree to which they had used intuition (\" gut feelings,\" \"hunches,\" \"my heart\"). Use of their gut hurt their performance on the first four tasks, as expected, and helped them on the rest. Sometimes the heart is smarter than the head."], "questions": [{"q_num": 36, "stem": "Nalini Ambady's study deals with __ _", "options": {"A": "the power of people's memory", "B": "the reliability of first impressions", "C": "instructor-student interaction", "D": "people's ability to influence others"}, "answer": "B", "hint": {"para": 1, "type": "细节题", "focus": "第一段指出Ambady的研究着力于验证人们依据极短第一印象做出判断的可靠性（reliability of first impressions）。"}, "question_type": "细节题", "option_analysis": {"A": "【偷换概念】研究考察的是第一印象判断，而非记忆力。", "B": "【正解】第一段指出Ambady的薄片研究验证人们凭极短第一印象判断他人（如教师评价）的准确性，即第一印象的可靠性。", "C": "【范围缩小】师生互动只是实验中一个素材，非研究主题。", "D": "【无中生有】研究不涉及影响他人的能力。"}}, {"q_num": 37, "stem": "In Ambady's study, rating accuracy dropped when participants __ _", "options": {"A": "focused on specific details", "B": "gave the rating in limited time", "C": "watched shorter video clips", "D": "discussed with one another"}, "answer": "A", "hint": {"para": 2, "type": "细节题", "focus": "学生仅通过观看两秒无声视频对教师的打分，与学期末深思熟虑的综合评教结果高度一致。"}, "question_type": "细节题", "option_analysis": {"A": "【正解】第二段指出当参与者写下判断理由后准确率大幅下降，因为深思让人聚焦于生动却误导的细节线索，即关注具体细节。", "B": "【无中生有】原文未说评分时间受限导致准确率下降。", "C": "【正反混淆】原文反而显示看更短片段也能准确判断。", "D": "【无中生有】实验中并无参与者相互讨论。"}}, {"q_num": 38, "stem": "Judith Hall mentions driving to show that __ _", "options": {"A": "reflection can be distracting", "B": "memory may be selective", "C": "social skills must be cultivated", "D": "deception is difficult to detect"}, "answer": "A", "hint": {"para": 3, "type": "例证题", "focus": "通过对外科医生声调切片的分析，甚至可以精准预测其未来被患者起诉医疗事故的概率。"}, "question_type": "例证题", "option_analysis": {"A": "【正解】第三段引用心理学家以开手动挡作类比，说明过度思考会干扰自动化处理，即反思会分散注意力（reflection can be distracting）。", "B": "【无中生有】类比未说明记忆是选择性的。", "C": "【无中生有】类比不涉及社交技巧需培养。", "D": "【偷换概念】开车的类比针对反思的干扰作用，而非识别欺骗的难度。"}}, {"q_num": 39, "stem": "When you are making complex decisions, it is advisable to __ _", "options": {"A": "collect enough data", "B": "list your preferences", "C": "seek expert advice", "D": "follow your feelings"}, "answer": "D", "hint": {"para": 4, "type": "细节题", "focus": "大脑的直觉系统能够在毫秒内捕捉微表情与肢体语言，比语言层面的逻辑推理更为敏锐。"}, "question_type": "细节题", "option_analysis": {"A": "【无中生有】原文未主张收集足够数据。", "B": "【正反混淆】第二段显示分析理由（列偏好）反而降低准确度。", "C": "【无中生有】原文未提寻求专家建议作为建议做法。", "D": "【正解】第四段指出面对复杂决策时，关注感受（focus on feelings）做出的购车决定客观更好且更令人满意。"}}, {"q_num": 40, "stem": "What can we learn from the last paragraph?", "options": {"A": "Generating new products takes time.", "B": "Intuition may affect reflective tasks.", "C": "Vocabulary comprehension needs creativity.", "D": "Objective thinking may boost intuitiveness."}, "answer": "B", "hint": {"para": 5, "type": "推断题", "focus": "科学剖析了潜意识直觉的力量，提示我们在特定社会交往场景中应当重视直觉信号的价值。"}, "question_type": "推断题", "option_analysis": {"A": "【无中生有】末段未讨论生成新产品需要时间。", "B": "【正解】末段实验显示运用直觉（gut feelings）反而损害前四项反思类任务（reflective tasks）的表现，即直觉可能影响反思性任务。", "C": "【偷换概念】词汇理解属反思类任务，原文未说其需要创造力。", "D": "【正反混淆】原文说直觉利于创意任务、损害反思任务，而非客观思维提升直觉。"}}], "detailed_analysis": "心理学家Nalini Ambady的薄片认知实验表明，人们凭借数秒钟的短暂切片（thin slices）所形成的直觉第一印象，在预测教学评估、医生诉讼风险等方面的准确率惊人地高于深思熟虑。揭示了人类大脑潜意识快速模式匹配的演化优势。", "keywords": [{"word": "thin slice", "trans": "n. 薄片，微量行为切片"}, {"word": "glimpse", "trans": "n./v. 一瞥，短暂感受"}, {"word": "unconscious", "trans": "adj. 潜意识的，无意识的"}, {"word": "intuition", "trans": "n. 直觉，第六感"}, {"word": "deliberation", "trans": "n. 审思，深思熟虑"}, {"word": "malpractice", "trans": "n. 医疗事故，玩忽职守"}]}, {"id": "eng2_2022_t3", "exam": "英语二", "year": "2022", "text_num": "Text 3", "title": "商业与网站中误导用户的“暗模式”隐私陷阱", "difficulty": "偏难★★★★", "summary": "揭露应用程序和互联网产品中利用认知偏差欺骗用户的“暗模式（Dark Patterns）”，呼吁监管机构对算法界面诱导予以严格立法惩处。", "paragraphs": ["We have all encountered them, in both our personal and professional lives. Think about the times you felt tricked or fhistrated by a membership or subscription that had a seamless sign-up process but was later difficult to cancel. Something that should be simple and transparent can be complicated, intentionally or unintentionally, in ways that impair consumer choice. These are examples of dark patterns.", "First coined in 2010 by user experience expert Harry Brignull, \"'dark patterns” is a catch-all term for practices that manipulate user interfaces to influence the decision­ making ability of users. Brignull identifies 12 types of common dark patterns, ranging from misdirection and hidden costs to \"roach motel,“ where a user experience seems easy and intuitive at the start, but turns difficult when the user tries to get out.", "In a 2019 study of 53,000 product pages and 11,000 websites, researchers found that about one in 10 employs these design practices. Though widely prevalent, the concept of dark patterns is still not well understood. Business and nonprofit leaders should be aware of dark patterns and try to avoid the gray areas they engender.", "Where is the line between ethical, persuasive design and dark patterns? Businesses should engage in conversations with IT, compliance, risk, and legal teams to review their privacy policy, and include in the discussion the customer/user experience designers and coders responsible for the company's user interface, as well as the marketers and advertisers responsible for sign-ups, checkout baskets, pricing, and promotions. Any or all these teams can play a role in creating or avoiding \"digital deception.", "Lawmakers and regulators are slowly starting to address the ambiguity around dark patterns, most recently at the state level. In March, the California Attorney General announced the approval of additional regulations under the California Consumer Privacy Act (CCPA) that \"ensure that consumers will not be confused or misled when seeking to exercise their data privacy rights.\" The regulations aim to ban dark patterns- this means prohibiting companies from using confusing language or unnecessary steps such as forcing them to click through multiple screens or listen to reasons why they shouldn't opt out.”", "As more states consider promulgating additional regulations, there is a need for greater accountability from within the business community. Dark patterns also can be addressed on a self-regulatory basis, but only if organizations hold themselves accountable, not just to legal requirements but also to industry best practices and standards."], "questions": [{"q_num": 31, "stem": "It can be learned from the first two paragraphs that dark patterns", "options": {"A": "improve user experiences", "B": "leak user information for profit", "C": "undermine users' decision-making", "D": "remind users of hidden costs"}, "answer": "C", "hint": {"para": 1, "type": "细节题", "focus": "前两段指出暗模式普遍存在于各类数字产品中，旨在诱导用户泄露隐私或购买不必要服务。"}, "question_type": "细节题", "option_analysis": {"A": "【正反混淆】原文说暗模式损害消费者选择，是操纵性的，并非改善用户体验。", "B": "【偷换概念】原文说暗模式操纵界面影响决策能力（如难以取消订阅），并非专门泄露用户信息牟利。", "C": "【正解】第2段定义暗模式为操纵用户界面以影响用户决策能力的做法，即削弱用户的决策能力。", "D": "【偷换概念】原文说有些模式含隐藏成本，但暗模式整体是“操纵”而非“提醒”用户注意隐藏成本。"}}, {"q_num": 32, "stem": "The 2019 study on dark patterns is mentioned to show", "options": {"A": "their major flaws", "B": "their complex designs", "C": "their severe damage", "D": "their strong presence"}, "answer": "D", "hint": {"para": 3, "type": "例证题", "focus": "通过某电商退订会员流程极其繁琐的案例，生动展示界面设计对消费者自由选择权的践踏。"}, "question_type": "例证题", "option_analysis": {"A": "【答非所问】2019年研究是为了说明暗模式的普遍存在，而非列举其具体缺陷。", "B": "【偷换概念】研究数据（53000页面、11000网站中约十分之一）指向的是普遍性，而非设计复杂。", "C": "【过度推断】研究只统计了使用比例，并未衡量其造成多严重的损害。", "D": "【正解】第3段引用该研究（约十分之一的网站使用此类设计），正是为证明暗模式广泛存在、普遍盛行。"}}, {"q_num": 33, "stem": "To handle digital deception, businesses should", "options": {"A": "listen to customer feedback", "B": "talk with relevant teams", "C": "turn to independent agencies", "D": "rely on professional training"}, "answer": "B", "hint": {"para": 4, "type": "细节题", "focus": "暗模式利用了人类认知懒惰和视觉盲区，使得用户在不知不觉中被诱导。"}, "question_type": "细节题", "option_analysis": {"A": "【偷换概念】原文建议企业应与IT、合规、风险、法务等团队沟通，并非指向倾听顾客反馈。", "B": "【正解】第4段明确说企业应与IT、合规、风险、法律团队以及负责界面、营销的相关团队沟通，即与相关团队talk。", "C": "【无中生有】原文建议内部多部门协作，并未建议求助独立机构。", "D": "【无中生有】原文未提及依靠专业培训来处理数字欺骗。"}}, {"q_num": 34, "stem": "The additional regulations under the CCPA are intended to", "options": {"A": "guide users through opt-out processes", "B": "protect consumers from being tricked", "C": "grant companies data privacy rights", "D": "restrict access to problematic content"}, "answer": "B", "hint": {"para": 5, "type": "细节题", "focus": "欧美监管机构已开始采取针对性反击，将暗模式明确定性为违法欺诈商业行为。"}, "question_type": "细节题", "option_analysis": {"A": "【偷换概念】法规目的不是“引导用户完成退出流程”，而是禁止公司设置繁琐退出步骤来阻挠用户。", "B": "【正解】第5段指出CCPA附加法规旨在“确保消费者在行使数据隐私权时不被混淆或误导”，即保护消费者不被欺骗。", "C": "【正反混淆】法规保护的是消费者的数据隐私权，而非授予公司数据隐私权。", "D": "【偷换概念】法规针对的是暗模式等欺骗性做法，而非限制获取有问题的内容。"}}, {"q_num": 35, "stem": "According to the last paragraph, a key to coping with dark patterns is", "options": {"A": "new legal requirements", "B": "businesses' self-discipline", "C": "strict regulatory standards", "D": "consumers' safety awareness"}, "answer": "B", "hint": {"para": 6, "type": "主旨题", "focus": "呼吁建立透明诚信的交互设计标准，全面肃清损害消费者数字自主权的暗模式。"}, "question_type": "主旨题", "option_analysis": {"A": "【范围缩小】新的法律要求只是外部手段之一，原文强调的是企业内部的自我问责。", "B": "【正解】第6段指出暗模式可在自我规制基础上解决，但前提是组织对自身负责、遵守行业最佳实践与标准，即企业的自我约束。", "C": "【偷换概念】原文的落脚点是企业的self-regulatory与accountability，而非严格的监管标准。", "D": "【无中生有】原文未将消费者安全意识列为应对暗模式的关键。"}}], "detailed_analysis": "揭露商业网站和APP利用心理学陷阱欺骗用户的‘暗模式（Dark Patterns）’，例如让取消订阅按钮难以寻找、默认勾选隐私追踪、制造虚假倒计时恐慌等。文章呼吁强化立法禁止此类恶意设计。", "keywords": [{"word": "dark pattern", "trans": "n. 暗模式（恶意欺骗界面）"}, {"word": "manipulation", "trans": "n. 操纵，摆布"}, {"word": "deceptive", "trans": "adj. 欺骗性的"}, {"word": "opt-out", "trans": "v./n. 退出，不加入"}, {"word": "coercive", "trans": "adj. 强迫的，胁迫的"}, {"word": "regulatory", "trans": "adj. 监管的"}]}, {"id": "eng2_2022_t4", "exam": "英语二", "year": "2022", "text_num": "Text 4", "title": "高校伦理道德课程能否真正改变人们实际行为", "difficulty": "偏难★★★★", "summary": "行为科学实证调查高校伦理课堂学生的实际道德决策，发现道德知识的增长并不必然带来现实行为改善，“知易行难”需制度约束配合。", "paragraphs": ["Although ethics classes are common around the world, scientists are unsure if their lessons can actually change behavior; evidence either way is weak, relying on contrived laboratory tests or sometimes unreliable self-reports. But a new study published in Cognition found that, in at least one real-world situation, a single ethics lesson may have had lasting effects.", "The researchers investigated one class session's impact on eating meat. They chose this particular behavior for three reasons, according to study co-author Eric Schwitzgebel, a philosopher at the University of California, Riverside: students9 attitudes on the topic are variable and unstable, behavior is easily measurable, and ethics literature largely agrees that eating less meat is good because it reduces environmental harm and animal suffering. Half of the students in four large philosophy classes read an article on the ethics of factory-farmed meat, optionally watched an 11-minute video on the topic and joined a 5O-minute discussion. The other half focused on charitable giving instead. Then, unknown to the students, the researchers studied their anonymized meal-card purchases for that semester- nearly 14,000 receipts for almost 500 students.", "Schwitzgebel predicted the intervention would have no effect; he had previously found that ethics professors do not differ from other professors on a range of behaviors, including voting rates, blood donation and returning library books. But among student subjects who discussed meat ethics, meal purchases containing meat decreased from 52 to 45 percent- and this effect held steady for the study's duration of several weeks. Purchases from the other group remained at 52 percent.", "“That's actually a pretty large effect for a pretty small intervention,Schwitzgebel says. Psychologist Nina Strohminger at the University of Pennsylvania, who was not involved in the study, says she wants the effect to be real but cannot rule out some unknown confounding variable. And if real, she notes, it might be reversible by another nudge: \"Easy come, easy go.”", "Schwitzgebel suspects the greatest impact came from social influence-classmates or teaching assistants leading the discussions may have shared their own vegetarianism, showing it as achievable or more common. Second, the video may have had an emotional impact. Least rousing, he thinks, was rational argument, although his co­ authors say reason might play a bigger role. Now the researchers are probing the specific effects of teaching style, teaching assistants9 eating habits and students9 video exposure. Meanwhile, Schwitzgebel- who had predicted no effect- will be eating his words."], "questions": [{"q_num": 36, "stem": "Scientists generally believe that the effects of ethics classes are", "options": {"A": "hard to determine.", "B": "narrowly interpreted.", "C": "difficult to ignore.", "D": "poorly summarized."}, "answer": "A", "hint": {"para": 1, "type": "细节题", "focus": "第一段指出学者普遍发现很难确凿证实伦理道德课程能够切实改变受众的实际社会行为。"}, "question_type": "细节题", "option_analysis": {"A": "【正解】第一段\"scientists are unsure if their lessons can actually change behavior; evidence either way is weak\"，说明效果难以确定。", "B": "【无中生有】未提被狭隘解读。", "C": "【正反混淆】原文说证据薄弱、不确定，而非难以忽视。", "D": "【偷换概念】原文说证据不可靠(unreliable self-reports)，非总结得差(poorly summarized)。"}}, {"q_num": 37, "stem": "Which of the following is a reason for the researchers to study meat eating?", "options": {"A": "It is common among students.", "B": "It is a behavior easy to measure.", "C": "It is important to students' health.", "D": "It is a hot topic in ethics classes."}, "answer": "B", "hint": {"para": 2, "type": "细节题", "focus": "专业伦理学教授在图书馆归还率和慈善捐助比例上，与非伦理学同行并无统计学差异。"}, "question_type": "细节题", "option_analysis": {"A": "【无中生有】原文未说吃肉在学生中普遍。", "B": "【正解】第二段\"behavior is easily measurable\"，明确指出行为易于测量是研究吃肉的原因之一。", "C": "【无中生有】原文提环境危害与动物痛苦，未提学生健康。", "D": "【偷换概念】原文说伦理文献认为少吃肉是好的，非说这是伦理课堂的热门话题。"}}, {"q_num": 38, "stem": "Eric Schwitzgebefs previous findings suggest that ethics professors", "options": {"A": "are seldom critical of their students.", "B": "are less sociable than other professors.", "C": "are not sensitive to political issues.", "D": "are not necessarily ethically better."}, "answer": "D", "hint": {"para": 3, "type": "推断题", "focus": "道德认知停留在抽象理论层面，容易成为事后为自私行为找借口的理性化工具。"}, "question_type": "推断题", "option_analysis": {"A": "【无中生有】未提伦理教授很少批评学生。", "B": "【无中生有】未提社交能力。", "C": "【无中生有】未提政治议题敏感度。", "D": "【正解】第三段\"ethics professors do not differ from other professors on a range of behaviors, including voting rates, blood donation\"，说明伦理教授未必道德更高尚。"}}, {"q_num": 39, "stem": "Nina Strohminger thinks that the effect of the intervention is", "options": {"A": "permanent.", "B": "predictable.", "C": "uncertain.", "D": "unrepeatable."}, "answer": "D", "hint": {"para": 4, "type": "态度题", "focus": "强调真正的道德提升离不开环境暗示、同伴约束以及制度化奖惩的潜移默化。"}, "question_type": "态度题", "option_analysis": {"A": "【正反混淆】她说效果可能被另一次推动逆转\"Easy come, easy go\"，即不认为永久。", "B": "【无中生有】她无法排除未知混淆变量，未说可预测。", "C": "【误】第四段\"she wants the effect to be real but cannot rule out some unknown confounding variable\"，对效果是否真实持不确定态度。", "D": "【正解】她担心的是可逆/存在混淆变量，非不可重复(unrepeatable)。"}}, {"q_num": 40, "stem": "Eric Schwitzgebel suspects that the students' change in behavior", "options": {"A": "can bring psychological benefits.", "B": "can be analyzed statistically.", "C": "is a result of multiple factors.", "D": "is a sign of self-development."}, "answer": "C", "hint": {"para": 5, "type": "主旨题", "focus": "文章揭示了‘知与行’的深刻脱节，警示高校道德教育不能止于纸上谈兵。"}, "question_type": "主旨题", "option_analysis": {"A": "【无中生有】原文未说行为改变带来心理益处。", "B": "【答非所问】统计只是研究方法，非他所怀疑的成因。", "C": "【正解】第五段 Schwitzgebel 认为最大影响来自社会影响，其次是视频的情感影响，理性论证作用最小，说明是多因素共同结果。", "D": "【过度推断】原文未说这是自我发展的标志。"}}], "detailed_analysis": "针对全球商学院和高校普遍开设伦理道德课程的现象，行为科学家设计对比实验，考察上过伦理课的学者和学生在日常生活（如食堂付款、慈善捐助）中是否比常人表现得更道德。实证结果令人深思：伦理知识的掌握与实际行为并无显著关联。", "keywords": [{"word": "ethics", "trans": "n. 伦理学，道德规范"}, {"word": "philosophical", "trans": "adj. 哲学的"}, {"word": "integrity", "trans": "n. 道德操守"}, {"word": "disconnect", "trans": "n. 脱节，脱节现象"}, {"word": "normative", "trans": "adj. 规范的"}, {"word": "altruism", "trans": "n. 利他主义"}]}, {"id": "eng2_2023_t3", "exam": "英语二", "year": "2023", "text_num": "Text 3", "title": "数字时代互联网对人类记忆模式与认知的重构", "difficulty": "偏难★★★★", "summary": "哥伦比亚大学 Sparrow 研究表明，互联网并未削弱人类思维容量，而是将人类内部记忆转变为检索外部存储的“分布式交互记忆（Transactive Memory）”。", "paragraphs": ["The Internet may be changing merely what we remember, not our capacity to do so, suggests Columbia University psychology professor Betsy Sparrow. In 2011, Sparrow led a study in which participants were asked to record 40 factoids in a computer (\" an ostrich's eye is bigger than its brain/J for example). Half of the participants were told the information would be erased, while the other half were told it would be saved. Guess what? The latter group made no effort to recall the information when quizzed on it later, because they knew they could find it on their computers. In the same study, a group was asked to remember both the information and the folders it was stored in. They didn't remember the information, but they remembered how to find the folders. In other words, human memory is not deteriorating but “ adapting to new communications technology,“ Sparrow says.", "In a very practical way, the Internet is becoming an external hard drive for our memories, a process known as “ cognitive offloading.\" Traditionally, this role was fulfilled by data banks, libraries, and other humans. Your father may never remember birthdays because your mother does, for instance. Some worry that this is having a destructive effect on society, but Sparrow sees an upside. Perhaps, she suggests, the trend will change our approach to learning from a focus on individual facts and memorization to an emphasis on more conceptual thinking- something that is not available on the Internet. UI personally have never seen all that much intellectual value in memorizing things,“ Sparrow says, adding that we haven't lost our ability to do it.", "Still other experts say it's too soon to understand how the Internet affects our brains. There is no experimental evidence showing that it interferes with our ability to focus, for instance, wrote psychologists Christopher Chabris and Daniel J. Simons. And surfing the web exercised the brain more than reading did among computer-savvy older adults in a 2008 study involving 24 participants at the Semel Institute for Neuroscience and Human Behavior at the University of California, Los Angeles.", "“ There may be costs associated with our increased reliance on the Internet, but I'd have to imagine that overall the benefits are going to outweigh those costs,“ observes psychology professor Benjamin Storm. \"It seems pretty clear that memory is changing, but is it changing for the better? At this point, we don't know.”"], "questions": [{"q_num": 31, "stem": "Sparrow's study shows that with the Internet, the human brain will", "options": {"A": "analyze information in detail", "B": "collect information efficiently", "C": "switch its focus of memory", "D": "extend its memory duration"}, "answer": "C", "hint": {"para": 1, "type": "细节题", "focus": "首段Sparrow研究指出互联网并未削弱人类智力，而是改变了我们选择记忆的对象（what we remember）。"}, "question_type": "细节题", "option_analysis": {"A": "【正反混淆】原文说人不再费力记忆细节，并未说会详细分析信息。", "B": "【偷换概念】原文是说记忆对象转向where to find，而非高效收集信息。", "C": "【正解】首段说The Internet may be changing merely what we remember，记忆重心转向how to find the folders，即switch its focus of memory。", "D": "【无中生有】原文未说extend memory duration。"}}, {"q_num": 32, "stem": "The process of \"cognitive offloading\" .", "options": {"A": "helps us identify false information", "B": "keeps our memory from failing", "C": "enables us to classify trivial facts", "D": "lessens our memory burdens"}, "answer": "D", "hint": {"para": 2, "type": "推断题", "focus": "实验显示当受试者得知信息会被保存在电脑文件夹中时，对具体内容的记忆准确率显著下降。"}, "question_type": "推断题", "option_analysis": {"A": "【无中生有】原文未说认知外包帮助识别虚假信息。", "B": "【偷换概念】原文说记忆在adapting，而非防止记忆衰退(keeps our memory from failing)。", "C": "【无中生有】原文未提对琐碎事实分类。", "D": "【正解】第二段说互联网成为external hard drive，把记忆任务外包，即减轻记忆负担(lessens our memory burdens)。"}}, {"q_num": 33, "stem": "Which of the following would Sparrow support about the Internet?", "options": {"A": "It may reform our learning approach.", "B": "It may impact our society negatively.", "C": "It may enhance our adaptability to technology.", "D": "It may interfere with our conceptual thinking."}, "answer": "A", "hint": {"para": 3, "type": "细节题", "focus": "大脑将互联网当作了终极外脑，学会了‘离线外包’记忆负荷，腾出精力进行高阶加工。"}, "question_type": "细节题", "option_analysis": {"A": "【正解】第二段说该趋势会把学习重点从individual facts and memorization转向more conceptual thinking，即reform our learning approach。", "B": "【正反混淆】Sparrow看到的是upside，认为有益，negative是他人观点。", "C": "【偷换概念】Sparrow主张的是learning approach的改变，而非增强对外adaptability。", "D": "【正反混淆】原文说conceptual thinking是互联网给不了的正向能力，不会干扰它。"}}, {"q_num": 34, "stem": "It is indicated in Paragraph 3 that how the Internet affects our brains", "options": {"A": "requires further academic research", "B": "is most studied in older adults", "C": "is reflected in our reading speed", "D": "depends on our web-surfing habits"}, "answer": "A", "hint": {"para": 4, "type": "推断题", "focus": "这种转变与人类传统的家庭或团队内部协作记忆类似，是一种社会化认知的自然延伸。"}, "question_type": "推断题", "option_analysis": {"A": "【正解】第三段说it's too soon to understand how the Internet affects our brains、no experimental evidence，即需要进一步学术研究。", "B": "【张冠李戴】原文只在2008年一项24名older adults的研究中提脑活动，并非说该影响主要研究于老年人。", "C": "【偷换概念】原文比较的是surfing与reading的脑力活动，未提reading speed。", "D": "【无中生有】原文未说影响取决于web-surfing habits。"}}, {"q_num": 35, "stem": "Neither Sparrow nor Storm would agree that .", "options": {"A": "our reliance on the Internet will be costly", "B": "the Internet is weakening our memory", "C": "memory exercise is a must for our brains", "D": "our ability to focus declines with age"}, "answer": "B", "hint": {"para": 4, "type": "主旨题", "focus": "文章全面客观评估了数字工具对人类记忆架构的重塑，肯定了人机协同认知的新范式。"}, "question_type": "主旨题", "option_analysis": {"A": "【偷换概念】Storm确实说成本存在，Sparrow也不否认，两人都部分同意reliance有成本，故不能说两人都不同意。", "B": "【正解】Sparrow说记忆not deteriorating but adapting，Storm说memory is changing，两人都不赞同the Internet is weakening our memory。", "C": "【张冠李戴】文意并未普遍主张记忆练习必须，且这不是两人共同否定的核心。", "D": "【无中生有】原文未讨论focus随年龄下降。"}}], "detailed_analysis": "哥伦比亚大学Betsy Sparrow的突破性实验表明：在互联网普及的今天，人们对能够轻松在网络上检索到的信息不再花精力记忆具体细节，而是演变为记住‘在哪里能查到该信息’。这一‘谷歌效应’重构了人类的记忆体系。", "keywords": [{"word": "transactive memory", "trans": "n. 交互式记忆，分布式记忆"}, {"word": "cognitive", "trans": "adj. 认知的"}, {"word": "retrieval", "trans": "n. 检索，恢复"}, {"word": "offload", "trans": "v. 卸载，外包"}, {"word": "interconnected", "trans": "adj. 互联互通的"}, {"word": "externalize", "trans": "v. 使外部化"}]}, {"id": "eng2_2024_t3", "exam": "英语二", "year": "2024", "text_num": "Text 3", "title": "高龄驾驶员的安全隐患与适驾能力评估挑战", "difficulty": "偏难★★★★", "summary": "探讨老龄化社会中如何妥善平衡道路公共安全与老年人驾车自主出行权，评估认知测试与阶段性驾照政策的利弊与人文关怀。", "paragraphs": ["One of the biggest challenges in keeping unsafe aging drivers off the road is convincing them that ifs time to turn over the keys. \"It's a complete life-changer” when someone stops- or is forced to stop- driving, said former risk manager Anne M. Menke.", "“The American Medical Association advises physicians that 'in situations where clear evidence of substantial driving impairment implies a strong threat to patient and public safety, and where the physician's advice to discontinue driving privileges is ignored, it is desirable and ethical to notify the Department of Motor Vehicles,9,9 Menke wrote. \"Some states require physicians to report, others allow but do not mandate reports, while a few consider a report a breach of confidentiality. There could be liability and penalties if a physician does not act in accordance with state laws on reporting and confidentiality,9, she counseled.", "Part of the problem in keeping older drivers safe is that the difficulties are addressed piecemeal by different professions with different focuses, including gerontologists, highway administration officials, automotive engineers and others, said gerontologist Elizabeth Dugan. \"There's not a National Institute of Older Driver Studies J she said. \"We need better evidence on what makes drivers unsafe^^ and what can help, said Dugan.", "One thing that does seem to work is requiring drivers to report in person for license renewal. Mandatory in-person renewal was associated with a 31 per cent reduction in fatal crashes involving drivers 85 or older, according to one study. Passing vision tests also produced a similar decline in fatal crashes for those drivers, although there appeared to be no benefit from combining the two.", "Many older drivers don't see eye doctors or can't afford to. Primary care providers have their hands full and may not be able to follow through with patients who have trouble driving because they can't turn their heads or remember where they are going—or have gotten shorter and haven't changed their seat settings sufficiently to reach car pedals easily.", "As long as there are other cars on the roads, self-driving cars won't solve the problems of crashes, said Dugan. Avoiding dangers posed by all those human drivers would require too many algorithms, she said. But we need to do more to improve safety, said Dugan. utIf we're going to have 100-year lives, we need cars that a 90-year- old can drive comfortably."], "questions": [{"q_num": 31, "stem": "According to Paragraph 1, keeping unsafe aging drivers off the road", "options": {"A": "is a new safety measure", "B": "has become a disputed issue", "C": "can be a tough task to complete", "D": "will be beneficial to their health"}, "answer": "C", "hint": {"para": 1, "type": "细节题", "focus": "第一段指出劝导年事已高且不再适宜驾车的老人放弃钥匙是一项极具感情拉扯和家庭伦理挑战的难题。"}, "question_type": "细节题", "option_analysis": {"A": "【无中生有】原文未说这是新的安全措施。", "B": "【无中生有】原文未称该问题存在争议。", "C": "【正解】第一段首句称让不安全的高龄司机离开道路是最大挑战之一，即说服他们交出钥匙是艰难任务。", "D": "【无中生有】原文未提对其健康有益。"}}, {"q_num": 32, "stem": "The American Medical Association's advice .", "options": {"A": "has won support from drivers", "B": "is generally considered unrealistic", "C": "is widely dismissed as unnecessary", "D": "has met with different responses"}, "answer": "D", "hint": {"para": 2, "type": "推断题", "focus": "失去驾照直接威胁到老人的尊严与生活圈，常引发严重的心理危机与生活自理困难。"}, "question_type": "推断题", "option_analysis": {"A": "【无中生有】原文未说医协建议获司机支持。", "B": "【无中生有】原文未称该建议普遍被认为不现实。", "C": "【无中生有】原文未称该建议被普遍视为不必要。", "D": "【正解】第二段指出有些州要求医生报告、有些允许但不强制、少数视为泄密，说明医协建议得到不同反应。"}}, {"q_num": 33, "stem": "According to Dugan, efforts to keep older drivers safe .", "options": {"A": "have brought about big changes", "B": "need to be well coordinated", "C": "have gained public recognition", "D": "call for relevant legal support"}, "answer": "B", "hint": {"para": 4, "type": "细节题", "focus": "倡导建立基于反应时和视野的科学动态能力评估，而非按生理年龄实行简单一刀切注销。"}, "question_type": "细节题", "option_analysis": {"A": "【无中生有】Dugan指出问题是各部门各自为政（piecemeal），未带来大变革。", "B": "【正解】第三段Dugan说难题由不同专业各自为政地处理、缺乏统一机构，即需要良好协调（well coordinated）。", "C": "【无中生有】原文未说已获公众认可。", "D": "【无中生有】原文未主张需要法律支持。"}}, {"q_num": 34, "stem": "Some older drivers have trouble driving because they tend to", "options": {"A": "stick with bad driving habits", "B": "have a weakened memory", "C": "suffer from chronic pains", "D": "neglect car maintenance"}, "answer": "B", "hint": {"para": 5, "type": "细节题", "focus": "社区应当配套更适老化的公共接驳交通与辅助驾驶改装技术，为老人出行托底。"}, "question_type": "细节题", "option_analysis": {"A": "【无中生有】原文未提不良驾驶习惯。", "B": "【正解】第五段指出有些老人记不清自己去哪（remember where they are going），即记忆力减弱导致驾车困难。", "C": "【无中生有】原文未提慢性疼痛。", "D": "【无中生有】原文未提忽视车辆保养。"}}, {"q_num": 35, "stem": "Dugan thinks that the solution to the problems of crashes may lie in", "options": {"A": "upgrading self-driving vehicles", "B": "developing senior-friendly cars", "C": "renovating transport facilities", "D": "adjusting the age limit for drivers"}, "answer": "B", "hint": {"para": 6, "type": "主旨题", "focus": "主张以人性化、精准化的综合政策应对银发驾驶潮，兼顾公共安全与长者尊严。"}, "question_type": "主旨题", "option_analysis": {"A": "【正反混淆】第六段Dugan说只要路上有别的车，自动驾驶也解决不了事故问题。", "B": "【正解】末段Dugan说若人类要活到100岁，需要90岁老人也能舒适驾驶的汽车，即解决方案在于开发适老汽车（senior-friendly cars）。", "C": "【无中生有】原文未主张改造交通设施。", "D": "【无中生有】原文未提调整驾照年龄限制。"}}], "detailed_analysis": "随着老龄化社会加深，高龄驾驶员的交通事故风险引发公众担忧。然而剥夺老年人的驾车权利往往会导致其陷入社会孤立与抑郁。文章探讨如何在保障公共道路安全与尊重老年人自主独立性之间寻求科学平衡。", "keywords": [{"word": "aging drivers", "trans": "n. 高龄驾驶员"}, {"word": "mobility", "trans": "n. 行动能力，流动性"}, {"word": "cognitive decline", "trans": "n. 认知能力衰退"}, {"word": "autonomy", "trans": "n. 自主权，独立性"}, {"word": "assessment", "trans": "n. 评估，测评"}, {"word": "intervention", "trans": "n. 干预措施"}]}, {"id": "eng2_2025_t2", "exam": "英语二", "year": "2025", "text_num": "Text 2", "title": "与其修补NHS，不如从根本上反思健康之道", "difficulty": "困难★★★★★", "summary": "英国国民医疗服务体系（NHS）深陷财政与运力泥潭，文章呼吁跳出单纯“看病修补”思维，转向预防医学、社区支持与健康生态重构。", "paragraphs": ["When it was established, the National Health Service (NHS) was visionary: offering high-quality, timely care to meet the dominant needs of the population it served. Nearly 75 years on, with the UK facing very different health challenges, it is clear that the model is out of date.", "From life expectancy to cancer and infant mortality rates, we are lagging behind many of our peers. With more than 6.8 million on waitlists, healthcare is becoming increasingly inaccessible for those who cannot opt to pay for private treatment; and the cost of providing healthcare is increasingly squeezing out investment in other public services. As demand for healthcare continues to grow, pressures on the workforce—which is already near breaking point— will only become more acute.", "Many of the answers to the crisis in health and care are well rehearsed. We need to be much better at reducing and diverting demand on health services, rather than simply managing it. Much more needs to be invested in communities and primary care to reduce our reliance on hospitals. And capacity in social care needs to be greater, to support the growing number of people living with long-term conditions.", "Yet despite two decades of strategies and a number of major health reforms, we have failed to make meaningful progress on any of these aims. That is why the Reform think tank is launching a new programme of work entitled “Reimagining health”, supported by ten former health ministers. Together, we are calling for a much more open and honest conversation about the future of health in the UK, and an “urgent rethink” of the hospital-centric model we retain.", "This must begin with the question of how we maximise the health of the nation, rather than “fix” the NHS. It is estimated, for example, that healthcare accounts for only about 20% of health outcomes. Much more important are the places we live, work and socialise—yet there is no clear cross-government strategy for improving these social determinants of health. Worse, when policies like the national obesity strategy are scrapped, taxpayers are left with the heavy price tag of treating the illnesses, like diabetes, that result.", "Reform wants to ask how power and resources should be distributed in our health system. What health functions should remain at the centre, and what should be given to local leaders, often responsible for services that create health, and with a much better understanding of the needs of their populations?"], "questions": [{"q_num": 26, "stem": "According to the first two paragraphs, the NHS", "options": {"A": "is troubled by funding deficiencies", "B": "can hardly satisfy people’s needs", "C": "can barely retain its current employees", "D": "is rivalled by private medical services"}, "answer": "B", "hint": {"para": 1, "type": "细节题", "focus": "前两段指出NHS深陷资金短缺、医护过劳与排队过长等多重深层结构性困境。"}, "question_type": "细节题", "option_analysis": {"A": "【范围缩小】前两段虽提到成本挤压投资，但整体指向的是模式过时、难以满足需求，不止于资金不足。", "B": "【正解】前两段指出该模式已过时、680多万人排队、医疗日益难以获得，说明NHS难以满足人们的需求。", "C": "【偷换概念】原文说劳动力已近崩溃边缘，是压力问题，并非说几乎无法留住现有员工。", "D": "【无中生有】原文未说NHS受到私立医疗服务的竞争威胁。"}}, {"q_num": 27, "stem": "One answer to the crisis in health and care is to", "options": {"A": "boost the efficiency of hospitals", "B": "lighten the burden on social care", "C": "increase resources for primary care", "D": "reduce the pressure on communities"}, "answer": "C", "hint": {"para": 3, "type": "推断题", "focus": "破局的关键在于打破单纯依赖医院的医疗救治模式，转向全生命周期健康管理。"}, "question_type": "推断题", "option_analysis": {"A": "【正反混淆】原文主张减少对医院的依赖，而非提高医院效率。", "B": "【偷换概念】原文说社会护理能力需要扩大，而非减轻社会护理的负担。", "C": "【正解】第3段指出需要向社区和primary care投入更多，以减少对医院的依赖，即增加基层医疗资源。", "D": "【正反混淆】原文主张在社区多投入，而非减少社区压力。"}}, {"q_num": 28, "stem": "“Reimagining health” is aimed to .", "options": {"A": "reinforce hospital management", "B": "readjust healthcare regulations", "C": "restructure the health system", "D": "resume suspended health reforms"}, "answer": "C", "hint": {"para": 4, "type": "态度题", "focus": "‘重新构想健康’强调住房、空气质量、体育锻炼与食品营养对健康的决定性根基作用。"}, "question_type": "态度题", "option_analysis": {"A": "【正反混淆】原文主张反思以医院为中心的模式，而非强化医院管理。", "B": "【偷换概念】计划目标是重构健康体系，不是调整医疗监管规定。", "C": "【正解】第4段“Reimagining health”计划呼吁对以医院为中心的模式“紧急反思”，即重构整个健康体系。", "D": "【无中生有】原文未说该计划意在恢复被暂停的医疗改革。"}}, {"q_num": 29, "stem": "To maximise the nation’s health, the author suggests", "options": {"A": "introducing relevant taxation policies", "B": "paying due attention to social factors", "C": "reevaluating major health outcomes", "D": "enhancing the quality of health care"}, "answer": "B", "hint": {"para": 5, "type": "推断题", "focus": "建议赋予地方社区更多公共卫生预算支配权，针对弱势人群进行定制化健康干预。"}, "question_type": "推断题", "option_analysis": {"A": "【无中生有】原文未建议引入相关税收政策。", "B": "【正解】第5段指出医疗仅占健康结果的约20%，更重要的是居住、工作、社交场所等社会因素，并批评缺乏跨部门的健康社会决定因素策略，即nba要重视社会因素。", "C": "【偷换概念】原文是重新审视健康的决定因素，并非重新评估主要健康结果指标。", "D": "【答非所问】原文主张超越单纯“修复”医疗，提高医疗质量并非最大化国民健康的建议重点。"}}, {"q_num": 30, "stem": "It can be inferred that local leaders should .", "options": {"A": "exercise their power more reasonably", "B": "develop a stronger sense of responsibility", "C": "play a bigger role in the health system", "D": "understand people’s health needs better (x.) .6. 15 )"}, "answer": "C", "hint": {"para": 6, "type": "推断题", "focus": "呼吁全社会完成从‘治疗疾病’到‘创造健康’的深刻范式转换。"}, "question_type": "推断题", "option_analysis": {"A": "【偷换概念】原文讨论的是权力与资源如何分配，重点在地方应承担更多健康职能，而非如何合理行使权力。", "B": "【偷换概念】原文强调地方领导者更了解本地需求、应获得相应职能，而非增强责任感。", "C": "【正解】第6段指出应把创造健康的职能和资源下放给地方领导者，可推知地方领导者应在健康体系中发挥更大作用。", "D": "【偷换概念】原文只是说地方领导者已更了解本地需求，重点在于赋予其职能，而非要他们“更好地理解需求”。"}}], "detailed_analysis": "反思英国国民医疗服务体系（NHS）的系统性危机。医疗队伍罢工、急诊等待时间创历史纪录表明，单纯追加财政预算进行‘修修补补’已无济于事。作者疾呼必须从根本上重新定义健康，将重点从医院治疗转向全社会预防。", "keywords": [{"word": "reimagine", "trans": "v. 重新构想，根本反思"}, {"word": "deficiency", "trans": "n. 缺陷，不足"}, {"word": "preventative", "trans": "adj. 预防性的"}, {"word": "infrastructure", "trans": "n. 基础设施"}, {"word": "holistic", "trans": "adj. 全面的，整体的"}, {"word": "wellbeing", "trans": "n. 健康福祉"}]}, {"id": "eng2_2025_t3", "exam": "英语二", "year": "2025", "text_num": "Text 3", "title": "印度极端高温行动计划(HAPs)的实施挑战", "difficulty": "困难★★★★★", "summary": "剖析印度各大城市应对极端热浪的高温行动计划（HAPs），指出因地制宜绘制脆弱人群分布图、强化基层防暑预警与建筑降温改造的迫切性。", "paragraphs": ["Heat action plans, or HAPs, have been proliferating in India in the past few years. In general, an HAP spells out when and how officials should issue heat warnings and alert hospitals and other institutions. Nagpur’s plan, for instance, calls for hospitals to set aside “cold wards” in the summer for treating heatstroke patients, and advises builders to give construction laborers a break from work on very hot days.", "But implementation of existing HAPs has been uneven, according to a report from the Center for Policy Research. Many lack adequate funding, it found. And their triggering thresholds often are not customized to the local climate. In some areas, high daytime temperatures alone might serve as an adequate trigger for alerts. But in other places, nighttime temperatures or humidity might be as important a gauge of risk as daytime highs.", "Mumbai’s April heat stroke deaths highlighted the need for more nuanced and localized warnings, researchers say. That day’s high temperature of roughly 36°C was 1°C shy of the heat wave alert threshold for coastal cities set by national meteorological authorities. But the effects of the heat were amplified by humidity—an often neglected factor in heat alert systems—and the lack of shade at the late-morning outdoor ceremony.", "To help improve HAPs, urban planner Kotharkar’s team is working on a model plan that outlines best practices and could be adapted to local conditions. Among other things, she says, all cities should create a vulnerability map to help focus responses on the populations most at risk.", "Such mapping doesn’t need to be complex, Kotharkar says. “A useful map can be created by looking at even a few key parameters.” For example, neighborhoods with a large elderly population or informal dwellings that cope poorly with heat could get special warnings or be bolstered with cooling centers. The Nagpur project has already created a risk and vulnerability map, which enabled Kotharkar to tell officials which neighborhoods to focus on in the event of a heat wave this summer.", "HAPs shouldn’t just include short-term emergency responses, researchers say, but also recommend medium- to long-term measures that could make communities cooler. In Nagpur, for example, Kotharkar’s team has been able to advise city officials about where to plant trees to provide shade. HAPs could also guide efforts to retrofit homes or modify building regulations. “Reducing deaths in an emergency is good target to have, but it’s the lowest target,” says climate researcher Chandni Singh."], "questions": [{"q_num": 31, "stem": "According to Paragraph 1, Nagpur’s plan proposes measures to", "options": {"A": "tackle extreme weather", "B": "ensure construction quality", "C": "monitor emergency warnings", "D": "address excessive workloads"}, "answer": "A", "hint": {"para": 1, "type": "细节题", "focus": "第一段以那格浦尔（Nagpur）市为例，介绍了HAP如何通过发布预警和设立降温饮水站减少中暑死亡。"}, "question_type": "细节题", "option_analysis": {"A": "【正解】第一段 Nagpur 计划要求医院设\"cold wards\"、建议建筑商高温时让工人休息，正是应对极端高温(extreme weather)的措施。", "B": "【偷换概念】建议建筑商让工人休息，非保证建筑质量。", "C": "【偷换概念】原文说计划规定何时如何发预警，非\"监测紧急预警\"本身。", "D": "【偷换概念】让工人高温休息非解决\"过度工作量\"，而是避热。"}}, {"q_num": 32, "stem": "One problem with existing HAPs is that they", "options": {"A": "prove too costly to be implemented", "B": "lack localized allert-issuing criteria", "C": "give delayed responses to heat waves", "D": "keep hospitals under great pressure"}, "answer": "B", "hint": {"para": 2, "type": "细节题", "focus": "指出当前多数HAP缺乏针对城市贫民窟和户外体力劳动者的差异化保护措施。"}, "question_type": "细节题", "option_analysis": {"A": "【偷换概念】原文说 many lack adequate funding，是资金不足，而非实施成本过高(costly)。", "B": "【正解】第二段\"their triggering thresholds often are not customized to the local climate\"，即缺乏本地化的触发/预警标准(localized alert-issuing criteria)。", "C": "【无中生有】未提反应迟缓。", "D": "【偷换概念】原文未说医院压力大，是资金与阈值问题。"}}, {"q_num": 33, "stem": "Mumbai’s case shows that India’s heat alert systems need to", "options": {"A": "include other factors besides temperature", "B": "take subtle weather changes into account", "C": "prioritize potentially disastrous heat waves", "D": "draw further support from local authorities"}, "answer": "A", "hint": {"para": 3, "type": "推断题", "focus": "孟买的案例凸显现有气象预警系统与医疗急救联动响应机制脱节的硬伤。"}, "question_type": "推断题", "option_analysis": {"A": "【正解】第三段孟买案例说明高温效应被湿度放大\"amplified by humidity—an often neglected factor\"，故预警系统需纳入温度之外的因素。", "B": "【偷换概念】原文强调湿度等风险因素，非\"微妙的天气变化\"。", "C": "【答非所问】原文未说优先应对灾难性热浪。", "D": "【无中生有】未提需地方政府更多支持。"}}, {"q_num": 34, "stem": "Kotharkar holds that a vulnerability map can help", "options": {"A": "prevent the harm of high humidity", "B": "target areas needing special attention", "C": "expand the Nagpur project’s coverage", "D": "make relief plans for heat-stricken people"}, "answer": "B", "hint": {"para": 4, "type": "态度题", "focus": "学者Kotharkar主张绘制精确到街道的高温脆弱性地图，将有限防暑资源精准投送。"}, "question_type": "态度题", "option_analysis": {"A": "【偷换概念】脆弱性地图是识别高风险人群，非预防高湿度危害本身。", "B": "【正解】第四段\"focus responses on the populations most at risk\"及第五段对老年社区等给特别预警，即定位需要特别关注的区域。", "C": "【无中生有】未提扩大那格浦尔项目覆盖范围。", "D": "【偷换概念】地图用于聚焦高风险人群并定向响应，非为受灾者制定救济计划。"}}, {"q_num": 35, "stem": "According to the last paragraph, researchers suggest that HAPs should", "options": {"A": "focus more on the heatstroke treatment", "B": "invite wider public participation", "C": "apply for more government grants", "D": "serve a broader range of purposes — ) MM .8. (£-15 )"}, "answer": "D", "hint": {"para": 6, "type": "主旨题", "focus": "建议将应对极端高温上升为城市长远规划战略，推动建筑隔热反光与绿化韧性改造。"}, "question_type": "主旨题", "option_analysis": {"A": "【正反混淆】末段说\"Reducing deaths in an emergency...is the lowest target\"，即不应只聚焦中暑治疗这类短期应急。", "B": "【无中生有】未提邀请公众广泛参与。", "C": "【无中生有】未提申请政府拨款。", "D": "【正解】末段研究者建议 HAPs 应包含中长期措施、植树遮阴、改造房屋与建筑规范，即服务更广泛目的。"}}], "detailed_analysis": "印度频遭致命热浪袭击，各地推出的‘高温行动计划（HAPs）’虽然发挥了一定预警作用，但在跨部门协调、非正规就业群体保护及建筑耐热改造方面存在巨大短板。文章强调绘制微观脆弱人群地图的重要性。", "keywords": [{"word": "heatwave", "trans": "n. 热浪，极端高温"}, {"word": "vulnerability", "trans": "n. 脆弱性，易受害程度"}, {"word": "mitigation", "trans": "n. 缓解，减轻"}, {"word": "informal workers", "trans": "n. 非正规就业工人，户外散工"}, {"word": "urban heat island", "trans": "n. 热岛效应"}, {"word": "resilience", "trans": "n. 韧性，复原力"}]}, {"id": "eng2_2025_t4", "exam": "英语二", "year": "2025" // Populate directory list
function populateSelect(filter = 'all') {
  filteredData = READING_DATA.filter(item => {
    if (filter === 'all') return true;
    return item.exam === filter;
  });
  if (directoryList) {
    directoryList.innerHTML = '';
    filteredData.forEach((item, idx) => {
      const row = document.createElement('button');
      row.className = 'dir-item';
      row.dataset.idx = idx;
      row.innerHTML = '<span class="dir-item-title">' + item.text_num + ' · ' + item.title +
        '</span><span class="dir-item-meta">' + item.exam + ' · ' + item.year + ' · ' + item.difficulty + '</span>';
      row.addEventListener('click', () => {
        closeDirectory();
        currentIndex = idx;
        loadCurrentText();
      });
      directoryList.appendChild(row);
    });
  }
  currentIndex = 0;
  loadCurrentText();
}

function markActiveDirItem() {
  if (!directoryList) return;
  document.querySelectorAll('.dir-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === currentIndex);
  });
}
function openDirectory() {
  if (!directoryPanel) return;
  directoryPanel.hidden = false;
  if (btnDirectory) btnDirectory.classList.add('active');
  markActiveDirItem();
}
function closeDirectory() {
  if (!directoryPanel) return;
  directoryPanel.hidden = true;
  if (btnDirectory) btnDirectory.classList.remove('active');
}

    tab.classList.add('active');
    populateSelect(tab.dataset.filter);
  });

  paragraphsContainer.innerHTML = '';
  item.paragraphs.forEach((pText, pIdx) => {
    const pDiv = document.createElement('div');
    pDiv.className = 'para-block';
    pDiv.id = `para-${pIdx + 1}`;

    const pIndexSpan = document.createElement('span');
    pIndexSpan.className = 'para-index';
    pIndexSpan.textContent = `[Para ${pIdx + 1}]`;

    const pContentSpan = document.createElement('span');
    pContentSpan.className = 'para-text';
    pContentSpan.textContent = pText;

    pDiv.appendChild(pIndexSpan);
    pDiv.appendChild(pContentSpan);

    paragraphsContainer.appendChild(pDiv);
  });

  // Vocabulary keywords
  vocabGrid.innerHTML = '';
  if (item.keywords && item.keywords.length > 0) {
    vocabPanel.style.display = 'block';
    item.keywords.forEach(kv => {
      const chip = document.createElement('div');
      chip.className = 'vocab-chip';
      chip.innerHTML = `<span class="vocab-word">${kv.word}</span><span class="vocab-trans">${kv.trans}</span>`;
      vocabGrid.appendChild(chip);
    });
  } else {
    vocabPanel.style.display = 'none';
  }

  // Questions
  questionsContainer.innerHTML = '';
  qPillsContainer.innerHTML = '';

  item.questions.forEach((q, qIdx) => {
    // Pill
    const pill = document.createElement('button');
    pill.className = 'q-jump-btn';
    pill.id = `pill-q-${q.q_num}`;
    pill.textContent = `Q${q.q_num}`;
    pill.addEventListener('click', () => {
      scrollToQuestion(q.q_num);
    });
    qPillsContainer.appendChild(pill);

    // Question card
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `q-card-${q.q_num}`;

    const qHeader = document.createElement('div');
    qHeader.className = 'q-header';
    
    const badge = document.createElement('span');
    badge.className = 'q-num-badge';
    badge.textContent = `第 ${q.q_num} 题`;

    const stem = document.createElement('div');
    stem.className = 'q-stem';
    stem.textContent = q.stem;

    qHeader.appendChild(badge);
    qHeader.appendChild(stem);
    card.appendChild(qHeader);

    // Options
    const optList = document.createElement('div');
    optList.className = 'options-list';

    ['A', 'B', 'C', 'D'].forEach(letter => {
      if (q.options && q.options[letter]) {
        const optItem = document.createElement('div');
        optItem.className = 'option-item';
        optItem.id = `opt-${item.id}-${q.q_num}-${letter}`;

        const letterBadge = document.createElement('span');
        letterBadge.className = 'option-letter';
        letterBadge.textContent = letter;

        const optText = document.createElement('span');
        optText.className = 'option-text';
        optText.textContent = q.options[letter];

        optItem.appendChild(letterBadge);
        optItem.appendChild(optText);

        optItem.addEventListener('click', () => {
          selectOption(item.id, q.q_num, letter);
        });

        optList.appendChild(optItem);
      }
    });

    card.appendChild(optList);

    // Analysis
    const analysisBox = document.createElement('div');
    analysisBox.className = 'analysis-box';
    analysisBox.id = `analysis-${q.q_num}`;

    let hintHtml = '';
    if (q.hint || q.question_type) {
      const qtype = q.question_type || (q.hint ? q.hint.type : '');
      hintHtml = `<div><strong>【考查题型】</strong> ${qtype}</div>
                  <div style="margin-top:4px;"><strong>【解题要点】</strong> ${q.hint ? q.hint.focus : ''}</div>`;
    }
    // 逐选项解析
    if (q.option_analysis) {
      const OA_LABEL = {A:'A',B:'B',C:'C',D:'D'};
      let optRows = '';
      ['A','B','C','D'].forEach(function(L){
        const txt = q.option_analysis[L] || '';
        if (!txt) return;
        const isRight = txt.indexOf('【正解】') === 0;
        const cls = isRight ? 'opt-an-row opt-an-right' : 'opt-an-row';
        optRows += `<div class="${cls}"><span class="opt-an-letter">${OA_LABEL[L]}</span>`
                 + `<span class="opt-an-text">${txt}</span></div>`;
      });
      hintHtml += `<div style="margin-top:10px;"><strong>【逐选项解析】</strong></div>`
                + `<div class="opt-an-list">${optRows}</div>`;
    }

    let disputedHtml = '';
    if (q.disputed) {
      disputedHtml = `<div class="dispute-banner">
        <div class="dispute-title">⚠️ 本题为争议题（答案不唯一）</div>
        <div>主流答案：<strong>${q.answerPrimary}</strong> —— ${q.options[q.answerPrimary] || ''}</div>
        <div>争议答案：<strong>${q.answerAlt}</strong> —— ${q.options[q.answerAlt] || ''}</div>
        <div class="dispute-note">${q.disputeNote || ''}</div>
      </div>`;
    }
    const ansLabel = q.disputed
      ? `<span class="badge-ans badge-ans-disputed">${q.answerPrimary} (争议)</span>`
      : `<span class="badge-ans">${q.answer}</span>`;
    analysisBox.innerHTML = `
      <div class="analysis-header">
        <span>官方标准答案:</span>
        ${ansLabel}
      </div>
      ${disputedHtml}
      ${hintHtml}
    `;

    card.appendChild(analysisBox);
    questionsContainer.appendChild(card);
  });

  updateAnswerUI();
  updateStats();
  resetTimer();
}

// Select option
function selectOption(itemId, qNum, letter) {
  const key = `${itemId}_${qNum}`;
  userAnswers[key] = letter;
  updateAnswerUI();
  updateStats();
}

// Update question card styles and pills
function updateAnswerUI() {
  const item = filteredData[currentIndex];
  if (!item) return;

  item.questions.forEach(q => {
    const key = `${item.id}_${q.q_num}`;
    const chosen = userAnswers[key];
    const isAnswered = Boolean(chosen);
    const pill = document.getElementById(`pill-q-${q.q_num}`);
    const analysis = document.getElementById(`analysis-${q.q_num}`);

    // Reset options
    ['A', 'B', 'C', 'D'].forEach(letter => {
      const optEl = document.getElementById(`opt-${item.id}-${q.q_num}-${letter}`);
      if (optEl) {
        optEl.classList.remove('selected', 'correct', 'wrong');
        if (chosen === letter) {
          optEl.classList.add('selected');
        }

        if (mode === 'analysis') {
          if (letter === q.answer) {
            optEl.classList.add('correct');
          } else if (chosen === letter && chosen !== q.answer) {
            optEl.classList.add('wrong');
          }
        }
      }
    });

    // Pill status
    if (pill) {
      pill.classList.remove('answered', 'correct', 'wrong');
      if (mode === 'analysis') {
        if (chosen === q.answer) pill.classList.add('correct');
        else if (chosen) pill.classList.add('wrong');
      } else {
        if (isAnswered) pill.classList.add('answered');
      }
    }

    // Analysis visibility
    if (analysis) {
      if (mode === 'analysis') {
        analysis.classList.add('show');
      } else {
        analysis.classList.remove('show');
      }
    }
  });
}

// Update statistics
function updateStats() {
  const item = filteredData[currentIndex];
  if (!item) return;

  let answeredCount = 0;
  let correctCount = 0;

  item.questions.forEach(q => {
    const key = `${item.id}_${q.q_num}`;
    const chosen = userAnswers[key];
    if (chosen) {
      answeredCount++;
      if (chosen === q.answer) correctCount++;
    }
  });

  statProgress.textContent = `${answeredCount} / ${item.questions.length}`;
  const pct = Math.round((correctCount / item.questions.length) * 100);
  statScore.textContent = `${correctCount * 2} 分 (${pct}%)`;
}

// Scroll right pane to question
function scrollToQuestion(qNum) {
  const el = document.getElementById(`q-card-${qNum}`);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.querySelectorAll('.q-card').forEach(c => c.classList.remove('current'));
    el.classList.add('current');
    document.querySelectorAll('.q-jump-btn').forEach(b => b.classList.remove('active'));
    const pill = document.getElementById(`pill-q-${qNum}`);
    if (pill) pill.classList.add('active');
  }
}

// Draggable Divider implementation
let isDragging = false;

splitter.addEventListener('mousedown', (e) => {
  isDragging = true;
  splitter.classList.add('dragging');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const workspaceRect = workspace.getBoundingClientRect();
  const offsetX = e.clientX - workspaceRect.left;
  const totalWidth = workspaceRect.width;
  
  const minWidth = totalWidth * 0.22;
  const maxWidth = totalWidth * 0.78;

  if (offsetX >= minWidth && offsetX <= maxWidth) {
    const pct = (offsetX / totalWidth) * 100;
    passagePane.style.width = `${pct}%`;
  }
});

document.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    splitter.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
});

// Touch support for tablets/mobiles
splitter.addEventListener('touchstart', (e) => {
  isDragging = true;
  splitter.classList.add('dragging');
});

document.addEventListener('touchmove', (e) => {
  if (!isDragging || !e.touches[0]) return;
  const touch = e.touches[0];
  const workspaceRect = workspace.getBoundingClientRect();
  const offsetX = touch.clientX - workspaceRect.left;
  const totalWidth = workspaceRect.width;
  const minWidth = totalWidth * 0.22;
  const maxWidth = totalWidth * 0.78;
  if (offsetX >= minWidth && offsetX <= maxWidth) {
    const pct = (offsetX / totalWidth) * 100;
    passagePane.style.width = `${pct}%`;
  }
});

document.addEventListener('touchend', () => {
  if (isDragging) {
    isDragging = false;
    splitter.classList.remove('dragging');
  }
});

// Double click splitter to reset to 50%
splitter.addEventListener('dblclick', () => {
  passagePane.style.width = '50%';
});

// Events & navigation
if (btnDirectory) btnDirectory.addEventListener('click', () => {
  if (directoryPanel.hidden) openDirectory(); else closeDirectory();
});
if (btnDirClose) btnDirClose.addEventListener('click', closeDirectory);
document.addEventListener('click', (e) => {
  if (directoryPanel && !directoryPanel.hidden && btnDirectory &&
      !directoryPanel.contains(e.target) && !btnDirectory.contains(e.target)) {
    closeDirectory();
  }
});

// Toggle mode
btnToggleMode.addEventListener('click', () => {
  if (mode === 'practice') {
    mode = 'analysis';
    btnToggleMode.textContent = '模式: 📖 精读解析';
    btnToggleMode.classList.add('active');
  } else {
    mode = 'practice';
    btnToggleMode.textContent = '模式: 📝 自测做题';
    btnToggleMode.classList.remove('active');
  }
  updateAnswerUI();
});

// Font size +/-
btnFontInc.addEventListener('click', () => {
  if (currentFontSize < 24) {
    currentFontSize += 1.5;
    passagePane.style.setProperty('--font-size-base', `${currentFontSize}px`);
  }
});

btnFontDec.addEventListener('click', () => {
  if (currentFontSize > 13) {
    currentFontSize -= 1.5;
    passagePane.style.setProperty('--font-size-base', `${currentFontSize}px`);
  }
});

// Timer functions
function updateTimerUI() {
  const mins = Math.floor(timerSeconds / 60);
  const secs = timerSeconds % 60;
  timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
  if (timerSeconds <= 120) {
    timerDisplay.style.color = '#b91c1c';
  } else {
    timerDisplay.style.color = 'var(--text-main)';
  }
}

function resetTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = 18 * 60;
  if (btnTimerStart) btnTimerStart.textContent = '▶ 开始';
  updateTimerUI();
}

// Clock button toggles the timer popover
if (btnTimerToggle) btnTimerToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  if (timerPopover) timerPopover.hidden = !timerPopover.hidden;
});
document.addEventListener('click', (e) => {
  if (timerPopover && !timerPopover.hidden && timerWrap && !timerWrap.contains(e.target)) {
    timerPopover.hidden = true;
  }
});

// Start / pause
if (btnTimerStart) btnTimerStart.addEventListener('click', () => {
  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
    btnTimerStart.textContent = '▶ 继续';
  } else {
    timerRunning = true;
    btnTimerStart.textContent = '⏸ 暂停';
    timerInterval = setInterval(() => {
      if (timerSeconds > 0) {
        timerSeconds--;
        updateTimerUI();
      } else {
        clearInterval(timerInterval);
        timerRunning = false;
        btnTimerStart.textContent = '▶ 开始';
        alert('时间到！本篇做题倒计时结束。');
      }
    }, 1000);
  }
});

if (btnTimerReset) btnTimerReset.addEventListener('click', resetTimer);

// Check all & Reset
btnCheckAll.addEventListener('click', () => {
  mode = 'analysis';
  btnToggleMode.textContent = '模式: 📖 精读解析';
  btnToggleMode.classList.add('active');
  updateAnswerUI();
  updateStats();
});

btnResetAnswers.addEventListener('click', () => {
  if (confirm('确认清空当前篇章的所有答题记录以重新练习吗？')) {
    const item = filteredData[currentIndex];
    item.questions.forEach(q => {
      delete userAnswers[`${item.id}_${q.q_num}`];
    });
    updateAnswerUI();
    updateStats();
  }
});

// Instant word definition popup on selection or double-click
document.addEventListener('mouseup', (e) => {
  const selection = window.getSelection();
  const selectedText = selection.toString().trim().toLowerCase().replace(/[^a-z]/g, '');
  if (selectedText && selectedText.length > 2 && GLOSSARY[selectedText]) {
    const range = selection.getRangeAt(0);
    const rect = range.getBoundingClientRect();
    wordPopup.innerHTML = `<div class="wp-title">🔍 ${selectedText}</div><div class="wp-trans">${GLOSSARY[selectedText]}</div>`;
    wordPopup.style.left = `${Math.min(rect.left, window.innerWidth - 300)}px`;
    wordPopup.style.top = `${rect.bottom + 8}px`;
    wordPopup.style.display = 'block';
  } else if (!wordPopup.contains(e.target)) {
    wordPopup.style.display = 'none';
  }
});

// Keyboard shortcuts (Arrow Left/Right to switch texts, 1-5 to jump to questions)
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (['1', '2', '3', '4', '5'].includes(e.key)) {
    const item = filteredData[currentIndex];
    const qIndex = parseInt(e.key) - 1;
    if (item && item.questions[qIndex]) {
      scrollToQuestion(item.questions[qIndex].q_num);
    }
  }
});

// Initialize
populateSelect('all');
</script>
