<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研英语历年巅峰难度阅读研习系统 (2021-2025)</title>
<style>
/* Permanent Warm Sepia Eye-care Theme */
:root {
  --bg-main: #f4ede4;
  --bg-card: #fdfbf7;
  --bg-header: #faf4eb;
  --bg-pane: #fdfbf7;
  --text-main: #2d261e;
  --text-muted: #796c5e;
  --text-light: #a89a8a;
  --border-color: #e8ded2;
  --accent-color: #b45309;
  --accent-hover: #92400e;
  --accent-light: #fef3c7;
  --accent-border: #fde68a;
  --success-color: #15803d;
  --success-light: #f0fdf4;
  --success-border: #bbf7d0;
  --danger-color: #b91c1c;
  --danger-light: #fef2f2;
  --danger-border: #fecaca;
  --warning-color: #d97706;
  --warning-light: #fffbeb;
  --splitter-bg: #d7cbbd;
  --splitter-active: #b45309;
  --shadow-sm: 0 1px 2px 0 rgb(45 38 30 / 0.06);
  --shadow-md: 0 4px 6px -1px rgb(45 38 30 / 0.08), 0 2px 4px -2px rgb(45 38 30 / 0.06);
  --shadow-lg: 0 10px 15px -3px rgb(45 38 30 / 0.1), 0 4px 6px -4px rgb(45 38 30 / 0.08);
  --font-family-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-family-serif: "Georgia", "Cambria", "Times New Roman", Times, "Noto Serif SC", serif;
  /* Permanent Academic Serif Font */
  --font-content: var(--font-family-serif);
  --font-size-base: 16.5px;
  --line-height-base: 1.85;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-family-sans);
  background-color: var(--bg-main);
  color: var(--text-main);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: text;
}

/* Header */
header {
  background: var(--bg-header);
  border-bottom: 1px solid var(--border-color);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
  z-index: 20;
}

.logo-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-badge {
  background: linear-gradient(135deg, #b45309, #d97706);
  color: #fff;
  font-weight: 800;
  font-size: 13px;
  padding: 4px 9px;
  border-radius: 6px;
  letter-spacing: 0.5px;
}

.logo-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-main);
  white-space: nowrap;
}

.nav-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.filter-tab-group {
  display: flex;
  background: var(--bg-main);
  padding: 3px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
}

.filter-tab {
  border: none;
  background: transparent;
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 600;
  border-radius: 6px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
}

.filter-tab.active {
  background: var(--bg-card);
  color: var(--accent-color);
  box-shadow: var(--shadow-sm);
}

.text-selector {
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
  background: var(--bg-card);
  color: var(--text-main);
  font-size: 13px;
  font-weight: 600;
  max-width: 340px;
  cursor: pointer;
  outline: none;
}

.btn-nav {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 4px;
}

.btn-nav:hover:not(:disabled) {
  border-color: var(--accent-color);
  color: var(--accent-color);
}

.btn-nav:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.timer-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-main);
  border: 1px solid var(--border-color);
  padding: 4px 10px;
  border-radius: 8px;
  font-family: monospace;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-main);
}

.timer-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 2px 4px;
  font-size: 12px;
  border-radius: 4px;
}

.timer-btn:hover {
  color: var(--accent-color);
}

/* Subheader / Navigator Bar */
.sub-bar {
  background: var(--bg-header);
  border-bottom: 1px solid var(--border-color);
  padding: 8px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  flex-shrink: 0;
  z-index: 10;
}

.article-meta-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.badge-tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
}

.badge-eng1 {
  background: #ede9fe;
  color: #6d28d9;
}

.badge-eng2 {
  background: #dbeafe;
  color: #1e40af;
}

.badge-diff-5 {
  background: #fee2e2;
  color: #b91c1c;
  border: 1px solid #fca5a5;
}

.badge-diff-4 {
  background: #fef3c7;
  color: #b45309;
  border: 1px solid #fde68a;
}

.article-title-bar {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
}

.q-jump-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.q-jump-btn {
  min-width: 44px;
  height: 28px;
  padding: 0 8px;
  border-radius: 6px;
  border: 1px solid var(--border-color);
  background: var(--bg-card);
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: all 0.15s;
}

.q-jump-btn:hover {
  border-color: var(--accent-color);
  color: var(--accent-color);
}

.q-jump-btn.answered {
  background: var(--accent-light);
  border-color: var(--accent-border);
  color: var(--accent-color);
}

.q-jump-btn.correct {
  background: var(--success-light);
  border-color: var(--success-border);
  color: var(--success-color);
}

.q-jump-btn.wrong {
  background: var(--danger-light);
  border-color: var(--danger-border);
  color: var(--danger-color);
}

.q-jump-btn.active {
  box-shadow: 0 0 0 2px var(--accent-color);
}

.tool-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-tool {
  background: transparent;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
}

.btn-tool:hover {
  color: var(--accent-color);
  border-color: var(--accent-color);
}

.btn-tool.active {
  background: var(--accent-light);
  color: var(--accent-color);
  border-color: var(--accent-border);
}

/* Main Container Splitter Layout */
.main-layout {
  flex: 1;
  display: flex;
  position: relative;
  overflow: hidden;
  height: calc(100vh - 105px);
}

/* Left Pane: Reading Passage */
.left-pane {
  width: 50%;
  min-width: 250px;
  max-width: calc(100% - 250px);
  height: 100%;
  overflow-y: auto;
  background: var(--bg-pane);
  padding: 26px 36px;
  font-family: var(--font-content);
  font-size: var(--font-size-base);
  line-height: var(--line-height-base);
  scroll-behavior: smooth;
}

.passage-header {
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-color);
  font-family: var(--font-family-sans);
}

.passage-title-main {
  font-size: 21px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text-main);
}

.passage-summary-box {
  background: var(--accent-light);
  border-left: 4px solid var(--accent-color);
  padding: 10px 14px;
  border-radius: 0 8px 8px 0;
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--text-main);
  margin-top: 10px;
}

.para-block {
  margin-bottom: 24px;
  position: relative;
  transition: background-color 0.3s;
  border-radius: 8px;
  padding: 4px 8px;
}

.para-index {
  font-family: var(--font-family-sans);
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-light);
  user-select: none;
  display: inline-block;
  margin-right: 6px;
}

.para-text {
  text-align: justify;
  letter-spacing: -0.01em;
}

.para-text::selection {
  background: #fed7aa;
  color: #7c2d12;
}

.dispute-banner {
  background: #fff7e6;
  border: 1px solid #f0c36d;
  border-left: 4px solid #e8a33d;
  border-radius: 6px;
  padding: 10px 12px;
  margin: 8px 0;
  font-size: 13px;
  line-height: 1.7;
  color: #7a5214;
}
.dispute-banner .dispute-title {
  font-weight: 700;
  color: #b26a00;
  margin-bottom: 4px;
}
.dispute-banner .dispute-note {
  margin-top: 6px;
  font-size: 12px;
  color: #8a6a34;
}
.badge-ans-disputed {
  background: #fde68a !important;
  color: #92400e !important;
  border: 1px solid #f0c36d;
}
/* Splitter / Resizable Divider */
.splitter {
  width: 10px;
  height: 100%;
  background: var(--splitter-bg);
  cursor: col-resize;
  position: relative;
  flex-shrink: 0;
  user-select: none;
  z-index: 15;
  transition: background-color 0.15s;
}

.splitter:hover, .splitter.dragging {
  background: var(--splitter-active);
}

.splitter-handle {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 6px;
  height: 38px;
  background: #a89a8a;
  border-radius: 4px;
  transition: background-color 0.15s;
}

.splitter:hover .splitter-handle, .splitter.dragging .splitter-handle {
  background: #ffffff;
}

/* Right Pane: Questions & Options */
.right-pane {
  flex: 1;
  min-width: 250px;
  height: 100%;
  overflow-y: auto;
  background: var(--bg-main);
  padding: 24px 28px;
  scroll-behavior: smooth;
}

.q-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.q-card:hover {
  border-color: #cbd5e1;
  box-shadow: var(--shadow-md);
}

.q-card.current {
  border-color: var(--accent-color);
}

.q-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 14px;
}

.q-num-badge {
  background: var(--accent-light);
  color: var(--accent-color);
  font-weight: 800;
  font-size: 14px;
  padding: 4px 10px;
  border-radius: 8px;
  flex-shrink: 0;
}

.q-stem {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-main);
  line-height: 1.5;
  flex: 1;
}

.options-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 14px;
}

.option-item {
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 10px 14px;
  background: var(--bg-card);
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  transition: all 0.15s;
  user-select: none;
}

.option-item:hover {
  border-color: var(--accent-color);
  background: var(--accent-light);
}

.option-letter {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1.5px solid var(--text-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 12px;
  color: var(--text-muted);
  flex-shrink: 0;
  transition: all 0.15s;
}

.option-text {
  font-size: 14.5px;
  line-height: 1.55;
  color: var(--text-main);
  flex: 1;
}

/* Option States */
.option-item.selected {
  border-color: var(--accent-color);
  background: var(--accent-light);
}

.option-item.selected .option-letter {
  background: var(--accent-color);
  border-color: var(--accent-color);
  color: #fff;
}

.option-item.correct {
  border-color: var(--success-color) !important;
  background: var(--success-light) !important;
}

.option-item.correct .option-letter {
  background: var(--success-color) !important;
  border-color: var(--success-color) !important;
  color: #fff !important;
}

.option-item.wrong {
  border-color: var(--danger-color) !important;
  background: var(--danger-light) !important;
}

.option-item.wrong .option-letter {
  background: var(--danger-color) !important;
  border-color: var(--danger-color) !important;
  color: #fff !important;
}

/* Analysis Box */
.analysis-box {
  margin-top: 14px;
  padding: 14px;
  background: var(--bg-main);
  border-radius: 8px;
  border-left: 4px solid var(--accent-color);
  font-size: 13px;
  line-height: 1.6;
  color: var(--text-main);
  display: none;
}

.analysis-box.show {
  display: block;
}

.analysis-header {
  font-weight: 700;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.badge-ans {
  background: var(--success-color);
  color: #fff;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 12.5px;
  font-weight: 700;
}

/* Vocabulary & Keyword Panel */
.vocab-panel {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}

.vocab-header {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-main);
}

.vocab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px;
}

.vocab-chip {
  background: var(--bg-main);
  border: 1px solid var(--border-color);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  display: flex;
  flex-direction: column;
}

.vocab-word {
  font-weight: 700;
  color: var(--accent-color);
}

.vocab-trans {
  color: var(--text-muted);
  font-size: 11px;
}

/* Instant word definition popup */
#word-popup {
  position: fixed;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-lg);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  z-index: 1000;
  display: none;
  max-width: 280px;
  pointer-events: auto;
  line-height: 1.5;
}

#word-popup .wp-title {
  font-weight: 800;
  color: var(--accent-color);
  font-size: 14px;
  margin-bottom: 4px;
}

#word-popup .wp-trans {
  color: var(--text-main);
}

/* Bottom Score Bar */
.bottom-bar {
  background: var(--bg-header);
  border-top: 1px solid var(--border-color);
  padding: 8px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  flex-shrink: 0;
}

.score-stats {
  display: flex;
  align-items: center;
  gap: 16px;
}

.score-num {
  font-weight: 700;
  color: var(--accent-color);
}

/* Responsive */
/* ============ 移动端 / 窄屏自适应 ============ */
@media (max-width: 900px) {
  html, body { height: auto; }
  body {
    height: auto;
    overflow: auto;
    min-height: 100vh;
  }
  /* 顶栏：纵向堆叠，解除单行挤压 */
  header {
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    padding: 10px 12px;
  }
  .logo-group { justify-content: center; flex-wrap: wrap; gap: 8px; }
  .logo-title { white-space: normal; font-size: 14px; line-height: 1.3; text-align: center; }
  .logo-badge { font-size: 12px; padding: 3px 8px; }
  .nav-controls {
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .text-selector { max-width: 100%; width: 100%; }
  .filter-tab-group { width: 100%; justify-content: center; }
  .filter-tab { flex: 1 1 auto; padding: 6px 8px; font-size: 12px; }
  .btn-nav, .timer-box { flex: 0 0 auto; }

  /* 二级导航栏：允许换行，标题不再挤成一列 */
  .sub-bar {
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 8px;
    padding: 8px 12px;
  }
  .article-meta-left { flex-wrap: wrap; gap: 6px; width: 100%; }
  .article-title-bar { white-space: normal; flex: 1 1 100%; font-size: 13px; line-height: 1.4; }
  .q-jump-group { flex-wrap: wrap; width: 100%; }
  .tool-actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }

  /* 主区域：改为单栏纵向滚动，不再用固定 50% 高度 */
  .main-layout {
    flex-direction: column;
    height: auto !important;
    overflow: visible !important;
  }
  .left-pane {
    width: 100% !important;
    max-width: none !important;
    min-width: 0 !important;
    height: auto !important;
    max-height: none !important;
    overflow-y: visible !important;
    padding: 16px 14px !important;
  }
  .right-pane {
    width: 100% !important;
    min-width: 0 !important;
    height: auto !important;
    overflow-y: visible !important;
    padding: 16px 12px !important;
  }
  .splitter { display: none !important; }

  /* 底部统计栏：换行 */
  .bottom-bar {
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 12px;
  }
  .score-stats { flex-wrap: wrap; gap: 8px; font-size: 12px; }
}

/* 更窄的小屏手机（<=480px）进一步收紧 */
@media (max-width: 480px) {
  .logo-title { font-size: 13px; }
  .left-pane { padding: 12px 10px !important; }
  .right-pane { padding: 12px 8px !important; }
  .passage-content, .passage-text { font-size: 16px !important; line-height: 1.7 !important; }
  .option-item { padding: 10px 10px; }
  .opt-an-row { font-size: 0.9em; padding: 6px 8px; }
}

/* 逐选项解析 */
.opt-an-list {
  margin-top: 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.opt-an-row {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  line-height: 1.6;
  font-size: 0.92em;
  background: rgba(0,0,0,0.03);
  border-left: 3px solid #c9b48a;
  padding: 6px 10px;
  border-radius: 4px;
}
.opt-an-row.opt-an-right {
  background: rgba(76,175,80,0.12);
  border-left-color: #4caf50;
}
.opt-an-letter {
  flex: 0 0 auto;
  font-weight: 700;
  color: #8a6d3b;
  min-width: 1.2em;
}
.opt-an-row.opt-an-right .opt-an-letter { color: #2e7d32; }
.opt-an-text { flex: 1 1 auto; }

/* ===== New header: timer clock + directory ===== */
[hidden] { display: none !important; }
.nav-controls { position: relative; }
.timer-wrap { position: relative; }
.timer-clock-btn {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-main); border: 1px solid var(--border-color);
  padding: 6px 12px; border-radius: 8px; cursor: pointer;
  font-family: monospace; font-size: 14px; font-weight: 700;
  color: var(--text-main); transition: all .15s;
}
.timer-clock-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }
.timer-clock-btn .clock-ico { font-size: 15px; }
.timer-popover {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 60;
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14);
  padding: 12px 14px; min-width: 200px;
}
.timer-pop-title { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
.timer-pop-row { display: flex; gap: 8px; }
.timer-start-btn { font-family: monospace; }

.btn-directory {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-card); border: 1px solid var(--border-color);

akes an anti-regulatory stance.", "C": "has issued a special resolution.", "D": "has allowed the states to intervene."}, "answer": "B", "hint": {"para": 2, "type": "推断题", "focus": "第二段指出FCC共和党主导的命令消除了奥巴马时期的中立性规则，放弃了监管权力，即takes an anti-regulatory stance。"}, "question_type": "推断题", "option_analysis": {"A": "【偷换概念】out-of-date order是法官对司法层面的说法，FCC面对要求时是主动撤销监管，而非固守旧命令。", "B": "【正解】第二段说FCC由共和党起草的命令eliminated the strict net neutrality rules并rejected the commission's authority，即持anti-regulatory立场。", "C": "【无中生有】原文未提FCC发布special resolution，反而强调其prolonged the fight。", "D": "【正反混淆】第二段说该命令declared that state and local governments couldn't regulate，是禁止州干预，而非允许。"}}, {"q_num": 38, "stem": "What can be learned about AT&T from Paragraph 3?", "options": {"A": "It protects against unfair competition.", "B": "It engages in anti-competitive practices.", "C": "It is under the FCC's investigation.", "D": "It is in pursuit of quality service."}, "answer": "B", "hint": {"para": 3, "type": "细节题", "focus": "第三段指出，像AT&T这样的宽带巨头在偏袒自家关联业务、打压竞争对手方面存在反竞争行为（anti-competitive practices），答案选B。"}, "question_type": "细节题", "option_analysis": {"A": "【张冠李戴】原文说FCC声称其他机构会protect against anti-competitive behavior，但AT&T本身正是被指反竞争的对象。", "B": "【正解】第三段举例AT&T这类conglomerate偏袒自家视频服务、压制Netflix，属于anti-competitive practices。", "C": "【正反混淆】第三段说FCC ended the investigations终止调查，并非AT&T正在接受调查。", "D": "【无中生有】原文未提AT&T追求quality service。"}}, {"q_num": 39, "stem": "Judge Patricia Millett argues that the appeals court's decision", "options": {"A": "focus on trivialities.", "B": "conveys an ambiguous message.", "C": "is at odds with its earlier rulings.", "D": "is out of touch with reality."}, "answer": "D", "hint": {"para": 4, "type": "态度题", "focus": "第四段法官Patricia Millett指出‘the result is unhinged from realities’，形容当前判决脱离实际、监管过时，即outdated。"}, "question_type": "态度题", "option_analysis": {"A": "【偷换概念】法官并未说判决focus on trivialities，而是说其脱离现实。", "B": "【无中生有】原文未提ambiguous message，法官表态明确为判决与现实脱节。", "C": "【偷换概念】原文说判决与realities不符，不是与判例(earlier rulings)相矛盾。", "D": "【正解】第四段法官指出the result is unhinged from the realities of modern broadband service，即判决脱离实际，对应out of touch with reality。"}}, {"q_num": 40, "stem": "What does the author argue in the last paragraph?", "options": {"A": "Congress needs to take action to ensure net neutrality.", "B": "The FCC should be put under strict supervision.", "C": "Rules need to be set to diversify online services.", "D": "Broadband providers' rights should be protected."}, "answer": "A", "hint": {"para": 6, "type": "主旨题", "focus": "最后一段呼吁‘Congress should step in’，国会必须通过明确立法赋予监管权，对应A选项。"}, "question_type": "主旨题", "option_analysis": {"A": "【正解】第六段呼吁Congress to act，要求赋予FCC明确权威、制定清晰规则保护网络开放与创新。", "B": "【偷换概念】原文是呼吁国会赋权FCC，而非把FCC置于strict supervision。", "C": "【偷换概念】原文针对openness规则，并非为diversify online services。", "D": "【正反混淆】全文批评宽带商损害竞争，作者并未主张保护宽带商的rights。"}}], "detailed_analysis": "本文探讨美国宽带提供商在废除‘网络中立性’原则后的商业行为与反垄断挑战。核心在于宽带运营商（如Comcast、AT&T）可能通过歧视性限速或收费打击竞争对手的流媒体服务。题目考查点集中在FCC的监管立场转变、司法判决结果（维持废除但禁止阻碍州法）以及立法授权的紧迫性。", "keywords": [{"word": "broadband", "trans": "n. 宽带网络"}, {"word": "net neutrality", "trans": "n. 网络中立性"}, {"word": "affiliated", "trans": "adj. 附属的，有关联的"}, {"word": "deregulatory", "trans": "adj. 解除管制的"}, {"word": "anachronism", "trans": "n. 时代错误，过时的人或事"}, {"word": "abdication", "trans": "n. 放弃职责，退位"}]}, {"id": "eng1_2022_t4", "exam": "英语一", "year": "2022", "text_num": "Text 4", "title": "新西兰《雇佣关系法》与高薪员工解雇争议", "difficulty": "困难★★★★★", "summary": "探讨新西兰《雇佣关系法》中的个人申诉条款（Personal Grievance）对于高管/高薪员工解雇是否过当保护，以及由此引发的企业用工法案争议。", "paragraphs": ["The personal grievance provisions of New Zealand's Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.", "Personal grievance procedures were designed to guard the jobs of ordinary workers from 4 unjustified dismissals”. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.", "But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.", "Consequently- and paradoxically- laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.", "If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing underperforming managers, those laws act as a constraint on firm productivity and therefore on workers9 wages. Indeed, in “An International Perspective on New Zealand's Productivity Paradox” (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country's poor productivity growth record.", "Nor are highly paid managers themselves immune from the harm caused by the ERA'S unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.", "Society also suffers from excessive employment protections. Stringent job dismissal regulations adversely affect productivity growth and hamper both prosperity and overall well-being.", "Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified <chigh-income threshold“ from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members9 Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year."], "questions": [{"q_num": 36, "stem": "The personal grievance provisions of the ERA are intended to", "options": {"A": "punish dubious corporate practices.", "B": "improve traditional hiring procedures.", "C": "exempt employers from certain duties.", "D": "protect the rights of ordinary workers."}, "answer": "D", "hint": {"para": 1, "type": "细节题", "focus": "第一段明确指出ERA的个人申诉机制是为了保护可能受到不当对待的雇员（protect ordinary workers' rights）。"}, "question_type": "细节题", "option_analysis": {"A": "【无中生有】原文未提惩罚可疑企业行为，第一段讲的是防止无正当理由解雇员工。", "B": "【偷换概念】原文谈的是解雇的正当性程序，而非改进传统招聘程序。", "C": "【正反混淆】原文是要求雇主承担责任、证明解雇有理，而非豁免其义务。", "D": "【正解】第一段及第二段指出个人申诉程序旨在保护普通工人免受不当解雇（guard the jobs of ordinary workers），对应保护普通工人权利。"}}, {"q_num": 37, "stem": "It can be learned from Paragraph 3 that the provisions may", "options": {"A": "hinder business development.", "B": "undermine managers' authority.", "C": "affect the public image of the firms.", "D": "worsen labor-management relations."}, "answer": "A", "hint": {"para": 2, "type": "细节题", "focus": "第二段指出企业高管年薪数十万，若发生纠纷仍能索取巨额解雇赔偿金，令雇主倍感负担。"}, "question_type": "细节题", "option_analysis": {"A": "【正解】第三段指出这些条款适用于高薪管理者时给企业带来困难（create difficulties for businesses），是提升生产力和整体表现的阻碍（handbrake on boosting productivity），即妨碍企业发展。", "B": "【无中生有】原文未提削弱管理者权威，讨论的是限制企业解雇表现不佳的高管。", "C": "【无中生有】原文未涉及企业公共形象问题。", "D": "【无中生有】原文未提劳资关系恶化。"}}, {"q_num": 38, "stem": "Which of the following measures would the Productivity Commission support?", "options": {"A": "Imposing reasonable wage restraints.", "B": "Enforcing employment protection laws.", "C": "Limiting the powers of business owners.", "D": "Dismissing poorly performing managers."}, "answer": "D", "hint": {"para": 4, "type": "推断题", "focus": "第四段论述高收入群体在谈判中拥有较强的议价能力与法律资源，不应与底层弱势员工等量齐观。"}, "question_type": "推断题", "option_analysis": {"A": "【无中生有】生产力委员会关注的是管理能力低下拖累生产率，未提限制工资。", "B": "【正反混淆】第五段指出就业保护法限制生产力、抑制工人工资，委员会不会主张强化这类法律。", "C": "【正反混淆】原文主张放宽对企业主的限制，而非限制其权力。", "D": "【正解】第三、五段强调解雇表现不佳的高管（dismissing poorly performing managers）对提升生产力至关重要，符合生产力委员会对管理质量的关注。"}}, {"q_num": 39, "stem": "What might be an effect of ERA’S unjustified dismissal procedures?", "options": {"A": "Highly paid managers lose their jobs.", "B": "Employees suffer from salary cuts.", "C": "Society sees a rise in overall well-being.", "D": "Employers need to hire new staff."}, "answer": "B", "hint": {"para": 6, "type": "推断题", "focus": "第六段讨论引入薪资门槛（income cap）将高管排除在外的提案，探讨其在实施上的两难争议。"}, "question_type": "推断题", "option_analysis": {"A": "【正反混淆】第六段说高薪管理者反而不受保护，但解雇程序使雇主更谨慎招聘，反而更难就业，并非直接失业。", "B": "【正解】第六段末句明确：企业因承担雇佣关系出错负担而支付员工更少工资（firms pay staff less），即员工遭遇降薪。", "C": "【正反混淆】第七段说过度解雇保护损害生产力与整体福祉，社会福祉下降而非上升。", "D": "【正反混淆】第六段说因解雇成本高，雇主招聘新人更谨慎，是减少而非需要招聘。"}}, {"q_num": 40, "stem": "It can be inferred that the “high-income thresholdin Australia", "options": {"A": "has secured managers' earnings.", "B": "has produced undesired results.", "C": "is beneficial to business owners.", "D": "is difficult to put into practice."}, "answer": "C", "hint": {"para": 8, "type": "推断题", "focus": "末段首句澳大利亚的高收入门槛（high-income threshold）将高薪高管排除在不公平解雇法保护之外，推断对企业主有利（C）；部分解析主张该机制『难以付诸实践』（D），存有分歧。"}, "disputed": true, "answerPrimary": "C", "answerAlt": "D", "disputeNote": "本题为争议题：主流机构（新东方、华图、《考研真相》等）答案为C（is beneficial to business owners，澳大利亚的高收入门槛把高薪高管排除在不公平解雇保护之外，对企业主有利）；亦有部分资料/考生坚持D（is difficult to put into practice）。备考了解两种观点即可。", "question_type": "推断题", "option_analysis": {"A": "【偷换概念】门槛是把高收入者排除在解雇法保护之外，并非保障管理者收入。", "B": "【无中生有】原文未描述澳大利亚门槛产生了不良后果。", "C": "【正解】末段指出澳大利亚通过设定高收入门槛将高薪员工排除在不公平解雇法保护外，使企业主可更自由解雇高管，从而对企业主有利。", "D": "【张冠李戴】难以付诸实践的是新西兰2016年提案（unwieldy），而非澳大利亚的门槛。"}}], "detailed_analysis": "本文围绕新西兰《雇佣关系法》（ERA）中的‘个人申诉（Personal Grievance）’条款展开，分析该法律是否过度保护了高收入高管，导致雇主解雇失职高管时面临高额赔偿风险。文章兼顾了雇员权益保障与企业经营灵活性之间的矛盾。", "keywords": [{"word": "grievance", "trans": "n. 不平，抱怨，申诉"}, {"word": "provision", "trans": "n. 条款，规定"}, {"word": "payout", "trans": "n. 支出，巨额赔偿金"}, {"word": "salaried", "trans": "adj. 有薪金的"}, {"word": "vulnerable", "trans": "adj. 脆弱的，易受伤害的"}, {"word": "remedy", "trans": "n./v. 补救，救济"}]}, {"id": "eng1_2023_t3", "exam": "英语一", "year": "2023", "text_num": "Text 3", "title": "水石书店与出版商的渠道博弈战", "difficulty": "困难★★★★★", "summary": "分析英国最大连锁书店Waterstones对图书折扣策略的调整及其与各大出版巨头围绕进销存、退货及渠道利润的深度博弈。", "paragraphs": ["If you're heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex's new children's book The Bench, you might have to be prepared to hunt around a bit; the same may be true of The President's Daughter, the new thriller by Bill Clinton and James Patterson. Both of these books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.", "The problem began late last year, when PRH confirmed that it had introduced a credit limit with Waterstones “ at a very significant le v e l. The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were u quietly retiring them to their relevant sections”.", "PRH declined to comment on the issue, but a spokesperson for Waterstones told me: “ Waterstones are currently operating with reduced credit terms from PRH, the only publisher in the UK to place any limitations on our ability to trade. We are not boycotting PRH titles but we are doing our utmost to ensure that availability for customers remains good despite the lower overall levels of stock. We are hopeful with our shops now open again that normality will return and that we will be allowed to buy appropriately. Certainly, our shops are exceptionally busy. The sales for our May Books of the Month surpassed any month since 2018.”", "In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but ifs those mid-list authors, who normally rely on Waterstones staffs passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.", "It comes at a time when authors are already worried about the consequences of the proposed merger between PRH and another big publisher, Simon & Schuster- the reduction in the number of unaligned UK publishers is likely to lead to fewer bidding wars, lower advances, and more conformity in terms of what is published.", "This is all part of a wider change towards concentration of power,“ says literary agent Andrew Lownie. \" The publishing industry talks about diversity in terms of authors and staff but it also needs a plurality of ways of delivering intellectual contact, choice and different voices. After all, many of the most interesting books in recent years have come from small publishers/J", "We shall see whether that plurality is a casualty of the current need among publishers to be big enough to take on all-comers."], "questions": [{"q_num": 31, "stem": "The author mentions two books in Paragraph 1 to present", "options": {"A": "an ongoing conflict.", "B": "an intellectual concept.", "C": "a prevailing sentiment.", "D": "a literary phenomenon."}, "answer": "A", "hint": {"para": 1, "type": "例证题", "focus": "首段通过提及两部关于出版界冲突的新书，引出Waterstones与各大出版商当前正在上演的真实利益博弈（an ongoing conflict）。"}, "question_type": "例证题", "option_analysis": {"A": "【正解】第1段以Waterstones难觅两本新书为例，引出其与出版商PRH之间正在进行的对抗（stand-off），即一场持续的冲突。", "B": "【无中生有】首段只是在讲两家图书难以找到的销售现象，并未据此提出任何思想/知识概念。", "C": "【偷换概念】原文说的是零售渠道与出版商的利益博弈，并非某种普遍的“情绪/舆论倾向”。", "D": "【范围放大】两本新书只是引出冲突的引子，把它泛化成整个“文学现象”过宽，偏离例证的指向。"}}, {"q_num": 32, "stem": "Why did Waterstones shops retire PRH books to their relevant sections?", "options": {"A": "To make them easily noticeable.", "B": "To comply with PRH's requirement.", "C": "To respond to PRH's business move.", "D": "To arrange them in a systematic way."}, "answer": "C", "hint": {"para": 3, "type": "原因题", "focus": "第三段指出实体书店需要更高的毛利润以维持昂贵的临街租金和专业店员成本。"}, "question_type": "原因题", "option_analysis": {"A": "【正反混淆】原文说把这些书从显眼位置撤下、悄悄归位，目的恰是不让其显眼，与“容易注意到”相反。", "B": "【张冠李戴】这是PRH的要求（设信用额度），而书店归位书籍是书店对PRH做法的应对，并非遵从PRH要求。", "C": "【正解】第2段指出PRH设信用额度后，书店被要求把PRH的书从显眼处撤下归位，是书店针对PRH商业举措（降低进货信用）作出的应对。", "D": "【偷换概念】归位并非单纯为了“系统化整理”的分类陈列，而是针对PRH限制交易的一种反制手段。"}}, {"q_num": 33, "stem": "What message does the spokesperson for Waterstones seem to convey?", "options": {"A": "Their customers remain loyal.", "B": "The credit limit will be removed.", "C": "Their stock is underestimated.", "D": "The book market is rather slack."}, "answer": "A", "hint": {"para": 4, "type": "推断题", "focus": "发言人强调书店『照常营业』且图书销量强劲，并希望双方恢复正常关系、能按合理折扣进货。主张两条解读：① 传递『顾客依然忠诚』；② 传递『信贷额度将（有望）取消/恢复』。两种解读在机构间存在分歧。"}, "disputed": true, "answerPrimary": "A", "answerAlt": "B", "disputeNote": "本题为经典争议题：新东方、知乎多数解析主张答案为A（Their customers remain loyal，据P4『our shops are exceptionally busy and book sales are very strong』）；另有机构答C/B（对应本卷选项B『The credit limit will be removed』，依据发言人希望恢复关系、获准适当采购）。官方未统一，以所用真题解析为准。", "question_type": "推断题", "option_analysis": {"A": "【正解】发言人强调“照常营业”、5月月度图书销量超2018年以来任何月份，反映出顾客依然忠诚、购买强劲。", "B": "【过度推断】原文只是“希望”恢复正常、能按合理折扣进货，是一种期望，并未断定信用额度一定会取消。", "C": "【偷换概念】原文说因整体库存水平降低而尽力保证可获性，并非暗示“库存被低估”。", "D": "【正反混淆】发言人称书店异常繁忙、销量创高，与“市场萧条”相反。"}}, {"q_num": 34, "stem": "What can be one consequence of the current dispute?", "options": {"A": "Sales of books by mid-list PRH writers fell off considerably.", "B": "Lesser-known PRH writers become the target of criticism.", "C": "Waterstones staff hesitate to promote big-name authors' books.", "D": "Waterstones branches suffer a severe reduction in revenue."}, "answer": "A", "hint": {"para": 5, "type": "细节题", "focus": "第五段分析若独立书店因折扣劣势被挤压，将损害整个图书生态的多样性。"}, "question_type": "细节题", "option_analysis": {"A": "【正解】第4段指出PRH作者是输家，尤其依赖书店员工推介的中游作者受影响，其书籍销售会明显受损。", "B": "【偷换概念】原文说中游作者是“祈祷争端结束”的受损方，并非成为被批评的对象。", "C": "【张冠李戴】原文说书店员工本会热心推介小作者的书，受冲击的是中游作者销量，而非员工不愿推介大牌作者。", "D": "【无中生有】原文并未提及书店分支机构的营收会大幅下降，属未给出的后果。"}}, {"q_num": 35, "stem": "Which of the following statements best represents Lownie's view?", "options": {"A": "Small publishers ought to stick together.", "B": "Big publishers will lose their dominance.", "C": "The publishing industry is having a hard time.", "D": "The merger of publishers is a worrying trend."}, "answer": "D", "hint": {"para": 7, "type": "主旨题", "focus": "全文探讨了书店渠道变革对图书文化生态的深远影响，倡导产业链各方寻求共生。"}, "question_type": "主旨题", "option_analysis": {"A": "【无中生有】Lownie强调出版业需要观点与声音的多元化，并未主张小出版商应抱团。", "B": "【过度推断】原文担忧权力集中，但并未断言大出版商将失去主导地位。", "C": "【范围放大】原文聚焦的是合并导致的权力集中与多样性受损，而非笼统说出版业“日子难过”。", "D": "【正解】第5-7段围绕PRH与Simon & Schuster合并导致权力集中、多样性受损展开，Lownie观点正体现这一令人担忧的合并趋势。"}}], "detailed_analysis": "文章聚焦英国实体书店代表水石书店（Waterstones）面对亚马逊冲击下的供应链自救政策，以及其要求出版商提供更高批发折扣所引发的激烈博弈。展现了传统文化产业在数字化浪潮下的生存策略与反抗。", "keywords": [{"word": "retailer", "trans": "n. 零售商"}, {"word": "discount", "trans": "n./v. 折扣"}, {"word": "margin", "trans": "n. 利润空间，边缘"}, {"word": "independents", "trans": "n. 独立实体（书店）"}, {"word": "wholesaler", "trans": "n. 批发商"}, {"word": "distributor", "trans": "n. 发行商，分销商"}]}, {"id": "eng1_2023_t4", "exam": "英语一", "year": "2023", "text_num": "Text 4", "title": "科学论文引用乱象与学术评价机制", "difficulty": "困难★★★★★", "summary": "批判当前科研考核中唯“引用量”论英雄的弊端，揭露学术界互相引用、拉帮结派的灰色生态及挽救学术严谨性的策略。", "paragraphs": ["Scientific papers are the recordkeepers of progress in research. Each year researchers publish millions of papers in more than 30,000 journals. The scientific community measures the quality of those papers in a number of ways, including the perceived quality of the journal (as reflected by the title's impact factor) and the number of citations a specific paper accumulates. The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.", "Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize", "that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this predatory behavior has emerged: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.", "The advent of electronic publishing and authors9 need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn't far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all- it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.", "How insidious is this type of citation manipulation? In one example, an individual—acting as author, editor, and consultant—was able to use at least 15 journals as citation providers to articles published by five scientists at three universities. The problem is rampant in Scopus, a citation database, which includes a high number of the new “international“ journals. In fact, a listing in Scopus seems to be a criterion to be targeted in this type of citation manipulation.", "Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal."], "questions": [{"q_num": 36, "stem": "According to Paragraph 1, the careers of scientists can be determined by", "options": {"A": "how many citations their works contain.", "B": "how many times their papers are cited.", "C": "the prestige of the people they work with.", "D": "the status they have in scientific circles."}, "answer": "B", "hint": {"para": 1, "type": "细节题", "focus": "第一段指出科学家的学术前途往往直接被论文被引用的数量所左右。"}, "question_type": "细节题", "option_analysis": {"A": "【偷换概念】原文说 depend on the number of citations a paper accumulates，即论文被引用次数，而选项说作品\"包含\"多少引用(works contain)，把\"被引\"偷换成\"内含引用\"。", "B": "【正解】第一段末句\"even more so on the citations attracted by these papers\"明确科学家的学术前途取决于论文被引用的次数，与 cited 对应。", "C": "【无中生有】原文未提合作者的声望(prestige of the people they work with)，只谈论文与引用。", "D": "【偷换概念】\"the reputation of their institutions depend on...\"谈机构声望，非科学家在学界的地位(status in scientific circles)。"}}, {"q_num": 37, "stem": "The support service consultancies tend to", "options": {"A": "recommend journals to their clients.", "B": "list citation patterns for their clients.", "C": "ask authors to include extra citations.", "D": "advise contributors to cite each other."}, "answer": "C", "hint": {"para": 2, "type": "细节题", "focus": "第二段揭露所谓的‘citation cartels’（引用卡特尔），即学者之间通过私下结盟相互密集引用以虚增指标。"}, "question_type": "细节题", "option_analysis": {"A": "【无中生有】原文说咨询公司 advise contributors to add citations，未提向客户推荐期刊。", "B": "【偷换概念】\"list citation patterns\"把\"建议加引用\"偷换成\"为客户列出引用模式\"，原文无此意。", "C": "【正解】第三段末句\"sometimes advise contributors to add a number of citations to their articles\"直接对应 ask authors to include extra citations。", "D": "【偷换概念】cite each other 是 citation cartels 中期刊相互引用的做法，非 support service consultancies 的做法，张冠李戴。"}}, {"q_num": 38, "stem": "The function of the “milk cow“ journals is to", "options": {"A": "boost citation counts for certain authors.", "B": "help scholars publish articles at low cost.", "C": "instruct first-time contributors in citation.", "D": "increase the readership of new journals."}, "answer": "A", "hint": {"para": 4, "type": "推断题", "focus": "第四段指出学术出版期刊为了提升自身影响因子（Impact Factor），也存在纵容甚至诱导引用的倾向。"}, "question_type": "推断题", "option_analysis": {"A": "【正解】第四段\"milk cow\"期刊每篇文章都引用特定论文\"may cite a specific paper or a series of papers\"，功能就是为特定作者抬高引用数(boost citation counts)。", "B": "【无中生有】原文未提帮学者低成本发表文章。", "C": "【无中生有】未提指导初次投稿者引用。", "D": "【偷换概念】原文说期刊是给别人提供引用，而非增加自身新期刊的读者量。"}}, {"q_num": 39, "stem": "What can be learned about Scopus from the last two paragraphs?", "options": {"A": "It fosters competition among citation providers.", "B": "It has the capability to identify suspicious citations.", "C": "It hinders the growth of “international“ journals.", "D": "It is established to prevent citation manipulation."}, "answer": "B", "hint": {"para": 5, "type": "推断题", "focus": "第五段作者对单纯依赖量化数字指标衡量学术价值的做法表达了强烈的怀疑与批判。"}, "question_type": "推断题", "option_analysis": {"A": "【无中生有】原文未提 Scopus 促进引用提供者之间的竞争。", "B": "【正解】第六段首句\"Scopus itself has all the data necessary to detect this malpractice\"，说明其有能力识别可疑引用。", "C": "【正反混淆】原文说 Scopus 收录大量新\"国际\"期刊且成为操纵目标，并非阻碍其发展。", "D": "【正反混淆】Scopus 是被操纵的对象和检测数据库，并非为阻止操纵而设立。"}}, {"q_num": 40, "stem": "What should an author do to deal with citation manipulators?", "options": {"A": "Take legal action.", "B": "Demand an apology.", "C": "Seek professional advice.", "D": "Reveal their misconduct."}, "answer": "D", "hint": {"para": 6, "type": "细节题", "focus": "文章呼吁彻底改革单一引用量评价机制，回归对科研本质与实质性贡献的质性评估。"}, "question_type": "细节题", "option_analysis": {"A": "【无中生有】原文建议\"do not oblige and do report the request\"，未提采取法律行动。", "B": "【无中生有】未提要求道歉。", "C": "【答非所问】原文劝作者不要照做而是举报，并非寻求专业建议。", "D": "【正解】末句\"do not oblige and do report the request to the journal\"，report 对应 reveal their misconduct，即揭露其不当行为。"}}], "detailed_analysis": "文章深入揭露科研论文评价体系被‘引用量（Citation Count）’异化的学术乱象，包括同行互引集团、刷引用因子、以及学术利益共同体为了职称和经费牺牲科学真实性的严峻现实。", "keywords": [{"word": "citation", "trans": "n. 引用，引证"}, {"word": "misconduct", "trans": "n. 不端行为，渎职"}, {"word": "metric", "trans": "n. 度量指标"}, {"word": "cartel", "trans": "n. 卡特尔，垄断集团"}, {"word": "rigorous", "trans": "adj. 严格的，严密的"}, {"word": "integrity", "trans": "n. 正直，学术诚信"}]}, {"id": "eng1_2025_t1", "exam": "英语一", "year": "2025", "text_num": "Text 1", "title": "莎士比亚排练室教学法助力小学生英语与情感发展", "difficulty": "困难★★★★★", "summary": "研究表明运用皇家莎士比亚剧团的“排练室”互动戏剧教学法，能有效突破小学生语言瓶颈并极大提升情绪与表达认知能力。", "paragraphs": ["The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after ground-breaking research showed that Shakespeare does benefit children’s literacy and emotional development. But only if you act him out.", "A study found that a “rehearsal room” approach to teaching Shakespeare broadened children’s vocabulary and the complexity of their writing as well as their emotional literacy. “The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,” Jacqui O’Hanlon of the Royal Shakespeare Company (RSC), which commissioned the study, said.", "The randomised control trial involved hundreds of year 5 pupils—aged nine and ten—at 45 state primary schools that had not been “previously exposed to RSC pedagogy”. They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.", "The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words “classed as more sophisticated or rarer”, and wrote at greater length. They also “appear to be more comfortable writing in role...while [control] group imagine how they themselves would react to being shipwrecked, [target] group put themselves in the shoes of a literary character and express that character’s emotion”.", "The Time to Act study also found that while control pupils relied on “desert island cliches” such as palm trees, target pupils were “more expansive [giving] a broader picture of the sky, the sea and the atmospheric conditions”.", "O’Hanlon said she had been most surprised by the “emotional literacy that was evident in the [target] children’s writing” and that they were “more resilient in their writing, more hopeful”. She added: “The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.” The study showed the importance of embedding the arts in education, she said.", "But could the results be replicated with any old dramatist? O’Hanlon said more research would be needed but suggested that Shakespeare’s use of 20,000 words, compared with the everyday 2,000 words, gave a “massive expansion of language into children’s lives”, which was combined with children “using their whole bodies to bring words to life”."], "questions": [{"q_num": 21, "stem": "The “rehearsal room” approach requires pupils to .", "options": {"A": "rewrite the lines from Shakespeare", "B": "watch RSC actors’ performances", "C": "play the roles in Shakespeare", "D": "study drama under RSC artists"}, "answer": "C", "hint": {"para": 2, "type": "细节题", "focus": "第二段阐述排练室方法让学生亲身扮演角色、念诵台词，打破纸面隔阂。"}, "question_type": "细节题", "option_analysis": {"A": "【偷换概念】原文强调让孩子act out、代入角色，而非简单改写台词rewrite the lines。", "B": "【无中生有】原文未要求孩子观看RSC演员表演，而是自己参与演出。", "C": "【正解】第二段说该方法让孩子亲身扮演戏剧角色、用身体让文字活起来，即play the roles in Shakespeare。", "D": "【偷换概念】是RSC委托研究，孩子并非在RSC艺术家指导下study drama。"}}, {"q_num": 22, "stem": "The study divided the pupils into two groups to find whether .", "options": {"A": "the change in instruction enhances learning outcomes", "B": "expanding vocabulary helps develop reading fluency", "C": "emotion affects understanding of sophisticated works", "D": "the classroom activity stimulates interest in the arts"}, "answer": "A", "hint": {"para": 3, "type": "推断题", "focus": "实验设置对照组与实验组，旨在评估戏剧实践对于阅读认知与词汇内化的实际增益。"}, "question_type": "推断题", "option_analysis": {"A": "【正解】第三段设target与control两组，通过戏剧活动这一教学方式差异，考察其对词汇、写作等learning outcomes的影响。", "B": "【答非所问】扩大词汇是实验结果，而非分组所考察的变量。", "C": "【偷换概念】实验并非考察emotion如何影响对高深作品的理解。", "D": "【偷换概念】实验目的不是看活动是否stimulates interest in the arts，而是看对读写与情感素养的作用。"}}, {"q_num": 23, "stem": "Control pupils’ reliance on “desert island cliches” shows their .", "options": {"A": "weakness in description", "B": "omission of small details", "C": "casual style of writing", "D": "preference for big words"}, "answer": "A", "hint": {"para": 4, "type": "推断题", "focus": "对照组学生在表达时往往停留在刻板的陈词滥调，缺乏深层情感投射。"}, "question_type": "推断题", "option_analysis": {"A": "【正解】第五段说对照组依赖desert island cliches等刻板描写，而实验组更expansive，说明对照组描写薄弱(weakness in description)。", "B": "【偷换概念】问题是画面陈腐单一，而非omission of small details。", "C": "【无中生有】原文未提对照组文风casual，而是想象力/描写贫乏。", "D": "【正反混淆】恰恰相反，对照组用陈词滥调，实验组才用更sophisticated的词汇。"}}, {"q_num": 24, "stem": "What can promote children’s emotional literacy according to O’Hanlon?", "options": {"A": "Writing in an imaginative manner.", "B": "Identifying with literary characters.", "C": "Drawing inspiration from nature.", "D": "Concentrating on real-life situations."}, "answer": "B", "hint": {"para": 5, "type": "细节题", "focus": "戏剧互动让儿童体验不同角色的内心冲突，从而显著强化共情与情绪读写能力。"}, "question_type": "细节题", "option_analysis": {"A": "【范围缩小】想象力写作是途径之一，但核心是put yourself in different shoes，A未点出角色代入。", "B": "【正解】第六段说儿童在戏剧中put yourself in different shoes、描述不同情感状态，即通过identifying with literary characters促进情感素养。", "C": "【偷换概念】drawing inspiration from nature是对照组的陈旧意象。", "D": "【正反混淆】原文强调想象而非concentrating on real-life situations。"}}, {"q_num": 25, "stem": "It can be inferred from the last paragraph that .", "options": {"A": "the new teaching method may work best with Shakespeare", "B": "the language of Shakespeare may be formidable for pupils", "C": "other old dramatists may be included in primary education", "D": "pupils may be reluctant to work on other old dramatists .4.(415 )"}, "answer": "A", "hint": {"para": 7, "type": "推断题", "focus": "末段总结该实践证明了文学经典不应被奉若神明，而应成为激发儿童创造力的生动载体。"}, "question_type": "推断题", "option_analysis": {"A": "【正解】末段提到莎士比亚2万词汇量与日常2000词巨大差距，暗示该方法在莎剧上效果最佳(may work best with Shakespeare)。", "B": "【过度推断】原文强调莎剧词汇带来语言益处，并未说对小学习者formidable难以跨越。", "C": "【过度推断】原文说需更多研究，未确认其他古典剧作家会被纳入primary education。", "D": "【无中生有】原文未提儿童reluctant to work on other dramatists。"}}], "detailed_analysis": "2025年英语一难度第一篇，探讨英国小学将莎士比亚戏剧排练（Rehearsal-Room Approach）引入课堂的实验。研究证实该教学法能极大促进学生的语言能力、情商感知与阅读自信心，突破了传统填鸭式文学教学的沉闷与刻板印象。", "keywords": [{"word": "rehearsal", "trans": "n. 排练，演习"}, {"word": "literacy", "trans": "n. 读写能力，素养"}, {"word": "cliche", "trans": "n. 陈词滥调"}, {"word": "immersive", "trans": "adj. 沉浸式的"}, {"word": "pedagogical", "trans": "adj. 教学法的，教育学的"}, {"word": "collaborative", "trans": "adj. 合作的，协作的"}]}, {"id": "eng1_2025_t2", "exam": "英语一", "year": "2025", "text_num": "Text 2", "title": "科研碳排放：人类认知世界的生态代价反思", "difficulty": "困难★★★★★", "summary": "探讨超级计算机、空间望远镜与跨国科考带来的巨额碳足迹，反思人类在探索宇宙奥秘与维系地球生态平衡之间的两难抉择。", "paragraphs": ["I was shocked to learn recently that some scientists want to scale back their research in an effort to decrease carbon emissions. The crisis is here, they said, and we need to cut back on our energy-intensive modelling. At the very least, we need to make our energy use far more sustainable.", "It is unarguable that our laboratories, scientific instruments, rockets and satellites—the tools we scientists need to measure the planet’s pulse—demand significant amounts of energy both in their construction and operation. And it is equally true that science’s unrelenting appetite for information has caused a mushrooming of energy-intensive data centres around the world. According to the International Energy Agency, these buildings now consume about 1 per cent of the world’s electricity.", "However, this is a price we must pay for understanding the world. How can we inform decision makers about the best ways to bring down carbon emissions if we can’t track the amount of carbon dioxide in the atmosphere, where it’s coming from and who’s producing it? The carbon emissions from technological research are well spent: ultimately this research will safeguard the future of our planet.", "It can be hard for scientists to make the case because our work is complex, often takes place behind closed doors and does not always lend itself to easy interpretation or explanation. But demonstrating the efficacy of science will be crucial if we are to solve humanity’s greatest challenges.", "Recognising the hope that science and engineering can bring was the impetus behind the creation of the Millennium Technology Prize, which is now entering its 20th year as a celebration of human ingenuity. One of the past winners, Professor Martin Green from the University of New South Wales, Australia, is the inventor of the Passivated Emitter and Rear Cell technology which is now found in most of the world’s solar panels. Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.", "Every day, scientists, technologists and engineers are discovering new ways to exploit renewable energy sources and develop techniques not just to use power more intelligently but to power our intelligence. A great example of this is Europe’s largest supercomputer, LUMI in Finland, which is astonishingly carbon- negative. Established in an old paper mill, it is powered by a nearby river and its remote heat warms the people who live in the surrounding town of Kajaani.", "If the world is to meet its net-zero ambitions, we must think hard about how we can deliver sustainable computing and deliver more LUMIs."], "questions": [{"q_num": 26, "stem": "The author expressed great surprise at some scientists’ .", "options": {"A": "unwillingness to cut carbon emissions", "B": "intention to reduce their research", "C": "suspicions about sustainable energy", "D": "waste of electricity in their projects"}, "answer": "B", "hint": {"para": 1, "type": "态度题", "focus": "首段表达了对某些学者为了环保主动削减科研算力项目的惊愕与反思。"}, "question_type": "态度题", "option_analysis": {"A": "【正反混淆】科学家是想减排，而非不愿减排。", "B": "【正解】第一段首句作者惊愕于一些科学家想为减少碳排放而削减研究（scale back their research），即减少研究的意图。", "C": "【无中生有】原文未提科学家对可持续能源的怀疑。", "D": "【偷换概念】作者惊异的是削减研究这一决定本身，而非项目浪费电。"}}, {"q_num": 27, "stem": "The author believes that carbon emissions from research .", "options": {"A": "have caused grave consequences", "B": "have aroused groundless worries", "C": "are hard to handle at present", "D": "are justifiable in the long run"}, "answer": "D", "hint": {"para": 3, "type": "态度题", "focus": "指出科学探索的碳消耗是人类认识宇宙规律不得不承担的认知成本。"}, "question_type": "态度题", "option_analysis": {"A": "【过度推断】作者认为科研碳排放是值得付出的代价，而非造成严重后果。", "B": "【正反混淆】作者认为这种担忧有根据，研究用能是理解世界的必要代价。", "C": "【无中生有】作者未说碳排放目前难以处理。", "D": "【正解】第三段指出这是理解世界必须付出的代价，科研碳排放是well spent，最终将守护地球未来，即长远看是正当合理的。"}}, {"q_num": 28, "stem": "The example of Green in Paragraph 5 is used to illustrate .", "options": {"A": "the achievements of great scientists", "B": "the urgency of addressing climate change", "C": "the rewards of scientific endeavours", "D": "the value of fostering human ingenuity"}, "answer": "C", "hint": {"para": 5, "type": "例证题", "focus": "引用学者Green的事例，论证科研界在倡导环保的同时必须正视自身的碳足迹。"}, "question_type": "例证题", "option_analysis": {"A": "【范围缩小】举Green是为说明科学探索的回报，而非泛泛赞美科学家成就。", "B": "【答非所问】该例并非论证气候变化的紧迫性。", "C": "【正解】第五段以Green发明太阳能电池技术为例，说明科学努力的回报（科研带来的积极成果），论证科研价值。", "D": "【偷换概念】例子落点在科研的成果与回报，而非培育人类创造力的价值本身。"}}, {"q_num": 29, "stem": "It can be learned from the last two paragraphs that LUMI", "options": {"A": "is a model of sustainability efforts", "B": "is a triumph against energy shortage", "C": "owes much to global net-zero initiatives", "D": "aims to explore the power of intelligence"}, "answer": "A", "hint": {"para": 6, "type": "推断题", "focus": "LUMI超算中心通过利用绿色水力发电，提供了科研与低碳兼容的典范路径。"}, "question_type": "推断题", "option_analysis": {"A": "【正解】第六段介绍LUMI是欧洲最大超算，令人惊叹地实现碳中和，利用水电并回收余热，是可持续努力（sustainability）的典范。", "B": "【无中生有】原文未说LUMI是对抗能源短缺的胜利。", "C": "【张冠李戴】净零目标是世界整体愿景，非LUMI功劳来源。", "D": "【偷换概念】LUMI不是为探索智能的力量，而是可持续计算的实例。"}}, {"q_num": 30, "stem": "Which of the following statements would the author agree with?", "options": {"A": "Emission-free modelling demands extra funding.", "B": "The need for supercomputers is difficult to meet.", "C": "Energy-intensive research work is inevitable.", "D": "The goals of researchers ought to be realistic. .6. ( 15 )"}, "answer": "C", "hint": {"para": 7, "type": "主旨题", "focus": "作者认为不应因噎废食，而应在优化能源效率的前提下坚定支持开拓性基础科研。"}, "question_type": "主旨题", "option_analysis": {"A": "【无中生有】原文未提无碳建模需要额外资金。", "B": "【无中生有】原文未说超级计算机的需求难以满足。", "C": "【正解】全文主张科研的能源消耗是理解世界不得不付的代价，不应因噎废食，即能源密集型研究不可避免且必要。", "D": "【无中生有】作者未讨论研究者目标应现实，反而主张坚定支持科研。"}}], "detailed_analysis": "反思基础科学研究与天文观测中的碳足迹。大型粒子对撞机、超级计算机中心及全球学术飞行参会消耗了不可忽视的能源。作者探讨在追求人类真理的同时如何审视并践行科研自身的脱碳责任。", "keywords": [{"word": "footprint", "trans": "n. 足迹，碳排量"}, {"word": "supercomputing", "trans": "n. 超级计算"}, {"word": "dilemma", "trans": "n. 两难困境"}, {"word": "sustainability", "trans": "n. 可持续性"}, {"word": "observatory", "trans": "n. 天文台"}, {"word": "hypocrisy", "trans": "n. 伪善，虚伪"}]}, {"id": "eng1_2025_t3", "exam": "英语一", "year": "2025", "text_num": "Text 3", "title": "盗版流媒体：好莱坞影视工业面临的新威胁", "difficulty": "困难★★★★★", "summary": "随着主流流媒体平台涨价与内容分散，商业化非法流媒体订阅网络异军突起，令好莱坞影视制作机构面临严重的侵权与利润流失困局。", "paragraphs": ["Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will never be as profitable as cable once was. But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the titles on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.", "With no video production costs, illegal streaming sites have achieved profit margins approaching 90%, according to the Motion Picture Association (MPA), a trade group representing Hollywood studios that’s working to crack down on the thousands of illegal platforms that have cropped up in recent years.", "Initially the rise of legitimate online businesses such as Netflix actually helped curb digital piracy, which had largely been based on file uploads. But now piracy involving illegal streaming services as well as file-sharing costs the US economy about $30 billion in lost revenue a year and some 250,000 jobs, estimates the US Chamber of Commerce’s Global Innovation Policy Center. The global impact is about $71 billion annually.", "“The people who are stealing our movies and our television shows and operating piracy sites are not mom and pop operations,” says Charlie Rivkin, chief executive officer of the MPA. “This is organized crime.” Rivkin joined the MPA in 2017 after the organization failed five years earlier to build consensus between Hollywood and Silicon Valley to win passage of legislation in Congress aimed at stopping online piracy. In 2017 the association formed the Alliance for Creativity and Entertainment (ACE), an enforcement task force of about 100 detectives circling the globe to help local authorities arrest streaming pirates.", "ACE says it’s helped shrink the number of illegal streaming services in North America to 126, from more than 1,400 in 2018, aided in part by the MPA’s support for a 2020 federal law that made large-scale streaming of copyrighted material a serious crime.", "Consulting firm Parks Associates predicts that legitimate US streaming services’ cumulative loss from piracy since 2022 will reach $113 billion in the next two years. “While there is some optimism that emerging countermeasures and best practices may see piracy begin to plateau by 2027, there is no consensus among stakeholders as to when it may begin to decline,” says analyst Steve Hawley."], "questions": [{"q_num": 31, "stem": "According to Paragraph 1, legitimate streaming services", "options": {"A": "have drawn lessons from Hollywood", "B": "have surpassed cable in revenue", "C": "are unpopular with advertisers", "D": "are confronted with a real threat"}, "answer": "D", "hint": {"para": 1, "type": "细节题", "focus": "第一段指出正规流媒体因平台繁多且收费上涨，导致用户体验割裂。"}, "question_type": "细节题", "option_analysis": {"A": "【张冠李戴】原文说的是老牌好莱坞对抗Netflix自身陷入亏损，而非正规流媒体向好莱坞取经。", "B": "【正反混淆】原文说这些服务连年亏损、华尔街担忧其盈利能力永远比不上有线电视，并非收入超过有线。", "C": "【无中生有】第一段并未提及正规流媒体在广告商那里不受欢迎。", "D": "【正解】第1段指出盗版者利用软件盗取影片、在非法平台牟利约20亿美元，正规流媒体正面临这一实实在在的威胁。"}}, {"q_num": 32, "stem": "It can be learned that streamers like Netflix .", "options": {"A": "played a part in the fight against illegal file-sharing", "B": "reaped benefits from the war with digital pirates", "C": "promised to become big job creators in the US", "D": "used to collaborate with file-uploading platforms"}, "answer": "A", "hint": {"para": 2, "type": "推断题", "focus": "Netflix等巨头原本通过便利性抑制了盗版，但现在的商业模式再度制造了灰色生存土壤。"}, "question_type": "推断题", "option_analysis": {"A": "【正解】第3段指出最初Netflix等正规在线业务的兴起实际上帮助遏制了以文件上传为主的数字盗版，即参与了打击非法文件分享。", "B": "【正反混淆】原文说Netflix本是遏制盗版的力量，并非从与盗版的战争中获利。", "C": "【无中生有】原文未提Netflix承诺成为美国大的就业创造者。", "D": "【偷换概念】原文只说合法业务遏制了文件上传式盗版，并未说Netflix曾与文件上传平台合作。"}}, {"q_num": 33, "stem": "It can be inferred from Paragraph 4 that the MPA", "options": {"A": "was denied cooperation by Silicon Valley", "B": "led a national protest against online piracy", "C": "was urged to form an enforcement task force", "D": "failed to win support from local authorities"}, "answer": "A", "hint": {"para": 4, "type": "推断题", "focus": "美国电影协会（MPA）正在推动全球协同技术封禁与法律诉讼重拳出击。"}, "question_type": "推断题", "option_analysis": {"A": "【正解】第4段指出MPA五年前未能在好莱坞与硅谷之间建立共识以推动国会立法，可推断其未获硅谷的合作。", "B": "【偷换概念】原文讲的是组建执法特别小组打击盗版，并非领导全国性抗议。", "C": "【正反混淆】执法特别小组是MPA主动组建的，而非被敦促成立。", "D": "【正反混淆】原文说特别小组是帮助地方当局逮捕盗版者，并未说未能获得地方当局支持。"}}, {"q_num": 34, "stem": "According to Hawley, digital piracy .", "options": {"A": "cannot be checked in spite of new legislation", "B": "will possibly overwhelm legitimate streamers", "C": "is unlikely to diminish in the near future", "D": "has been underestimated by some analysts"}, "answer": "C", "hint": {"para": 5, "type": "细节题", "focus": "行业专家Hawley指出盗版已经演变成高度组织化的跨境商业地下产业。"}, "question_type": "细节题", "option_analysis": {"A": "【正反混淆】原文说2020年联邦法律已将大规模盗版定为重罪、非法平台数量大减，与“新立法也管不住”相反。", "B": "【过度推断】原文说预测到2027年盗版可能趋于平台期，并未说会压倒正规流媒体。", "C": "【正解】第6段Hawley指出各方对盗版何时开始下降尚无共识，可推知盗版在近期不太可能减少。", "D": "【无中生有】原文未说盗版被某些分析人士低估。"}}, {"q_num": 35, "stem": "Which of the following is emphasized in the text?", "options": {"A": "The need to coordinate anti-piracy action.", "B": "The criminal nature of copyright violation.", "C": "The prospect of eliminating online piracy.", "D": "The economic harm from illegal streaming. £*§-(-)« .8. (£■ 15 )"}, "answer": "D", "hint": {"para": 6, "type": "主旨题", "focus": "强调打击盗版不仅需要法律维权，更需要重塑让大众能负担得起的合理内容分发模式。"}, "question_type": "主旨题", "option_analysis": {"A": "【范围缩小】协调反盗版行动只是文中一部分内容，不能覆盖全文强调的重点。", "B": "【范围缩小】犯罪性质只是第4段一点，是局部论据而非全文强调的核心。", "C": "【过度推断】原文明确说各方对盗版何时下降尚无共识，并未描绘彻底消除的前景。", "D": "【正解】全文以大量数据（年损300亿、25万岗位、全球710亿、累计损失1130亿）反复强调非法流媒体对经济的巨大损害。"}}], "detailed_analysis": "好莱坞传统电影制片厂与新兴盗版流媒体网站的博弈。高昂的流媒体订阅费和内容平台割裂促使消费者转向盗版IPTV服务，给传统影视产业带来不可逆的票房与版权打击。", "keywords": [{"word": "piracy", "trans": "n. 盗版，海盗行为"}, {"word": "streaming", "trans": "n. 流媒体"}, {"word": "infringement", "trans": "n. 侵权，违反"}, {"word": "subscription", "trans": "n. 订阅，订阅费"}, {"word": "syndication", "trans": "n. 联合分销"}, {"word": "enforcement", "trans": "n. 执法，执行"}]}, {"id": "eng1_2025_t4", "exam": "英语一", "year": "2025", "text_num": "Text 4", "title": "数字历史记录保存与软硬件迭代危机", "difficulty": "困难★★★★★", "summary": "探讨物理实体文物与易失性数字档案的本质差异，剖析软硬件快速淘汰更迭对现代人类文明记忆长久保存构成的严峻挑战。", "paragraphs": ["Visit any antiques store and you’ll encounter artifacts from the past: photographs, letters, a brochure detailing the Sinclair dinosaur exhibit from the 1964-1965 World’s Fair, the ephemera of history. Yet these objects aren’t truly ephemeral, because they’re still here, decades, even centuries later. Why? Because they’re tangible.", "Have you pondered the life cycle of intangible formats, digital information, given that those who produce these artifacts seldom make provision for their long-term preservation? For millennia, we’ve known what we’ve known due to artifacts that have survived, often despite their original creators’ neglect. The thing itself is the medium that delivers the information. At the time of creation, no attempts were made at intentional preservation, yet analog materials have a chance of surviving and serving as the historical record that biographers, historians, and novelists rely on. Libraries and archives have traditionally shouldered the responsibility of organization, preservation, and access to information. One of S.R. Ranganathan’s foundational Laws of Library Science is “Save the time of the reader.” Thus, librarians digitize the tangible so that researchers the world over can quickly search and access their holdings. The result is an embarrassment of historical riches, which brings its own needle-and-haystack problems.", "Librarians’ selfless devotion can act against us when users point to universality of access by holding up a cellphone and saying, “it’s all in here” as evidence that libraries are less vital for researchers today. Yet how was that universality of access made possible and, perhaps more importantly, how is it maintained? Who curates what is preserved? When it comes to born-digital information, the terrifying answer can be: if not librarians and archivists, then no one. Digital information requires a great deal more care than analog.", "Even when a digital object is preserved, it may only be the carrier that’s saved, not the information itself. As technology advances and a format becomes obsolete, the object is useless. Have you ever stared helplessly at a ZIP disk, thinking: how do I get the files off this? Without constant migration of digital assets, a nightmare about the foreseeable future is what keeps historians up at night: a historical record that abruptly stops when digital replaces analog.", "As a librarian whose day job revolves around special collections and digital assets, I share the night terrors of historians, and I’d be lying if I said a comprehensive preservation solution currently exists. Yet researchers can take some comfort in the fact that there are a multitude of librarians devoted to discovering, organizing, and preserving digital information for researchers current and future. Librarians are uniquely positioned to understand how end users seek and use information. Thus we play an integral role in identifying, preserving, and providing accessibility to digital artifacts so that, while future researchers may find the digital realm a challenging place to ply their trade, they won’t find it an impossible one."], "questions": [{"q_num": 36, "stem": "The author mentions the artifacts from the past to", "options": {"A": "introduce the coming of antiques", "B": "contrast them with everyday items", "C": "bring up the issue of preservation", "D": "comment on their historical value"}, "answer": "C", "hint": {"para": 1, "type": "例证题", "focus": "开篇提及古董店里触手可及的有形遗物，反衬现代无形数字媒介的脆弱与短暂。"}, "question_type": "例证题", "option_analysis": {"A": "【答非所问】古董店只是引子，作者目的不在介绍古董的出现。", "B": "【过度推断】原文未与日常用品作对比。", "C": "【正解】第一段用有形古董的持久引出第二段无形数字信息保存难题\"those who produce these artifacts seldom make provision for their long-term preservation\"，即引出保存话题。", "D": "【答非所问】作者引用古董非为评论其历史价值，而是为引出数字信息保存问题。"}}, {"q_num": 37, "stem": "Compared with digital objects, tangible artifacts", "options": {"A": "are less subject to their creators’ neglect", "B": "convey information in a more direct way", "C": "require more intentional preservation", "D": "are less likely to suffer serious damage"}, "answer": "B", "hint": {"para": 2, "type": "细节推断题", "focus": "实体文物具有天然的物理持久性，即使被遗弃数百年依然能被后世直接解读。"}, "question_type": "细节推断题", "option_analysis": {"A": "【正反混淆】原文说 analog materials 即使被原作者忽视(neglect)仍有机会存留\"survived often despite their original creators' neglect\"，并非选项所说的\"更不受创作者忽视影响\"这一比较强调。", "B": "【正解】第二段\"The thing itself is the medium that delivers the information\"，实体文物本身即传递信息的媒介，故传递信息更直接。", "C": "【正反混淆】原文说 analog 制作时未尝试有意保存\"no attempts were made at intentional preservation\"，即实体不需要刻意保存，选项反了。", "D": "【偷换概念】原文未就比较严重损坏的可能性，强调的是数字载体一旦格式过时即失效。"}}, {"q_num": 38, "stem": "According to Paragraph 3, librarians’ work may result in ,", "options": {"A": "oversupply of materials", "B": "undervaluation of libraries", "C": "researchers’ underperformance", "D": "users’ overreliance on technology"}, "answer": "B", "hint": {"para": 3, "type": "细节题", "focus": "数字档案管理员若不定期将文件转存到新一代介质上，数据将彻底因解码软件失效而湮灭。"}, "question_type": "细节题", "option_analysis": {"A": "【偷换概念】原文\"embarrassment of historical riches\"是说资料丰富到难以检索，非材料供应过剩(oversupply)。", "B": "【正解】第三段\"Librarians' selfless devotion can act against us when users...saying 'it's all in here' as evidence that libraries are less vital\"，即图书馆员的工作反使人们低估图书馆。", "C": "【无中生有】未提研究者表现不佳。", "D": "【过度推断】原文说用户拿手机证明\"内容都在这里\"，未说用户过度依赖技术。"}}, {"q_num": 39, "stem": "The “ZIP disk” is cited as an example to show .", "options": {"A": "the difficulty of retrieving files through unusual means", "B": "the infeasibility of constantly migrating digital assets", "C": "the possibility of losing information in obsolete formats", "D": "the inconvenience of storing information on analog devices"}, "answer": "C", "hint": {"para": 4, "type": "例证题", "focus": "以90年代红极一时的ZIP软盘如今无法被现代电脑读取为例，生动说明格式淘汰之迅速。"}, "question_type": "例证题", "option_analysis": {"A": "【偷换概念】ZIP disk 例子说明格式过时导致文件无法读取，非\"用不寻常方式检索文件的困难\"。", "B": "【正反混淆】原文说\"Without constant migration...nightmare\"，即必须持续迁移，选项说迁移不可行，相反。", "C": "【正解】第四段\"As technology advances and a format becomes obsolete, the object is useless\"并举 ZIP disk 无法读取，说明过时格式可能丢失信息。", "D": "【偷换概念】ZIP disk 是数字载体例子，非模拟(analog)设备存储不便。"}}, {"q_num": 40, "stem": "Which of the following statements best summarizes the text?", "options": {"A": "Hard work should be done to preserve artifacts.", "B": "Contributions of librarians should be recognized.", "C": "Accessing databases is essential to researchers.", "D": "Keeping digital historical records is a challenge."}, "answer": "D", "hint": {"para": 5, "type": "主旨题", "focus": "全文警告人类正站在丧失当代数字历史记忆的悬崖边，必须建立持久系统性的数字化档案保存机制。"}, "question_type": "主旨题", "option_analysis": {"A": "【范围缩小】\"artifacts\"只指实体文物，未涵盖全文核心的数字信息保存主题。", "B": "【以偏概全】仅末段提及图书馆员贡献，非全文主旨。", "C": "【答非所问】数据库访问只是细节，非主旨。", "D": "【正解】全文围绕数字历史记录难以保存(格式过时、需持续迁移)这一挑战展开，D 最能概括。"}}], "detailed_analysis": "数字历史记录面临的保存危机。与可以在地下保存数千年的羊皮纸与石碑不同，现代数字文件极其依赖特定的软硬件环境，磁盘退磁、格式过时及冷存储维护成本使人类历史面临‘数字黑暗时代’的危险。", "keywords": [{"word": "artifact", "trans": "n. 人工制品，历史遗物"}, {"word": "obsolescence", "trans": "n. 淘汰，过时"}, {"word": "preservation", "trans": "n. 保护，保存"}, {"word": "tangible", "trans": "adj. 有形的，实质的"}, {"word": "longevity", "trans": "n. 寿命，持久性"}, {"word": "archive", "trans": "n./v. 档案，归档"}]}, {"id": "eng2_2021_t3", "exam": "英语二", "year": "2021", "text_num": "Text 3", "title": "微软收购后的“杀手兼并”反垄断策略", "difficulty": "偏难★★★★", "summary": "以微软收购Wunderlist和Sunrise并将其关停并入自身产品为例，剖析科技巨头通过“杀手兼并（Killer Acquisitions）”掐灭竞争对手的反垄断困境。", "paragraphs": ["When Microsoft bought task management app Wunderlist and mobile calendar Sunrise in 2015, it picked two newcomers that were attracting considerable buzz in Silicon Valley. Microsoft's own Office dominates the market for \" productivity \" software, but the start-ups represented a new wave of technology designed from the ground up for the smartphone world.", "Both apps, however, were later scrapped, after Microsoft said it had used their best features in its own products. Their teams of engineers stayed on, making them two of the many \"acqui-hires\" that the biggest companies have used to feed their great hunger for tech talent.", "To Microsoft's critics, the fates of Wunderlist and Sunrise are examples of a remorseless drive by Big Tech to chew up any innovative companies that lie in their path. \"They bought the seedlings and closed them down,\" complained Paul Arnold, a partner at San Francisco-based Switch Ventures, putting an end to businesses that might one day tum into competitors. Microsoft declined to comment.", "Like other start-up investors, Mr. Arnold's own business often depends on selling start-ups to larger tech companies, though he admits to mixed feelings about the result: \"I think these things are good for me, if I put my selfish hat on. But are they good for the American economy? I don't know.\"", "The US Federal Trade Commission says it wants to find the answer to that question. This week, it asked the five most valuable US tech companies for information about their many small acquisitions over the past decade. Although only a research project at this stage, the request has raised the prospect of regulators wading into early- stage tech markets that until now have been beyond their reach.", "Given their combined market value of more than $ 5 .5 trillion, rifling through such small deals-many of them much less prominent than Wunderlist and Sunrise-might seem beside the point. Between them, the five biggest tech companies have spent an average of only $ 3 .4 billion a year on sub- $ 1 billion acquisitions over the past five years-a drop in the ocean compared with their massive financial reserves, and the more than $ 130 billion of venture capital that was invested in the US last year.", "However, critics say the big companies use such deals to buy their most threatening potential competitors before their businesses have a chance to gain momentum, in some cases as part of a \"buy and kill\" tactic to simply close them down."], "questions": [{"q_num": 31, "stem": "What is true about Wunderlist and Sunrise after their acquisitions?", "options": {"A": "Their engineers were retained.", "B": "Their market values declined.", "C": "Their tech features improved.", "D": "Their products were re-priced."}, "answer": "B", "hint": {"para": 1, "type": "细节题", "focus": "第一段提及Wunderlist和Sunrise在被收购后，其原本广受欢迎的独立产品线最终被微软逐步关闭替代。"}, "question_type": "细节题", "option_analysis": {"A": "【误】第二段说两款app虽被scrapped，但their teams of engineers stayed on，即engineers were retained。", "B": "【正解】原文未提供市场价值下降的信息。", "C": "【偷换概念】原文说微软把其best features用于自家产品，而非这两款app自身tech features improved。", "D": "【无中生有】原文完全未提re-priced。"}}, {"q_num": 32, "stem": "Microsoft's critics believe that the big tech companies tend to __ _", "options": {"A": "exaggerate their product quality", "B": "eliminate their potential competitors", "C": "treat new tech talent unfairly", "D": "ignore public opinions"}, "answer": "C", "hint": {"para": 2, "type": "推断题", "focus": "巨头收购初创公司的真实目的往往并非做大该产品，而是消除对自身核心办公软件套件的潜在挑战。"}, "question_type": "推断题", "option_analysis": {"A": "【无中生有】批评者并未说巨头夸大产品质量。", "B": "【误】第三段说这是remorseless drive to chew up any innovative companies，putting an end to businesses that might one day turn into competitors，即消除潜在竞争者。", "C": "【正解】原文是给人才开高价(acqui-hire)，并非treat new tech talent unfairly。", "D": "【无中生有】原文未提巨头ignore public opinions。"}}, {"q_num": 33, "stem": "Paul Arnold is concerned that small acquisitions might __ _", "options": {"A": "weaken big tech companies", "B": "worsen market competition", "C": "harm the national economy", "D": "discourage start-up investors"}, "answer": "D", "hint": {"para": 4, "type": "推断题", "focus": "引用药企与科技圈的‘杀手兼并’概念，阐释扼杀摇篮中创新苗头的隐蔽策略。"}, "question_type": "推断题", "option_analysis": {"A": "【正反混淆】收购通常增强而非弱化大科技公司。", "B": "【偷换概念】Arnold的担忧落脚于经济利弊，而非抽象地worsen market competition。", "C": "【误】第四段Arnold表示are they good for the American economy? I don't know，担忧小额收购可能harm the national economy。", "D": "【正解】Arnold本人也是投资者，未担忧会discourage start-up investors，反承认对自己selfish hat有利。"}}, {"q_num": 34, "stem": "The US Federal Trade Commission intends to", "options": {"A": "limit Big Tech's expansion", "B": "encourage research collaboration", "C": "examine small acquisitions", "D": "supervise start-ups' operation ---"}, "answer": "D", "hint": {"para": 5, "type": "细节题", "focus": "反垄断监管机构以往忽视了这种小额收购，现正面临重新审视并购审查门槛的紧迫任务。"}, "question_type": "细节题", "option_analysis": {"A": "【过度推断】FTC现阶段只是research project，尚未到limit Big Tech's expansion的行动。", "B": "【无中生有】原文未提encourage research collaboration。", "C": "【误】第五段说FTC asked the five most valuable tech companies for information about their many small acquisitions，即examine small acquisitions。", "D": "【正解】FTC审查的是巨头的并购信息，而非supervise start-ups' operation。"}}, {"q_num": 35, "stem": "For the five biggest tech companies, their small acquisitions have __ _", "options": {"A": "brought little financial pressure", "B": "raised few management challenges", "C": "set an example for future deals", "D": "generated considerable profits"}, "answer": "B", "hint": {"para": 7, "type": "细节题", "focus": "呼吁监管者收紧对科技巨头蚕食初创企业行为的审查，保护市场创新活力。"}, "question_type": "细节题", "option_analysis": {"A": "【误】第六段说五巨头每年在小于10亿美元收购上平均只花34亿美元，相对巨额储备是a drop in the ocean，即brought little financial pressure。", "B": "【正解】原文未讨论management challenges。", "C": "【无中生有】原文未说这些收购set an example for future deals。", "D": "【正反混淆】原文强调这些支出相对财力微不足道，而非generated considerable profits。"}}], "detailed_analysis": "微软2015年高价收购爆款任务管理软件Wunderlist和日历软件Sunrise，但在吸纳其技术后迅速关停了这两款独立应用。文章剖析科技巨头通过‘杀手兼并（Killer Acquisitions）’消灭潜在颠覆性竞争对手、巩固自身生态垄断的反竞争手段。", "keywords": [{"word": "acquisition", "trans": "n. 收购，兼并"}, {"word": "buzz", "trans": "n. 热议，轰动"}, {"word": "antitrust", "trans": "adj. 反垄断的"}, {"word": "killer acquisition", "trans": "n. 杀手兼并"}, {"word": "entrench", "trans": "v. 牢固确立，巩固"}, {"word": "disruptive", "trans": "adj. 颠覆性的"}]}, {"id": "eng2_2021_t4", "exam": "英语二", "year": "2021", "text_num": "Text 4", "title": "第一印象与薄片认知理论（Nalini Ambady 研究）", "difficulty": "偏难★★★★", "summary": "心理学实证研究表明，人们依据微小片段（thin slices）形成的第一印象往往比深度理性思考更为精准，探讨潜意识直觉的机制与边界。", "paragraphs": ["We're fairly good at judging people based on first impressions, thin slices of experience ranging from a glimpse of a photo to five-minute interaction, and deliberation can be not only extraneous but intrusive. In one study of the ability she called \"thin slicing,\" the late psychologist Nalini Ambady asked participants to watch silent 10-second video clips of professors and to rate the instructor's overall effectiveness. Their ratings correlated strongly with students' end-of-semester ratings. Another set of participants had to count backward from 1,000 by nines as they watched the clips, occupying their conscious working memory. Their ratings were just as accurate, demonstrating the intuitive nature of the social processing.", "Critically, another group was asked to spend a minute writing down reasons for their judgment, before giving the rating. Accuracy dropped dramatically. Ambady suspected that deliberation focused them on vivid but misleading cues, such as certain gestures or utterances, rather than letting the complex interplay of subtle signals form a holistic impression. She found similar interference when participants watched 15-second clips of pairs of people and judged whether they were strangers, friends, or dating partners.", "Other research shows we're better at detecting deception from thin slices when we rely on intuition instead of reflection. \"It's as if you're driving a stick shift,\" says Judith Hall, a psychologist at Northeastem University, \"and if you start thinking about it too much, you can't remember what you're doing. But if you go on automatic pilot, you're fine. Much of our social life is like that.\"", "Thinking too much can also harm our ability to form preferences. College students' ratings of strawberry jams and college courses aligned better with experts' opinions when the students weren't asked
