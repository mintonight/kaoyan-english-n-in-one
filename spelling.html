<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拼写练习 · 看中文拼英文 | 考研英语 N IN ONE</title>
<style>
:root{
  --bg:#f4ede4; --card:#fdfbf7; --ink:#2d261e; --muted:#796c5e; --line:#e8ded2;
  --accent:#b45309; --accent-soft:#f7ecda; --warn:#b91c1c; --ok:#15803d; --gray:#cdbfae;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;}
.page{max-width:880px;margin:0 auto;padding:44px 20px 80px}
.brand{font-size:11.5px;letter-spacing:.24em;color:var(--accent);font-weight:700}
h1{font-size:clamp(23px,3.3vw,32px);margin:12px 0 8px;letter-spacing:-.01em;line-height:1.25}
.lead{margin:0;color:var(--muted);font-size:13.5px;line-height:1.8}
.hstats{margin:16px 0 0;font-size:12.5px;color:var(--muted);line-height:1.8}
.hstats b{color:var(--accent);font-weight:700}
.hsect{margin:34px 0 0}
.hhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.hhead h2{font-size:17.5px;margin:0;letter-spacing:.01em}
.hdesc{font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.dcard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px 14px;
  cursor:pointer;font-family:inherit;color:var(--ink);transition:border-color .18s,transform .18s,box-shadow .18s}
.dcard:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 14px 30px -24px rgba(25,40,45,.5)}
.dtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dname{font-weight:700;font-size:15px}
.dcount{font-size:11px;color:var(--muted);background:var(--accent-soft);padding:2px 8px;border-radius:99px;white-space:nowrap}
.dsub{font-size:12.5px;color:var(--muted);margin:6px 0 12px;line-height:1.55;height:2.9em;overflow:hidden}
.dbar{height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.dbar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.dmeta{font-size:11.5px;color:var(--muted);margin-top:8px}
.crumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
#btnHome{border:1px solid var(--line);background:transparent;color:var(--muted);font-family:inherit;font-size:13px;
  padding:8px 14px;border-radius:9px;cursor:pointer;transition:all .18s}
#btnHome:hover{color:var(--accent);border-color:var(--accent)}
.crumb .path{font-size:12.5px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 28px 22px;box-shadow:0 26px 60px -42px rgba(25,40,45,.45)}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.progress{height:4px;background:var(--line);border-radius:99px;margin:12px 0 20px;overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}
.cnwrap{margin:0 0 24px;padding:15px 18px;background:var(--accent-soft);border-radius:14px}
.cnlabel{font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:700}
.tag{font-size:11px;letter-spacing:0;color:var(--accent);background:rgba(255,255,255,.5);border:1px solid var(--accent);
  padding:1px 8px;border-radius:99px;margin-left:8px;font-weight:600}

.cn{margin:7px 0 0;font-size:clamp(15.5px,1.9vw,18px);line-height:1.85;color:var(--ink)}
.sentence{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:2.8;padding:8px 2px 2px;min-height:86px;word-wrap:break-word}
.sp{display:inline-block;width:.45em}
.punct{color:var(--muted);font-family:Georgia,serif;padding:0 1px}
.winput{font-family:Georgia,"Times New Roman",serif;font-size:19px;color:var(--ink);background:transparent;
  border:0;border-bottom:2px solid var(--gray);border-radius:0;outline:none;padding:0 2px 1px;margin:0 2px;text-align:center;
  width:5em;min-width:5em;transition:border-color .15s,color .15s,background .15s;vertical-align:baseline}
.winput:focus{border-bottom-color:var(--accent);background:rgba(47,107,94,.04)}
.winput.good{border-bottom-color:var(--ok);color:var(--ok)}
.winput.bad{border-bottom-color:var(--warn);color:var(--warn);background:rgba(193,78,55,.05)}
.winput.ghost{border-bottom-color:var(--ok);color:var(--ok);opacity:.62}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 10px}
.tbtn{border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12.8px;padding:7px 13px;border-radius:9px;cursor:pointer;font-family:inherit;transition:all .18s}
.tbtn:hover{color:var(--accent);border-color:var(--accent)}
.tbtn.holding{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
#btnReveal{touch-action:none;user-select:none;-webkit-user-select:none}
.feedback{margin-top:12px;font-size:14px;line-height:1.9;display:none;min-height:24px}
.feedback.show{display:block}
.fb-ok{color:var(--ok);font-weight:700;font-size:15px}
.fb-bad{color:var(--warn);font-weight:600;font-size:14.5px}
.fb-note{color:var(--muted);font-size:13.5px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;align-items:center}
button.primary{background:var(--accent);color:#fff;border:0;padding:11px 28px;border-radius:11px;font-size:14.5px;cursor:pointer;font-family:inherit;font-weight:700;transition:filter .18s}
button.primary:hover{filter:brightness(1.08)}
button.ghost2{background:transparent;border:1px solid var(--line);color:var(--muted);padding:11px 18px;border-radius:11px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:all .18s}
button.ghost2:hover{color:var(--accent);border-color:var(--accent)}
button:disabled{opacity:.35;cursor:not-allowed}
.foot{margin-top:22px;text-align:center;color:var(--muted);font-size:12.5px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;margin-left:12px;font-family:inherit;padding:0}
.linkbtn:hover{color:var(--accent)}
.keys-fab{position:fixed;right:18px;bottom:18px;z-index:50;border:1px solid var(--line);background:var(--card);color:var(--muted);
  font-family:inherit;font-size:12.5px;padding:9px 14px;border-radius:999px;box-shadow:0 12px 26px -16px rgba(20,30,35,.6);cursor:pointer;transition:all .18s}
.keys-fab:hover{color:var(--accent);border-color:var(--accent)}
.keyhint{margin:6px 0 0;font-size:11.5px;color:var(--muted);line-height:2.1}
.keyhint kbd{font-family:inherit;background:var(--accent-soft);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:11px;color:var(--accent)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(15,22,25,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.modal-card{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:540px;width:100%;max-height:86vh;overflow:auto;padding:22px 24px 20px;box-shadow:0 30px 70px -30px rgba(0,0,0,.55)}
.modal-card h3{margin:0 0 6px;font-size:18px}
.modal-tip{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.8}
.krow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.krow:first-child{border-top:0}
.kname{font-size:14px;font-weight:600}
.kdesc{font-size:11.5px;color:var(--muted);margin-top:2px}
.kbtn{border:1px solid var(--line);background:transparent;color:var(--ink);font-family:inherit;font-size:12.5px;padding:6px 12px;border-radius:8px;cursor:pointer;min-width:132px;text-align:center;white-space:nowrap}
.kbtn:hover{border-color:var(--accent);color:var(--accent)}
.kbtn.rec{color:var(--warn);border-color:var(--warn);background:rgba(193,78,55,.07)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
@media (max-width:640px){
  .page{padding:26px 14px 64px}
  .card{padding:20px 16px 18px;border-radius:16px}
  .sentence,.winput{font-size:17px}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .dcard{padding:12px 13px}
  .nav button{padding:10px 16px}
}

/* ===== 统一风格 · 与阅读区一致的纸感主题 ===== */
body{background:radial-gradient(1200px 500px at 50% -140px,#fbf3e6 0,rgba(251,243,230,0) 70%),var(--bg);
  color:var(--ink);}
.topnav{position:sticky;top:0;z-index:60;background:rgba(250,244,235,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topnav-inner{max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 20px}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.nb-badge{background:linear-gradient(135deg,#b45309,#d97706);color:#fff;font-weight:800;font-size:12.5px;padding:3px 9px;border-radius:6px;letter-spacing:.4px}
.nb-sub{font-size:12px;color:var(--muted);letter-spacing:.12em}
.nav-links{display:flex;align-items:center;gap:8px}
.nav-links a{font-size:12.5px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:6px 12px;border-radius:8px;transition:all .15s;white-space:nowrap}
.nav-links a:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.brand{color:var(--accent)}
.card{box-shadow:0 26px 60px -42px rgba(90,60,30,.45)}
.dcard:hover{box-shadow:0 14px 30px -24px rgba(90,60,30,.5)}
@media(max-width:640px){.nb-sub{display:none}.topnav-inner{padding:9px 14px}.nav-links a{padding:6px 9px;font-size:12px}}
</style>
</head>

<div class="page">
  <header id="hero">
    <div class="brand">SPELLING · 看中文写英文</div>
    <h1>作文句子 &amp; 主题词拼写</h1>
    <p class="lead">先选一组练习：作文整句，或历年真题/必备主题词。每条横线填一个英文单词，标点不用输入；按空格或回车逐词确认——写对变绿、写错变红、没填是灰色。「按住显示答案」按住才显示，松开即恢复你写的内容。主题词整理自《英语二历年主题词汇总及拓展》。</p>
    <p class="hstats" id="hstats"></p>
  </header>

  <section id="home"></section>

  <section id="practice" hidden>
    <div class="crumb">
      <button id="btnHome">← 目录</button>
      <span class="path" id="crumbText"></span>
    </div>
    <div class="card">
      <div class="meta"><span id="metaLeft"></span><span id="metaRight"></span></div>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
      <div class="cnwrap">
        <div class="cnlabel">中文<span class="tag" id="partTag"></span></div>
        <p class="cn" id="cn"></p>
      </div>
      <div class="sentence" id="sentence"></div>
      <div class="tools">
        <button class="tbtn" id="btnSpeak">🔊 朗读答案</button>
        <button class="tbtn" id="btnReveal" title="按住显示答案，松开恢复你输入的内容">👁 按住显示答案</button>
        <button class="tbtn" id="btnClear">⌫ 清空本句</button>
      </div>
      <p class="keyhint" id="keyHint"></p>
      <div class="feedback" id="feedback"></div>
      <div class="nav">
        <button class="ghost2" id="btnPrev">← 上一句</button>
        <button class="primary" id="btnCheck">检查</button>
        <button class="ghost2" id="btnNext">下一句 →</button>
      </div>
    </div>
  </section>

  <footer class="foot"><span id="footStats"></span><button id="btnReset" class="linkbtn">清除练习记录</button></footer>
</div>

<button class="keys-fab" id="btnKeys">⌨ 快捷键</button>

<div class="modal" id="keysModal" hidden>
  <div class="modal-card">
    <h3>快捷键设置</h3>
    <p class="modal-tip">点击右侧按键，再按下新的组合键即可修改（按 Esc 取消）。「按住显示答案」是按住生效、松开消失。</p>
    <div id="keyList"></div>
    <div class="modal-actions">
      <button class="ghost2" id="btnKeysReset">恢复默认</button>
      <button class="primary" id="btnKeysClose">完成</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var DATA = {"SETS":[{"id":"s2026","name":"2026 范文","group":"作文句子","sub":"2026 英语二图表作文 · 9 句","items":[{"part":"第一段","cn":"该柱状图清晰地展示了一项关于人们对儿童户外活动益处的看法的调查结果。","en":"The column chart clearly illustrates the results of a survey on people’s views regarding the benefits of children’s outdoor activities."},{"part":"第一段","cn":"统计数据显示，满足好奇心和增强观察能力位居前列，分别占 54.6% 和 54.5%。","en":"According to the statistics, satisfying curiosity and enhancing observation ability top the list, accounting for 54.6% and 54.5% respectively."},{"part":"第一段","cn":"与此同时，增强体质和加强亲子互动也受到相当关注，分别为 37.2% 和 33.2%。","en":"Meanwhile, building physical fitness and strengthening parent-child interaction also garner notable attention, at 37.2% and 33.2%."},{"part":"第二段","cn":"图表表明，公众普遍认识到户外活动在儿童认知和身体发育中的关键作用。","en":"The chart indicates that the public widely recognizes the crucial role of outdoor activities in children’s cognitive and physical development."},{"part":"第二段","cn":"如今，越来越多的孩子被局限在室内空间和电子屏幕前，这也解释了为什么家长把大自然视为激发好奇心和观察力的理想课堂。","en":"Nowadays, an increasing number of children are confined to indoor spaces and electronic screens, which explains why parents value nature as an ideal classroom to stimulate curiosity and observation."},{"part":"第二段","cn":"此外，与室内学习相比，户外探索天然地鼓励体育锻炼，并创造了宝贵的家庭互动机会。","en":"Furthermore, compared with indoor study, outdoor exploration naturally encourages physical exercise and creates valuable opportunities for family bonding."},{"part":"第三段","cn":"基于以上分析，我们可以有把握地得出结论：户外活动对儿童的全面成长不可或缺。","en":"Based on the above analysis, we can safely conclude that outdoor activities are indispensable for children’s holistic growth."},{"part":"第三段","cn":"因此，家长应留出更多时间陪孩子在户外活动，同时社区应提供更安全的休闲设施。","en":"Therefore, parents should set aside more time to accompany their kids outdoors while communities provide safer recreational facilities."},{"part":"第三段","cn":"只有让孩子拥抱自然，他们才能实现全面发展。","en":"Only if children embrace nature can they achieve well-rounded development."}]},{"id":"s2025","name":"2025 范文","group":"作文句子","sub":"2025 英语二图表作文 · 9 句","items":[{"part":"第一段","cn":"该柱状图清晰地展示了一项关于某社区老年人日常主要休闲活动的调查结果。","en":"The column chart clearly illustrates the results of a survey on the main daily leisure activities of senior citizens in a certain community."},{"part":"第一段","cn":"统计数据显示，看电视以压倒性优势位居第一，占 90.8%，其次是散步，占 68.3%。","en":"According to the statistics, watching TV ranks first by an overwhelming margin, accounting for 90.8%, followed by taking a walk at 68.3%."},{"part":"第一段","cn":"相比之下，园艺、阅读和下棋所占比例要小得多，分别为 34.7%、31.8% 和 18.4%。","en":"By contrast, gardening, reading, and playing chess occupy much smaller proportions, at 34.7%, 31.8%, and 18.4% respectively."},{"part":"第二段","cn":"图表表明，老年人的日常消遣相对单调，严重依赖被动型娱乐。","en":"The chart indicates that the elderly’s daily pastimes are relatively monotonous, heavily reliant on passive entertainment."},{"part":"第二段","cn":"由于退休后身体活动能力下降、社交圈有限，老年人往往选择省力又方便的活动，比如在家看电视或在附近散步，这解释了它们为何占主导。","en":"Due to declining physical mobility and limited social circles after retirement, seniors tend to choose low-effort and accessible activities like watching TV at home or strolling nearby, which explains their dominance."},{"part":"第二段","cn":"然而，缺乏益智性和互动性的活动可能逐渐影响他们的精神活力和社会归属感。","en":"However, a lack of intellectually stimulating and interactive activities may gradually affect their mental vitality and sense of social belonging."},{"part":"第三段","cn":"基于以上分析，我们可以有把握地得出结论：丰富老年人的精神生活值得更多关注。","en":"Based on the above analysis, we can safely conclude that enriching the elderly’s spiritual life deserves greater attention."},{"part":"第三段","cn":"因此，社区应组织多样化的文化俱乐部，同时家庭成员应给予更多陪伴。","en":"Therefore, communities should organize diverse cultural clubs while family members offer more companionship."},{"part":"第三段","cn":"只有让老年人享有丰富多彩、充实有趣的退休生活，他们才能真正实现健康老龄化。","en":"Only if seniors enjoy a colorful and engaging retirement life can they truly achieve healthy aging."}]},{"id":"y2010","name":"2010 年","group":"历年主题词","sub":"主题：手机用户数量的变化","items":[{"part":"主题","cn":"手机用户数量的变化",     if (!v) return "empty";
    if (norm(v) === inp.getAttribute("data-norm")){ inp.classList.add("good"); return "good"; }
    inp.classList.add("bad"); return "bad";
  }
  function focusNext(from){
    var list = inputs(); var i = list.indexOf(from);
    if (i>=0 && i+1<list.length){ list[i+1].focus(); list[i+1].select(); return true; }
    return false;
  }
  function focusFirst(){
    var list = inputs();
    if (list.length && window.innerWidth > 640) list[0].focus();
  }

  /* ---------- home ---------- */
  function renderHome(){
    state.view = "home";
    $("hero").style.display = "block";
    $("practice").hidden = true;
    $("home").hidden = false;

    var totalSets = SETS.length, totalItems = 0, totalMastered = 0;
    SETS.forEach(function(s){ totalItems += s.items.length; totalMastered += masteredCount(s); });
    $("hstats").innerHTML = "<b>" + GROUPS[0].ids.length + "</b> 组作文句子 · <b>" +
      GROUPS[1].ids.length + "</b> 年真题主题词 · <b>" + GROUPS[2].ids.length +
      "</b> 类必备主题词 ｜ 共 <b>" + totalItems + "</b> 个练习项 · 已掌握 <b>" + totalMastered + "</b>";

    var html = "";
    GROUPS.forEach(function(g){
      var groupItems = 0;
      g.ids.forEach(function(id){ groupItems += BY_ID[id].items.length; });
      html += '<div class="hsect"><div class="hhead"><h2>' + esc(g.title) + '</h2>' +
              '<span class="hdesc">' + esc(g.desc) + ' · 共 ' + groupItems + ' 项</span></div><div class="grid">';
      g.ids.forEach(function(id){
        var s = BY_ID[id], m = masteredCount(s), pct = s.items.length ? (m/s.items.length*100) : 0;
        html += '<button class="dcard" data-id="' + s.id + '">' +
          '<div class="dtop"><span class="dname">' + esc(s.name) + '</span><span class="dcount">' + s.items.length + '</span></div>' +
          '<div class="dsub">' + esc(s.sub) + '</div>' +
          '<div class="dbar"><span style="width:' + pct.toFixed(1) + '%"></span></div>' +
          '<div class="dmeta">已掌握 ' + m + ' / ' + s.items.length + '</div></button>';
      });
      html += "</div></div>";
    });
    $("home").innerHTML = html;
    updateFooter();
    window.scrollTo(0,0);
  }

  /* ---------- practice ---------- */
  function openSet(id){
    state.setId = id;
    state.pos = 0;
    state.view = "practice";
    renderPractice();
    window.scrollTo(0,0);
  }

  function renderPractice(){
    var set = curSet(), it = curItem();
    if (!set || !it) { renderHome(); return; }
    state.view = "practice";
    $("hero").style.display = "none";
    $("home").hidden = true;
    $("practice").hidden = false;

    $("crumbText").textContent = set.group + " / " + set.name;

    state.words = wordList(it.en).map(function(o){ return o.word; });
    state.originals = state.words.slice();
    state.revealed = false;
    state.allOk = false;

    $("metaLeft").textContent = set.name;
    $("metaRight").textContent = "第 " + (state.pos+1) + " / " + set.items.length + " 项 · " + state.words.length + " 个单词";
    $("partTag").textContent = it.part || "";
    $("partTag").style.display = it.part ? "inline-block" : "none";
    $("cn").textContent = it.cn;
    $("sentence").innerHTML = buildSentence(it.en);

    var m = masteredCount(set);
    $("progressFill").style.width = (set.items.length ? m/set.items.length*100 : 0).toFixed(1) + "%";

    $("btnPrev").disabled = state.pos === 0;
    var isLastOfSet = state.pos + 1 >= set.items.length;
    var idx = SETS.indexOf(set);
    var hasNextSet = idx >= 0 && idx + 1 < SETS.length;
    $("btnNext").textContent = isLastOfSet ? (hasNextSet ? "下一组 →" : "返回目录 →") : "下一句 →";

    var fb = $("feedback");
    fb.className = "feedback"; fb.innerHTML = "";

    bindInputs();
    focusFirst();
    updateFooter();
    renderKeyHint();
  }

  function bindInputs(){
    inputs().forEach(function(inp){
      inp.addEventListener("input", function(){
        inp.classList.remove("bad","ghost");
        fit(inp);
        var v = inp.value.trim();
        if (!v){ inp.classList.remove("good"); return; }
        if (norm(v) === inp.getAttribute("data-norm")) inp.classList.add("good");
        else inp.classList.remove("good");
      });
      inp.addEventListener("keydown", function(e){
        if (e.key === " " && !e.ctrlKey && !e.altKey && !e.metaKey){
          e.preventDefault();
          if (commit(inp) === "good"){ maybeComplete(); focusNext(inp); }
        } else if (e.key === "Enter" && !e.ctrlKey && !e.altKey && !e.metaKey){
          e.preventDefault();
          var r = commit(inp);
          if (r === "good"){ maybeComplete(); if (!focusNext(inp)) checkAll(); }
          else if (r === "empty"){ focusNext(inp); }
        }
      });
      inp.addEventListener("blur", function(){ commit(inp); maybeComplete(); });
      inp.addEventListener("focus", function(){ if (inp.value) inp.select(); });
    });
  }

  function maybeComplete(){
    if (state.revealed) return;
    var list = inputs(); if (!list.length) return;
    for (var i=0;i<list.length;i++) if (!list[i].classList.contains("good")) return;
    state.allOk = true;
    results[key()] = "ok"; save();
    var fb = $("feedback");
    fb.className = "feedback show";
    fb.innerHTML = '<div class="fb-ok">✅ 全部正确，' + list.length + ' 个单词都拼对了！</div>';
    refreshProgress();
  }

  function checkAll(){
    var list = inputs(); var wrong=0, empty=0;
    list.forEach(function(inp){ var r=commit(inp); if (r==="bad") wrong++; else if (r==="empty") empty++; });
    var fb = $("feedback"); fb.className = "feedback show";
    if (wrong===0 && empty===0){
      state.allOk = true;
      if (!state.revealed){ results[key()]="ok"; save(); fb.innerHTML = '<div class="fb-ok">✅ 全部正确，' + list.length + ' 个单词都拼对了！</div>'; }
      else fb.innerHTML = '<div class="fb-ok">✅ 全部正确（显示过答案，本项不计分）</div>';
      refreshProgress();
    } else {
      if (!state.revealed){ results[key()]="wrong"; save(); }
      var parts = [];
      if (wrong) parts.push("<b>" + wrong + "</b> 个单词有误");
      if (empty) parts.push("<b>" + empty + "</b> 个单词还没写");
      fb.innerHTML = '<div class="fb-bad">还有 ' + parts.join("、") + '，红线和灰线处再改一改。</div>';
    }
  }

  function refreshProgress(){
    var set = curSet(); if (!set) return;
    $("progressFill").style.width = (set.items.length ? masteredCount(set)/set.items.length*100 : 0).toFixed(1) + "%";
    updateFooter();
  }

  var holdActive = false, holdSnapshot = null, holdFb = null;

  function showAnswerHold(){
    if (holdActive || state.view !== "practice") return;
    holdActive = true;
    holdSnapshot = inputs().map(function(inp){
      return { inp: inp, value: inp.value, cls: inp.className, width: inp.style.width };
    });
    var fb = $("feedback");
    holdFb = { cls: fb.className, html: fb.innerHTML };
    holdSnapshot.forEach(function(s, i){
      s.inp.value = state.originals[i] || "";
      fit(s.inp);
      s.inp.classList.remove("good","bad","ghost");
      s.inp.classList.add("ghost");
    });
    fb.className = "feedback show";
    fb.innerHTML = '<div class="fb-note">按住中显示答案…松开立刻恢复你已填写的内容。</div>';
    $("btnReveal").classList.add("holding");
  }

  function hideAnswerHold(){
    if (!holdActive) return;
    holdActive = false;
    if (holdSnapshot){
      holdSnapshot.forEach(function(s){
        s.inp.value = s.value;
        s.inp.className = s.cls;
        s.inp.style.width = s.width;
      });
      holdSnapshot = null;
    }
    var fb = $("feedback");
    if (holdFb){ fb.className = holdFb.cls; fb.innerHTML = holdFb.html; holdFb = null; }
    $("btnReveal").classList.remove("holding");
  }

  function clearSentence(){
    inputs().forEach(function(inp){
      inp.value = ""; fit(inp);
      inp.classList.remove("good","bad","ghost");
    });
    state.revealed = false; state.allOk = false;
    var fb = $("feedback"); fb.className = "feedback"; fb.innerHTML = "";
    var list = inputs();
    if (list.length && window.innerWidth > 640) list[0].focus();
  }

  function goPrev(){
    if (state.pos === 0) return;
    state.pos--; renderPractice(); window.scrollTo(0,0);
  }
  function goNext(){
    var set = curSet();
    if (state.pos + 1 < set.items.length){ state.pos++; renderPractice(); window.scrollTo(0,0); return; }
    var idx = SETS.indexOf(set);
    if (idx >= 0 && idx + 1 < SETS.length){ openSet(SETS[idx+1].id); return; }
    renderHome();
  }

  function updateFooter(){
    var total=0, mastered=0;
    SETS.forEach(function(s){ total += s.items.length; mastered += masteredCount(s); });
    $("footStats").textContent = "全部 " + SETS.length + " 组 · " + total + " 项 · 已掌握 " + mastered + " 项";
  }

  var voice = null;
  function pickVoice(){
    if (!window.speechSynthesis) return null;
    var vs = window.speechSynthesis.getVoices() || [];
    if (!vs.length) return null;
    var prefer = ["Google US English","Microsoft Aria","Microsoft Jenny","Samantha","Alex"];
    for (var p=0;p<prefer.length;p++)
      for (var i=0;i<vs.length;i++)
        if (vs[i].name && vs[i].name.indexOf(prefer[p])!==-1) return vs[i];
    for (var k=0;k<vs.length;k++) if (/^en[-_]US/i.test(vs[k].lang)) return vs[k];
    for (var m=0;m<vs.length;m++) if (/^en/i.test(vs[m].lang)) return vs[m];
    return null;
  }
  function speak(text){
    if (!window.speechSynthesis || !text) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang="en-US"; u.rate=0.82; u.pitch=1;
      var v = pickVoice(); if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    } catch(e){}
  }

  /* ---------- shortcuts ---------- */
  var DEFAULT_KEYS = { reveal:"`", check:"ctrl+enter", prev:"alt+arrowleft", next:"alt+arrowright", clear:"alt+x", speak:"alt+r", home:"alt+h" };
  var ACTIONS = [
    {id:"reveal", name:"按住显示答案", desc:"按住生效，松开恢复"},
    {id:"check", name:"检查本句", desc:"批改整句，全部正确记入掌握"},
    {id:"prev", name:"上一句", desc:"回到上一项"},
    {id:"next", name:"下一句 / 下一组", desc:"进入下一项，本组最后一项进入下一组"},
    {id:"clear", name:"清空本句", desc:"清空所有横线"},
    {id:"speak", name:"朗读答案", desc:"朗读英文原句"},
    {id:"home", name:"返回目录", desc:"回到目录页"}
  ];
  var KEY_LS = "jotjzb-pspx-ktehg-keys";
  var bindings = {};
  (function loadKeys(){
    try { bindings = JSON.parse(localStorage.getItem(KEY_LS) || "{}") || {}; } catch(e){ bindings = {}; }
    for (var dk in DEFAULT_KEYS) if (!bindings[dk]) bindings[dk] = DEFAULT_KEYS[dk];
  })();
  function saveKeys(){ try { localStorage.setItem(KEY_LS, JSON.stringify(bindings)); } catch(e){} }
  function isModifierKey(k){ return k==="Control"||k==="Shift"||k==="Alt"||k==="Meta"||k==="AltGraph"; }
  function comboFromEvent(e){
    var parts = [];
    if (e.ctrlKey) parts.push("ctrl");
    if (e.altKey) parts.push("alt");
    if (e.shiftKey) parts.push("shift");
    if (e.metaKey) parts.push("meta");
    if (isModifierKey(e.key)) return parts.join("+");
    var key = String(e.key || "").toLowerCase();
    if (key === " " || key === "spacebar") key = "space";
    parts.push(key);
    return parts.join("+");
  }
  function prettyKey(combo){
    if (!combo) return "未设置";
    var label = { ctrl:"Ctrl", alt:"Alt", shift:"Shift", meta:"Cmd", enter:"Enter", escape:"Esc", space:"Space", backspace:"Backspace", delete:"Delete", tab:"Tab", arrowleft:"←", arrowright:"→", arrowup:"↑", arrowdown:"↓", "`":"`" };
    return combo.split("+").map(function(p){
      if (label[p]) return label[p];
      if (/^f\d+$/.test(p)) return p.toUpperCase();
      return p.length === 1 ? p.toUpperCase() : p.charAt(0).toUpperCase() + p.slice(1);
    }).join(" + ");
  }
  function actionById(id){ for (var i=0;i<ACTIONS.length;i++) if (ACTIONS[i].id===id) return ACTIONS[i]; return null; }
  var recording = null;
  function renderKeyHint(){
    if (!$("keyHint")) return;
    var items = ["reveal","check","prev","next"].map(function(id){
      return "<kbd>" + prettyKey(bindings[id]) + "</kbd> " + actionById(id).name;
    });
    $("keyHint").innerHTML = "快捷键：" + items.join(" · ") + " · 点右下角「⌨ 快捷键」自定义";
    if ($("btnReveal")) $("btnReveal").title = "按住显示答案（" + prettyKey(bindings.reveal) + "，按住生效）";
    if ($("btnCheck")) $("btnCheck").title = "检查本句（" + prettyKey(bindings.check) + "）";
    if ($("btnPrev")) $("btnPrev").title = "上一句（" + prettyKey(bindings.prev) + "）";
    if ($("btnNext")) $("btnNext").title = "下一句 / 下一组（" + prettyKey(bindings.next) + "）";
  }
  function renderKeyList(){
    var wrap = $("keyList"); if (!wrap) return;
    wrap.innerHTML = "";
    ACTIONS.forEach(function(a){
      var row = document.createElement("div"); row.className = "krow";
      var left = document.createElement("div");
      left.innerHTML = '<div class="kname">' + esc(a.name) + '</div><div class="kdesc">' + esc(a.desc) + '</div>';
      var btn = document.createElement("button");
      btn.className = "kbtn" + (recording === a.id ? " rec" : "");
      btn.textContent = recording === a.id ? "请按下新快捷键…" : prettyKey(bindings[a.id]);
      btn.onclick = function(){ recording = a.id; renderKeyList(); };
      row.appendChild(left); row.appendChild(btn); wrap.appendChild(row);
    });
  }
  function openKeys(){ recording = null; renderKeyList(); $("keysModal").hidden = false; }
  function closeKeys(){ recording = null; $("keysModal").hidden = true; renderKeyHint(); }
  function setBinding(id, combo){
    for (var k in bindings) if (k !== id && bindings[k] === combo) bindings[k] = "";
    bindings[id] = combo; saveKeys();
  }
  function runShortcut(id){
    if (id === "home"){ renderHome(); return; }
    if (state.view !== "practice") return;
    if (id === "check") checkAll();
    else if (id === "prev") goPrev();
    else if (id === "next") goNext();
    else if (id === "clear") clearSentence();
    else if (id === "speak"){ var it = curItem(); if (it) speak(it.en); }
  }
  function shortcutAllowed(e, combo){
    var t = e.target;
    var typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA");
    if (!typing) return true;
    if (/ctrl|alt|meta/.test(combo)) return true;
    var key = String(e.key || "").toLowerCase();
    if (key === "`" || key === "escape" || /^f\d+$/.test(key)) return true;
    return false;
  }
  document.addEventListener("keydown", function(e){
    if (!$("keysModal").hidden){
      if (recording){
        e.preventDefault(); e.stopPropagation();
        if (e.key === "Escape"){ recording = null; renderKeyList(); return; }
        var c = comboFromEvent(e);
        if (!c || isModifierKey(e.key)) return;
        setBinding(recording, c);
        recording = null; renderKeyList(); renderKeyHint();
        return;
      }
      if (e.key === "Escape") closeKeys();
      return;
    }
    if (e.defaultPrevented) return;
    var combo = comboFromEvent(e);
    var id = null;
    for (var k in bindings){ if (bindings[k] && bindings[k] === combo){ id = k; break; } }
    if (!id) return;
    if (!shortcutAllowed(e, combo)) return;
    if (id === "reveal"){ e.preventDefault(); if (!e.repeat) showAnswerHold(); return; }
    e.preventDefault();
    if (e.repeat) return;
    runShortcut(id);
  }, true);
  document.addEventListener("keyup", function(e){
    if (!$("keysModal").hidden) return;
    if (bindings.reveal && comboFromEvent(e) === bindings.reveal) hideAnswerHold();
  }, true);
  $("btnKeys").onclick = openKeys;
  $("btnKeysClose").onclick = closeKeys;
  $("btnKeysReset").onclick = function(){
    bindings = {};
    for (var dk in DEFAULT_KEYS) bindings[dk] = DEFAULT_KEYS[dk];
    saveKeys(); renderKeyList(); renderKeyHint();
  };
  $("keysModal").addEventListener("click", function(e){ if (e.target === this) closeKeys(); });

  $("home").addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest(".dcard") : null;
    if (b && b.dataset.id) openSet(b.dataset.id);
  });
  $("btnHome").onclick = renderHome;
  $("btnSpeak").onclick = function(){ var it=curItem(); if (it) speak(it.en); };
  (function(){
    var btn = $("btnReveal");
    btn.addEventListener("pointerdown", function(e){
      if (e.button && e.button !== 0) return;
      e.preventDefault();
      showAnswerHold();
      try { btn.setPointerCapture(e.pointerId); } catch(err){}
    });
    btn.addEventListener("pointerup", hideAnswerHold);
    btn.addEventListener("pointercancel", hideAnswerHold);
    btn.addEventListener("pointerleave", hideAnswerHold);
    btn.addEventListener("contextmenu", function(e){ e.preventDefault(); });
    btn.addEventListener("keydown", function(e){
      if (e.key === " " || e.key === "Enter"){ e.preventDefault(); showAnswerHold(); }
    });
    btn.addEventListener("keyup", function(e){
      if (e.key === " " || e.key === "Enter"){ e.preventDefault(); hideAnswerHold(); }
    });
    window.addEventListener("pointerup", hideAnswerHold);
    window.addEventListener("blur", hideAnswerHold);
  })();
  $("btnClear").onclick = clearSentence;
  $("btnCheck").onclick = checkAll;
  $("btnPrev").onclick = goPrev;
  $("btnNext").onclick = goNext;
  $("btnReset").onclick = function(){
    if (!window.confirm("确定清除所有练习记录吗？")) return;
    results = {}; save();
    if (state.view === "practice") renderPractice(); else renderHome();
  };

  $("sentence").addEventListener("paste", function(e){
    var cd = e.clipboardData || window.clipboardData; if (!cd) return;
    var t = cd.getData("text"); if (!t || !/\s/.test(t.trim())) return;
    e.preventDefault();
    var parts = t.trim().split(/\s+/).filter(function(x){return x.length;});
    var list = inputs();
    parts.forEach(function(p,i){ if (list[i]){ list[i].value=p; fit(list[i]); commit(list[i]); } });
  });

  if (window.speechSynthesis){ try { window.speechSynthesis.getVoices(); } catch(e){} }

  renderHome();
})();
</script>
</body>
