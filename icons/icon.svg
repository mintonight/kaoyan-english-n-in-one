<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c2119"/>
      <stop offset="55%" stop-color="#1e1611"/>
      <stop offset="100%" stop-color="#140f0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e59a4b"/>
      <stop offset="55%" stop-color="#c46218"/>
      <stop offset="100%" stop-color="#9a3e08"/>
    </linearGradient>
    <linearGradient id="paperL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fdfaf4"/>
      <stop offset="88%" stop-color="#f7efe3"/>
      <stop offset="100%" stop-color="#e6d8c5"/>
    </linearGradient>
    <linearGradient id="paperR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8dac8"/>
      <stop offset="14%" stop-color="#faf4ea"/>
      <stop offset="100%" stop-color="#fdfbf7"/>
    </linearGradient>
  </defs>

  <!-- Deep Espresso Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="#f5e3cb" stroke-opacity="0.14" stroke-width="2.5"/>

  <!-- Subtle Book Shadow -->
  <rect x="92" y="132" width="328" height="270" rx="26" fill="#000" fill-opacity="0.32"/>

  <!-- Copper Book Cover Frame -->
  <rect x="86" y="122" width="340" height="268" rx="24" fill="url(#accent)"/>

  <!-- Left & Right Ivory Pages -->
  <path d="M104 138 H240 C250 138 256 144 256 154 V372 C256 364 249 358 240 358 H104 Z" fill="url(#paperL)"/>
  <path d="M408 138 H272 C262 138 256 144 256 154 V372 C256 364 263 358 272 358 H408 Z" fill="url(#paperR)"/>

  <!-- Center Spine Crease -->
  <line x1="256" y1="146" x2="256" y2="372" stroke="#cbb8a1" stroke-width="2.5"/>

  <!-- Editorial Lines on Left Page -->
  <rect x="132" y="176" width="84" height="14" rx="7" fill="#a84a0c"/>
  <rect x="132" y="212" width="96" height="10" rx="5" fill="#bfb09c"/>
  <rect x="132" y="238" width="82" height="10" rx="5" fill="#bfb09c"/>
  <rect x="132" y="264" width="92" height="10" rx="5" fill="#bfb09c"/>
  <rect x="132" y="290" width="66" height="10" rx="5" fill="#d8cbb8"/>

  <!-- Editorial Lines on Right Page -->
  <rect x="284" y="176" width="54" height="10" rx="5" fill="#bfb09c"/>
  <rect x="284" y="202" width="46" height="10" rx="5" fill="#bfb09c"/>
  <rect x="284" y="228" width="92" height="10" rx="5" fill="#bfb09c"/>

  <!-- Bookmark Ribbon on Right Page -->
  <path d="M352 122 H386 V210 L369 195 L352 210 Z" fill="url(#accent)"/>
  <path d="M352 122 H386 V210 L369 195 L352 210 Z" fill="none" stroke="#fdfbf7" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Refined Gold Pen-Nib Spark Emblem (Bottom Right of Right Page) -->
  <g transform="translate(332, 294)">
    <circle cx="0" cy="0" r="32" fill="#231a14"/>
    <circle cx="0" cy="0" r="30.5" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <path d="M0 -15 L11 3 L0 15 L-11 3 Z" fill="url(#accent)"/>
    <circle cx="0" cy="1" r="3.2" fill="#fdfbf7"/>
    <line x1="0" y1="4.2" x2="0" y2="15" stroke="#231a14" stroke-width="2"/>
  </g>
</svg>
