name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          mkdir -p _site
          # 顶层首页（阅读区 / 拼写练习区）
          if [ -f index.html ]; then
            cp index.html _site/index.html
          else
            cp "考研英语历年巅峰难度阅读研习系统.html" _site/index.html
          fi
          # 子页面
          [ -f reading.html ] && cp reading.html _site/ || true
          [ -f spelling.html ] && cp spelling.html _site/ || true
          [ -f "考研英语历年巅峰难度阅读研习系统.html" ] && cp "考研英语历年巅峰难度阅读研习系统.html" _site/ || true
          # 附带数据与说明，便于页面/下载
          [ -f hardest_reading_final.json ] && cp hardest_reading_final.json _site/ || true
          [ -f README.md ] && cp README.md _site/ || true
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
